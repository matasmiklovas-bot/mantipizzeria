<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryšys</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0b;--panel:#141413;--panel-2:#1b1b19;--hover:#1f1f1c;--line:#262521;--line-2:#363530;
  --text:#ecebe6;--text-2:#b9b6ad;--muted:#85827a;--accent:#ff5b22;--accent-2:#ff7a49;--on-accent:#fff;
  --invert:#ecebe6;--on-invert:#0c0c0b;--shadow:0 20px 50px -20px rgba(0,0,0,.7);
  --s-new:#8f8b82;--s-no_answer:#e0a72e;--s-declined:#e5534b;--s-thinking:#5b9bf0;--s-interested:#3fc97a;
  --d-meeting:#5b9bf0;--d-proposal:#b48cf2;--d-won:#3fc97a;--d-lost:#6d6a63;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f2f0eb;--panel:#faf9f6;--panel-2:#f5f3ee;--hover:#ece9e2;--line:#e0dcd3;--line-2:#cfcabf;
  --text:#161513;--text-2:#3b3934;--muted:#7a766d;--accent:#d9461b;--accent-2:#b8380f;
  --invert:#161513;--on-invert:#faf9f6;--shadow:0 20px 50px -24px rgba(22,21,19,.35);
  --s-new:#9a958b;--s-no_answer:#c08a1e;--s-declined:#b5432f;--s-thinking:#3d6aa3;--s-interested:#2e7a4e;
  --d-meeting:#3d6aa3;--d-proposal:#7a52b3;--d-won:#2e7a4e;--d-lost:#9a958b;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
select option{background:var(--panel);color:var(--text)}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.t2{color:var(--text-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.thin{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.rise{animation:rise .35s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:flex;height:100dvh;flex-direction:column}
@media(min-width:768px){.app{flex-direction:row}}
.rail{display:none;width:80px;flex-shrink:0;flex-direction:column;align-items:center;border-right:1px solid var(--line);background:var(--panel);padding:18px 0 14px}
@media(min-width:768px){.rail{display:flex}}
.logo{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;font-family:"Instrument Serif",serif;font-size:26px;line-height:1;margin-bottom:22px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{position:relative;display:flex;width:66px;flex-direction:column;align-items:center;gap:5px;border-radius:12px;padding:10px 0 9px;font-size:10.5px;color:var(--muted);transition:color .15s,background .15s}
.nav a:hover{color:var(--text);background:var(--hover)}
.nav a[aria-current=page]{color:var(--text);background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current=page] svg{color:var(--accent)}
.badge{position:absolute;top:5px;right:9px;min-width:16px;border-radius:999px;background:var(--accent);padding:0 4px;font-size:9.5px;font-weight:600;line-height:16px;color:#fff;text-align:center}
.railfoot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--hover)}
.main{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.tabs{display:none}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10px;color:var(--muted)}
.tabs a[aria-current=page]{color:var(--text)}.tabs a[aria-current=page] svg{color:var(--accent)}
.banner{position:absolute;inset:0 0 auto 0;z-index:40;padding:9px 16px;text-align:center;font-size:13px;color:#fff;background:var(--accent)}
.banner.info{background:var(--panel-2);color:var(--text-2);border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;border-radius:12px;background:var(--invert);color:var(--on-invert);padding:11px 16px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;overflow:hidden;background:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.scroll{height:100%;overflow-y:auto}
.page{max-width:1240px;margin:0 auto;padding:24px 16px 72px}
@media(min-width:768px){.page{padding:36px 36px 72px}}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1.title{font-size:26px;font-weight:600;letter-spacing:-.025em}
.sub{margin-top:4px;font-size:13px;color:var(--muted)}
.lbl{display:block;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.btn{display:inline-flex;height:36px;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:0 14px;font-size:13px;font-weight:500;border:1px solid var(--line-2);color:var(--text);transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2)}
.btn.inv{background:var(--invert);border-color:var(--invert);color:var(--on-invert)}
.inp{height:42px;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 12px;font-size:16px;color:var(--text)}
@media(min-width:1024px){.inp{font-size:14px}}
.inp:focus{border-color:var(--accent);outline:none}
.inp::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:10px;background:var(--bg);padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{display:flex;height:30px;align-items:center;justify-content:center;gap:6px;border-radius:7px;padding:0 10px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;border:1px solid var(--line);border-radius:999px;padding:0 15px;font-size:13.5px;color:var(--text-2);background:var(--panel)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--invert);color:var(--on-invert);border-color:var(--invert)}
.spill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);padding:1px 10px;font-size:12px;color:var(--text-2);white-space:nowrap}
.empty{display:grid;place-items:center;min-height:60vh;padding:64px 24px;text-align:center}
.empty .big{font-family:"Instrument Serif",serif;font-style:italic;font-size:36px;color:var(--text-2)}
.k{display:block;font-family:"Instrument Serif",serif;font-weight:400;line-height:1;letter-spacing:-.01em}

/* call */
.call{display:flex;height:100%}
.queue{display:none;width:308px;flex-shrink:0;border-right:1px solid var(--line);background:var(--panel);flex-direction:column;min-height:0}
@media(min-width:1024px){.queue{display:flex}}
.queue.sheet{display:flex;position:absolute;inset:0;z-index:30;width:auto}
.qhead{padding:20px 14px 12px}
.goal{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px}
.goal .barw{margin-top:8px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.goal .barw span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px;list-style:none}
.qitem{display:flex;width:100%;flex-direction:column;gap:3px;border-radius:12px;padding:10px 12px;text-align:left;transition:background .12s}
.qitem:hover{background:var(--hover)}
.qitem[aria-current=true]{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.qname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-width:0}
.qmeta{padding-left:14px;font-size:12px;color:var(--muted)}
.center{min-width:0;flex:1;overflow-y:auto}
.mbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px;font-size:13px}
@media(min-width:1024px){.mbar{display:none}}
.pillcount{border-radius:999px;background:var(--invert);color:var(--on-invert);padding:0 7px;font-size:11px}
.focus{max-width:780px;margin:0 auto;padding:24px 16px 32px}
@media(min-width:768px){.focus{padding:34px 34px}}
.ftop{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.fname{margin-top:12px;font-size:30px;font-weight:600;line-height:1.12;letter-spacing:-.03em;word-break:break-word}
@media(min-width:768px){.fname{font-size:38px}}
.phone{margin-top:22px;display:flex;flex-direction:column;gap:12px;padding:12px;background:linear-gradient(180deg,var(--panel-2),var(--panel))}
@media(min-width:640px){.phone{flex-direction:row;align-items:center;padding-left:20px}}
.phone .num{font-family:"Geist Mono",monospace;font-size:25px;white-space:nowrap;margin-top:3px;letter-spacing:-.01em}
.callbtn{display:inline-flex;height:50px;align-items:center;justify-content:center;gap:9px;border-radius:12px;background:var(--accent);padding:0 22px;font-size:15px;font-weight:600;color:#fff;box-shadow:0 10px 30px -12px var(--accent)}
.callbtn:hover{background:var(--accent-2)}
.links{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--text-2)}
.links a,.links span{display:inline-flex;align-items:center;gap:6px}
.u{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.why{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px 18px;position:relative;overflow:hidden}
.why::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.why p{margin-top:8px;font-size:15px;line-height:1.6;color:var(--text)}
.tag{border-radius:999px;background:var(--panel-2);border:1px solid var(--line);padding:1px 9px;text-transform:none;letter-spacing:0;color:var(--text-2);font-size:11.5px;font-weight:500}
.script{margin-top:12px}
.script summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;font-size:13px;font-weight:500}
.script summary::-webkit-details-marker{display:none}
.script[open] summary svg{transform:rotate(180deg)}
.script .body{padding:0 16px 16px;font-size:14px;line-height:1.65;color:var(--text-2)}
.script .say{border-left:2px solid var(--accent);padding:2px 0 2px 12px;color:var(--text);margin:8px 0 14px}
.script dl{display:grid;gap:10px}
.script dt{font-weight:500;color:var(--text)}
.facts{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
@media(min-width:640px){.facts{grid-template-columns:1fr 1fr 1fr}}
.facts dd{margin-top:5px;font-size:13.5px;color:var(--text-2);word-break:break-word}
.outcome{margin-top:28px;padding:16px}
.outcome h2,.panel h2{font-size:13.5px;font-weight:600}
textarea.note{margin-top:12px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-size:16px;line-height:1.55;color:var(--text)}
@media(min-width:1024px){textarea.note{font-size:14px}}
textarea.note:focus{border-color:var(--accent);outline:none}
.obtns{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.obtns{grid-template-columns:repeat(4,1fr)}}
.obtn{display:flex;height:58px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 16px;font-size:14.5px;font-weight:500;transition:border-color .15s,background .15s}
.obtn:hover{background:var(--hover)}
.obtn span{display:inline-flex;align-items:center;gap:9px}
.obtn kbd{display:none;font-family:"Geist Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media(min-width:768px){.obtn kbd{display:inline}}
.dealform{margin-top:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:640px){.dealform{grid-template-columns:1fr 1fr 1fr}}
.dealform .full{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.thread{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.thread.side{width:364px;flex-shrink:0;border-left:1px solid var(--line)}
.thread.below{height:520px;border-top:1px solid var(--line)}
.thead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 12px}
.tlist{flex:1;min-height:0;overflow-y:auto;padding:0 20px 16px;list-style:none;display:flex;flex-direction:column;gap:16px}
.titem{display:flex;gap:12px}
.bubble{margin-top:6px;white-space:pre-wrap;border-radius:4px 12px 12px 12px;background:var(--bg);padding:9px 12px;font-size:13.5px;line-height:1.55;color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line)}
.composer{border-top:1px solid var(--line);padding:12px}
.composer div{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px}
.composer div:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;max-height:128px;min-height:36px;resize:none;padding:8px;font-size:16px}
@media(min-width:1024px){.composer textarea{font-size:14px}}
.composer textarea:focus{outline:none}
.send{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:9px;background:var(--accent);color:#fff}

/* lists */
.filters{margin:22px -4px 0;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.filters button{display:flex;flex-shrink:0;height:32px;align-items:center;gap:8px;border-radius:999px;padding:0 13px;font-size:13px;color:var(--muted);border:1px solid transparent}
.filters button:hover{color:var(--text)}
.filters button[aria-pressed=true]{background:var(--panel-2);color:var(--text);border-color:var(--line-2)}
.filters .n{font-family:"Geist Mono",monospace;font-size:11px;opacity:.6}
.bar{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.bar input{flex:1 1 220px;min-width:0;height:36px;font-size:16px}
@media(min-width:1024px){.bar input{font-size:14px}}
.bar input:focus{outline:none}
.sel{height:32px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px;font-size:13px;color:var(--text-2)}
.rows{list-style:none;margin-top:10px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 16px;border-bottom:1px solid var(--line);border-radius:10px;padding:13px 8px;cursor:pointer;transition:background .12s}
.row:hover{background:var(--panel)}
@media(min-width:900px){.row{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 9.5rem}}
.row .c2{grid-column:span 2;min-width:0}
.row .c3{display:none;min-width:0;font-size:12.5px;color:var(--muted)}
@media(min-width:900px){.row .c2{grid-column:auto}.row .c3{display:flex;align-items:center;gap:8px}.row .st{order:9}}
.st{width:9.5rem;position:relative}
.pick{display:flex;width:100%;height:32px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 10px 0 12px;font-size:13px;color:var(--text-2)}
.menu{position:absolute;right:0;z-index:30;margin-top:6px;width:232px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel-2);padding:4px;box-shadow:var(--shadow);list-style:none}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border-radius:8px;padding:9px 10px;text-align:left;font-size:13px;color:var(--text-2)}
.menu button:hover{background:var(--hover);color:var(--text)}
form.add{margin-top:16px;display:grid;gap:10px;padding:16px}
@media(min-width:640px){form.add{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){form.add{grid-template-columns:repeat(4,1fr)}}
form.add .acts{display:flex;align-items:center;justify-content:flex-end;gap:12px}
@media(min-width:640px){form.add .acts{grid-column:1/-1}}
.req{width:100%;min-height:200px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-family:"Geist Mono",monospace;font-size:12.5px;line-height:1.6;resize:vertical;color:var(--text)}

/* deals */
.board{margin-top:22px;display:grid;gap:14px}
@media(min-width:1000px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 6px;border-bottom:2px solid var(--line)}
.colhead b{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.dcard{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px 14px;transition:border-color .15s,transform .15s}
.dcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.dval{font-family:"Geist Mono",monospace;font-size:15px;font-weight:500}
.drawer{position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.45)}
.drawer .pane{width:min(440px,100%);height:100%;overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);padding:22px;animation:rise .25s both}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}

/* stats */
.tiles{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:18px}
.tile .k{margin-top:12px;font-size:40px}
.tile small{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.tile.hero{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 18%,var(--panel)),var(--panel) 60%);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.panel{margin-top:16px;padding:20px}
.grid2{display:grid;gap:16px;margin-top:16px}
@media(min-width:900px){.grid2{grid-template-columns:1.2fr 1fr}}
.grid2 .panel{margin-top:0}
.funnel{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:120px 1fr 72px;align-items:center;gap:12px;font-size:13px}
.ftrack{height:26px;border-radius:7px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ftrack span{display:block;height:100%;border-radius:6px}
.bars{position:relative;margin-top:16px;height:150px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:3px}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end}
.bars span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--accent)}
table{width:100%;margin-top:12px;border-collapse:collapse;font-size:13px}
th{padding:8px 6px;text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);white-space:nowrap}
td{padding:11px 6px;border-top:1px solid var(--line);vertical-align:middle}
.r{text-align:right}
.tablewrap{overflow-x:auto}
.mini{height:30px;width:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 8px;font-size:13px;text-align:right;color:var(--text)}
.rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--panel-2);font-size:11px;font-weight:600;color:var(--muted)}
.rank.first{background:var(--accent);color:#fff}

<body>
<div class="app">
  <nav class="rail" aria-label="Meniu">
    <a class="logo" href="#" aria-label="Ryšys">R</a>
    <div class="nav" id="nav"></div>
    <div class="railfoot" id="railfoot"></div>
  </nav>
  <main class="main" id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Meniu"></nav>
</div>
<div id="toast"></div>

<script>
/* ===== constants ===== */
const STATUSES=[
  {id:"new",label:"Neskambinta",short:"Neskambinta"},
  {id:"no_answer",label:"Skambinta — neatsiliepė",short:"Neatsiliepė"},
  {id:"declined",label:"Skambinta — nenori",short:"Nenori"},
  {id:"thinking",label:"Skambinta — pagalvos",short:"Pagalvos"},
  {id:"interested",label:"Skambinta — nori",short:"Nori"},
];
const STAGES=[
  {id:"meeting",label:"Susitikimas"},
  {id:"proposal",label:"Pasiūlymas išsiųstas"},
  {id:"won",label:"Laimėta"},
  {id:"lost",label:"Pralaimėta"},
];
const NEEDS=["Svetainė","Svetainės atnaujinimas","Rezervacijų sistema","El. parduotuvė","Vidinė sistema / CRM"];
const REVENUE=["iki 50 tūkst. €","50–150 tūkst. €","150–500 tūkst. €","0,5–1 mln. €","1–5 mln. €","5 mln. € +"];
const RETRY_MS=3*3600e3,DEF_COMMISSION=10,DEF_GOAL=60;
const ICON={
  phone:"M6.6 3.5h2.2l1.4 3.6-1.7 1.1a10 10 0 0 0 4.3 4.3l1.1-1.7 3.6 1.4v2.2a1.8 1.8 0 0 1-1.9 1.8A13.7 13.7 0 0 1 4.8 5.4a1.8 1.8 0 0 1 1.8-1.9Z",
  list:"M8 6h11M8 12h11M8 18h11M4 6h.01M4 12h.01M4 18h.01",
  spark:"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18",
  chart:"M4 20V10M10 20V4M16 20v-7M22 20H2",
  euro:"M17 6.5A7 7 0 1 0 17 17.5M4 10h9M4 14h9",
  users:"M16 19v-1a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v1M9.5 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM21 19v-1a4 4 0 0 0-3-3.9M15.5 3.2a3.5 3.5 0 0 1 0 6.6",
  mail:"M4 6h16v12H4zM4 7l8 6 8-6",
  globe:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18",
  send:"M4 12 20 4l-6 16-2.5-6.5L4 12Z",
  x:"M6 6l12 12M18 6 6 18",
  skip:"M6 6l8 6-8 6V6Zm12 0v12",
  edit:"M4 20h4L19 9l-4-4L4 16v4Zm9-13 4 4",
  plus:"M12 5v14M5 12h14",
  download:"M12 4v12m-5-5 5 5 5-5M4 20h16",
  copy:"M9 9h10v10H9zM5 15V5h10",
  sun:"M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  moon:"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z",
  chev:"m6 9 6 6 6-6",
  shuffle:"M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5",
  target:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0-4a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0-4a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z",
};
const NAV=[["","Skambinti","phone"],["pardavimai","Pardavimai","euro"],["kontaktai","Kontaktai","list"],["komanda","Komanda","users"],["apzvalga","Apžvalga","chart"]];

/* Short call plan per need; {name}, {me}, {cat} are filled in. */
const SCRIPTS={
  "Svetainė":["Laba diena, čia {me}. Skambinu trumpai dėl {name}. Ieškojau jūsų internete ir neradau svetainės. Žmonės, kurie Google ieško „{cat}“, randa konkurentus. Darome paprastas, greitas svetaines per dvi savaites. Ar galiu atsiųsti pavyzdį el. paštu?"],
  "Svetainės atnaujinimas":["Laba diena, čia {me}. Peržiūrėjau {name} svetainę ir pastebėjau dalykų, dėl kurių prarandate klientų (žr. „Kodėl“ aukščiau). Galiu nemokamai atsiųsti trumpą apžvalgą, ką taisyti pirmiausia. Kam geriausia ją siųsti?"],
  "Rezervacijų sistema":["Laba diena, čia {me}. Skambinu dėl {name}. Dabar klientai registruojasi telefonu, taip? Įdiegiame internetinę registraciją: klientai užsiregistruoja patys 24/7, gauna priminimus, o jums mažiau skambučių ir neatvykusių. Ar galiu parodyti, kaip tai atrodytų?"],
  "El. parduotuvė":["Laba diena, čia {me}. Matau, kad {name} prekiauja, bet internetu užsakyti negalima. El. parduotuvė dirba ir naktį, o mokėjimai ateina iš karto. Ar svarstėte pardavinėti internetu?"],
  "Vidinė sistema / CRM":["Laba diena, čia {me}. Skambinu dėl {name}. Kaip dabar sekate užklausas ir klientus: Excel, el. paštas? Darome paprastas sistemas, kur viskas vienoje vietoje ir niekas nepasimeta. Ar galiu užduoti porą klausimų apie jūsų procesą?"],
};
const OBJECTIONS=[
  ["„Neturime laiko“","Suprantu. Užtruks dvi minutes, arba atsiųsiu pavyzdį el. paštu ir pažiūrėsite, kai patogu. Koks adresas?"],
  ["„Per brangu“","Kiek jums atneša vienas naujas klientas? Dažniausiai svetainė atsiperka su keliais klientais. Galiu pasiūlyti paprastesnį variantą."],
  ["„Jau turime / užtenka Facebook“","Puiku. Ar per jį ateina užklausų iš Google? Galiu nemokamai patikrinti ir pasakyti, ką verta pagerinti."],
  ["„Atsiųskite pasiūlymą“","Būtinai. Kad pasiūlymas būtų tikslus: ko labiausiai reikia, ir kas priima sprendimą? Susiskambinkime ketvirtadienį jį aptarti?"],
];

/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=(n,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const stat=id=>STATUSES.find(s=>s.id===id)||STATUSES[0];
const stage=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const sdot=id=>`<span class="dot" style="background:var(--s-${stat(id).id})"></span>`;
const ddot=id=>`<span class="dot" style="background:var(--d-${stage(id).id})"></span>`;
const safeUrl=u=>{const v=/^https?:\/\//i.test(u||"")?u:"https://"+u;return /^https:\/\//i.test(v)?v:""};
const host=u=>{try{return new URL(safeUrl(u)).hostname.replace(/^www\./,"")}catch{return u}};
const tel=p=>"tel:"+String(p||"").replace(/[^\d+]/g,"");
const ms=v=>typeof v==="number"?v:(v?Date.parse(v)||0:0);
const num=v=>{const n=Number(String(v??"").replace(/\s/g,"").replace(",","."));return Number.isFinite(n)?n:0};
const eur=n=>new Intl.NumberFormat("lt-LT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n||0);
const eurShort=n=>Math.abs(n)>=1e4?new Intl.NumberFormat("lt-LT",{notation:"compact",maximumFractionDigits:1}).format(n)+" €":eur(n);
const TZ="Europe/Vilnius";
const dayKey=t=>new Date(t).toLocaleDateString("sv-SE",{timeZone:TZ});
const monthKey=t=>dayKey(t).slice(0,7);
const hm=t=>new Date(t).toLocaleTimeString("lt-LT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
function when(t){
  t=ms(t);if(!t)return"—";const d=Date.now()-t;
  if(d>=0&&d<6e4)return"ką tik";
  if(d>=0&&d<36e5)return`prieš ${Math.floor(d/6e4)} min.`;
  if(dayKey(t)===dayKey(Date.now()))return`šiandien ${hm(t)}`;
  if(dayKey(t)===dayKey(Date.now()-864e5))return`vakar ${hm(t)}`;
  if(dayKey(t)===dayKey(Date.now()+864e5))return`rytoj ${hm(t)}`;
  return new Date(t).toLocaleDateString("lt-LT",{timeZone:TZ,month:"long",day:"numeric"})+" "+hm(t);
}
/* Lithuanian plural: 1 / 2–9 / 0,10–20 */
const pl=(n,one,few,many)=>{const a=Math.abs(n)%100,b=a%10;return`${n} ${b===1&&a!==11?one:b>=2&&b<=9&&(a<10||a>19)?few:many}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
let toastT;function toast(t){const el=$("toast");el.innerHTML=`<div class="toast rise">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML="",3400)}
const LSKEY="rysys.theme";
function theme(){try{return localStorage.getItem(LSKEY)||"dark"}catch{return"dark"}}
function setTheme(t){try{localStorage.setItem(LSKEY,t)}catch{}document.documentElement.dataset.theme=t}
document.documentElement.dataset.theme=theme();

/* ===== state ===== */
let db=null,user=null,downloads=null,meId=null,isOwner=false;
let leads=[],acts=[],deals=[],team={},names={},avatars={};
const S={conn:"wait",loaded:false,tab:"queue",scope:"mine",sel:null,skipped:new Set(),sheet:false,filter:"all",q:"",sort:"created",who:"all",adding:false,finding:false,menu:null,
  note:"",askWhen:false,custom:"",dealAsk:false,editing:false,composer:"",busy:false,hover:null,dealOpen:null,dealFilter:"open",period:"month",
  form:{industry:"",city:"",revenue:[],needs:[],count:10},reqText:""};

/* ===== people & roles ===== */
const PALETTE=["#5b9bf0","#3fc97a","#b48cf2","#e5534b","#e0a72e","#3fb8c4","#d97bb6"];
const pcolor=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
const who=id=>!id?"Niekas":id===meId?(names[id]||"Aš"):(names[id]||"Komandos narys");
const firstName=id=>who(id).split(/\s+/)[0];
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("")||"?";
function avatar(id,size=28){
  const n=who(id);
  if(id&&avatars[id])return`<span class="avatar" style="width:${size}px;height:${size}px"><img alt="" src="${esc(avatars[id])}"></span>`;
  return`<span class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px;background:${id?pcolor(id):"var(--line-2)"}">${id?esc(initials(n)):"–"}</span>`;
}
const member=id=>team[id]||{id,role:"caller",commission:DEF_COMMISSION,goal:DEF_GOAL};
const isManager=()=>isOwner||member(meId).role==="manager";
function people(){
  const ids=new Set([...Object.keys(team),...acts.map(a=>a.author),...leads.map(l=>l.assignee),...deals.map(d=>d.owner)].filter(Boolean));
  if(meId)ids.add(meId);
  return[...ids];
}
let resolving=false;
async function resolveNames(){
  if(!user||resolving)return;
  const ids=people().filter(i=>!(i in names));if(!ids.length)return;
  resolving=true;
  try{const ps=await user.profiles(ids);for(const i of ids){names[i]=ps[i]?.name||"";avatars[i]=ps[i]?.avatarUrl||""}}catch{}
  resolving=false;render(true);
}

/* ===== money ===== */
const commissionOf=d=>num(d.value)*(num(member(d.owner).commission)/100);
const profitOf=d=>num(d.value)-num(d.cost)-commissionOf(d);
function inPeriod(t,p=S.period){
  t=ms(t);if(!t)return false;
  if(p==="month")return monthKey(t)===monthKey(Date.now());
  if(p==="prev"){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return monthKey(t)===monthKey(d.getTime())}
  if(p==="year")return dayKey(t).slice(0,4)===dayKey(Date.now()).slice(0,4);
  return true;
}

/* ===== queue ===== */
function place(l,now=Date.now()){
  const T=v=>ms(v);
  if(l.status==="interested")return{l,tab:"won",rank:0,key:-T(l.updatedAt),label:"Nori",tone:"var(--s-interested)"};
  if(l.status==="declined")return null;
  if(l.status==="thinking"){const due=T(l.callbackAt);
    if(!due||due<=now)return{l,tab:"queue",rank:0,key:due,label:"Perskambinti dabar",tone:"var(--s-thinking)"};
    return{l,tab:"waiting",rank:0,key:due,label:"Perskambinti "+when(due),tone:"var(--s-thinking)"};}
  if(l.status==="no_answer"){const last=T(l.lastCalledAt),label=`Neatsiliepė ×${l.attempts||1}`;
    if(now-last>=RETRY_MS)return{l,tab:"queue",rank:2,key:last,label,tone:"var(--s-no_answer)"};
    return{l,tab:"waiting",rank:1,key:last+RETRY_MS,label:"Bandyti vėl "+when(last+RETRY_MS),tone:"var(--s-no_answer)"};}
  return{l,tab:"queue",rank:1,key:-T(l.createdAt),label:"Naujas",tone:"var(--accent)"};
}
const mine=l=>!l.assignee||l.assignee===meId;
function queues(){
  const q={queue:[],waiting:[],won:[]},now=Date.now();
  for(const l of leads){if(S.scope==="mine"&&!mine(l))continue;const p=place(l,now);if(p)q[p.tab].push(p)}
  for(const k in q)q[k].sort((a,b)=>a.rank-b.rank||a.key-b.key);
  return q;
}
function current(q){
  if(S.sel){const l=leads.find(x=>x.id===S.sel);if(l)return place(l)||{l,tab:"waiting",label:"Nenori",tone:"var(--muted)"};}
  return q.queue.find(p=>!S.skipped.has(p.l.id))||null;
}
const callsBy=(id,pred=()=>true)=>acts.filter(a=>a.kind==="call"&&a.author===id&&pred(a));

/* ===== writes ===== */
async function put(col,id,doc){
  if(!db){toast("Debesis nepasiekiamas: pakeitimas neišsaugotas.");return false}
  try{await db.collection(col).doc(id).set(doc);return true}
  catch(e){toast(e?.code==="invalid_argument"?"Neturi teisės keisti šių duomenų.":e?.code==="quota_exceeded"?"Duomenų bazė pilna.":"Nepavyko išsaugoti. Bandyk dar kartą.");return false}
}
const saveLead=l=>put("leads",l.id,l);
async function addAct(a){await put("activities",uid(),{...a,author:meId||"",createdAt:Date.now()})}
async function logCall(l,status,extra={}){
  if(S.busy)return;S.busy=true;
  const now=Date.now();
  const next={...l,status,callbackAt:status==="thinking"?(extra.callbackAt||null):null,attempts:(l.attempts||0)+1,lastCalledAt:now,lastCalledBy:meId||"",assignee:l.assignee||meId||"",updatedAt:now};
  delete next.fresh;delete next.note;
  const note=S.note.trim();
  leads=leads.map(x=>x.id===l.id?next:x);
  S.note="";S.askWhen=false;S.dealAsk=false;S.custom="";S.sel=null;history.replaceState(null,"","#");
  render();
  if(await saveLead(next)){
    await addAct({leadId:l.id,kind:"call",status,note});
    if(extra.deal){
      const d={id:uid(),leadId:l.id,leadName:l.name,owner:meId||"",title:extra.deal.title||l.need||"Svetainė",value:num(extra.deal.value),cost:num(extra.deal.cost),stage:extra.deal.stage||"meeting",note,createdAt:now,updatedAt:now,closedAt:extra.deal.stage==="won"?now:null};
      deals=[d,...deals];
      if(await put("deals",d.id,d))await addAct({leadId:l.id,kind:"deal",status:d.stage,note:`Sandoris: ${eur(d.value)}`});
      toast(`Sandoris sukurtas: ${eur(d.value)}`);
    }
  }
  S.busy=false;render();
}
async function setStatus(id,status){
  const l=leads.find(x=>x.id===id);if(!l||l.status===status)return;
  const next={...l,status,callbackAt:status==="thinking"?l.callbackAt||null:null,updatedAt:Date.now()};
  leads=leads.map(x=>x.id===id?next:x);render();
  if(await saveLead(next))await addAct({leadId:id,kind:"status",status,note:""});
}
async function assign(id,to){
  const l=leads.find(x=>x.id===id);if(!l||l.assignee===to)return;
  const next={...l,assignee:to,updatedAt:Date.now()};leads=leads.map(x=>x.id===id?next:x);render();
  await saveLead(next);
}
async function saveDeal(d,prevStage){
  d={...d,updatedAt:Date.now()};
  if(d.stage==="won"&&!d.closedAt)d.closedAt=Date.now();
  if(d.stage!=="won"&&d.stage!=="lost")d.closedAt=null;
  if(d.stage==="lost"&&!d.closedAt)d.closedAt=Date.now();
  deals=deals.map(x=>x.id===d.id?d:x);render();
  if(await put("deals",d.id,d)&&prevStage!==d.stage)await addAct({leadId:d.leadId,kind:"deal",status:d.stage,note:`${stage(d.stage).label}: ${eur(d.value)}`});
}
async function sendNote(l){const note=S.composer.trim();if(!note)return;S.composer="";render();await addAct({leadId:l.id,kind:"note",status:null,note})}
async function saveMember(id,patch){const m={...member(id),...patch,id};team[id]=m;render();await put("team",id,m)}
async function distribute(){
  const callers=people().filter(id=>member(id).role!=="manager");
  const pool=callers.length?callers:people();
  const todo=leads.filter(l=>!l.assignee&&l.status==="new");
  if(!pool.length||!todo.length){toast(todo.length?"Nėra kam paskirstyti.":"Nėra nepriskirtų naujų kontaktų.");return}
  toast(`Skirstoma ${todo.length} kontaktų tarp ${pool.length} žmonių…`);
  let i=0;
  for(const l of todo){const to=pool[i++%pool.length];const next={...l,assignee:to,updatedAt:Date.now()};leads=leads.map(x=>x.id===l.id?next:x);await saveLead(next)}
  render();toast(`Paskirstyta: ${pl(todo.length,"kontaktas","kontaktai","kontaktų")}.`);
}

/* ===== data ===== */
async function connect(){
  const c=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(!c){S.conn="none";render();return}
  [db,user,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")].map(p=>p.catch(()=>null)));
  if(user){try{meId=await user.id();isOwner=await user.isOwner()}catch{}}
  if(!db){S.conn="none";render();return}
  let got=false;const timer=setTimeout(()=>{if(!got){S.conn="slow";render()}},10000);
  const fail=e=>{clearTimeout(timer);S.conn=e?.code==="revoked"?"revoked":"error";S.loaded=true;render()};
  db.collection("leads").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(timer);S.conn="ok"}
    leads=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;render(true);resolveNames();
  },fail);
  db.collection("activities").orderBy("createdAt","desc").limit(1000).onSnapshot(snap=>{acts=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames()},()=>{});
  db.collection("deals").onSnapshot(snap=>{deals=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames()},()=>{});
  let joined=false;
  db.collection("team").onSnapshot(snap=>{
    team=Object.fromEntries(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
    if(!joined&&meId&&!snap.metadata.fromCache){joined=true;if(!team[meId])saveMember(meId,{role:isOwner?"manager":"caller",commission:DEF_COMMISSION,goal:DEF_GOAL,joinedAt:Date.now()})}
    render(true);resolveNames();
  },()=>{});
}

/* ===== shell ===== */
const route=()=>(location.hash||"").replace(/^#/,"");
function renderShell(){
  const r=route(),q=leads.filter(l=>l.status==="new"&&mine(l)).length;
  const navHtml=(withBadge)=>NAV.map(([h,t,i])=>`<a href="#${h}" ${r===h?'aria-current="page"':""}>${icon(i,20)}${t}${withBadge&&h===""&&q?`<span class="badge tnum">${q>99?"99+":q}</span>`:""}</a>`).join("");
  $("nav").innerHTML=navHtml(true);$("tabs").innerHTML=navHtml(false);
  $("railfoot").innerHTML=`<button class="iconbtn" data-act="theme" title="Keisti temą" aria-label="Keisti temą">${icon(theme()==="dark"?"sun":"moon",18)}</button>${meId?`<span title="${esc(who(meId))}">${avatar(meId,34)}</span>`:""}`;
}
function connBanner(){
  if(S.conn==="none")return`<div class="banner">Duomenų bazė čia nepasiekiama. Atidaryk šią nuorodą Safari naršyklėje per claude.ai (prisijungęs).</div>`;
  if(S.conn==="slow")return`<div class="banner info">Duomenys kraunasi ilgiau nei įprastai…</div>`;
  if(S.conn==="error")return`<div class="banner">Nepavyko pasiekti duomenų. Perkrauk puslapį.</div>`;
  if(S.conn==="revoked")return`<div class="banner">Prieiga prie šio sąrašo nutraukta.</div>`;
  return"";
}

function viewDeals(){

      <div class="card tile"><span class="lbl">Pelnas ${per}</span><span class="k tnum" style="color:${prof>=0?"var(--text)":"var(--s-declined)"}">${eurShort(prof)}</span><small>po savikainos ir komisinių</small></div>
      <div class="card tile"><span class="lbl">Atviri sandoriai</span><span class="k tnum">${eurShort(pipe)}</span><small>${pl(open.length,"derinamas","derinami","derinamų")}</small></div>
      <div class="card tile"><span class="lbl">Laimima</span><span class="k tnum">${winRate===null?"—":winRate+" %"}</span><small>${pl(closed.length,"uždarytas","uždaryti","uždarytų")}</small></div></div>
    <div class="board">${STAGES.map(s=>{const items=shown(s.id);return`<section class="col">
      <div class="colhead"><b>${ddot(s.id)}${s.label}</b><span class="mono tnum muted" style="font-size:12px">${items.length} · ${eurShort(items.reduce((a,d)=>a+num(d.value),0))}</span></div>
      ${items.length?items.map(d=>`<button class="dcard rise" data-act="deal-open" data-id="${esc(d.id)}">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span class="trunc" style="font-weight:600;font-size:14px">${esc(d.leadName||"—")}</span><span class="dval tnum">${eur(d.value)}</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px" class="muted"><span class="trunc">${esc(d.title||"")}</span><span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">${avatar(d.owner,18)}${when(d.updatedAt)}</span></div>

/* ===== team view ===== */
function memberStats(id){
  const c=callsBy(id),today=dayKey(Date.now());
  const cT=c.filter(a=>dayKey(ms(a.createdAt))===today),cM=c.filter(a=>inPeriod(a.createdAt,"month"));
  const won=deals.filter(d=>d.owner===id&&d.stage==="won"&&inPeriod(d.closedAt,"month"));
  const rev=won.reduce((a,d)=>a+num(d.value),0);
  return{today:cT.length,month:cM.length,reached:cM.filter(a=>a.status!=="no_answer").length,interested:cM.filter(a=>a.status==="interested").length,won:won.length,rev,comm:won.reduce((a,d)=>a+commissionOf(d),0),leads:leads.filter(l=>l.assignee===id&&l.status!=="declined").length};
}

      ${mgr?`<button class="btn pri" data-act="distribute" ${unassigned?"":"disabled"}>${icon("shuffle",15)} Paskirstyti ${pl(unassigned,"naują kontaktą","naujus kontaktus","naujų kontaktų")}</button>`:""}</div>

        <td class="r mono tnum">${s.month}</td><td class="r mono tnum">${s.reached}</td><td class="r mono tnum">${s.won}</td>

/* ===== overview ===== */
function viewOverview(){
  const counts=Object.fromEntries(STATUSES.map(s=>[s.id,0]));leads.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
  // Each later step is a subset of the earlier one, so the funnel never exceeds 100 %.
  const ids=new Set(leads.map(l=>l.id)),dealLead=new Set(deals.map(d=>d.leadId).filter(i=>ids.has(i)));
  const wonSet=new Set(deals.filter(d=>d.stage==="won").map(d=>d.leadId).filter(i=>ids.has(i)));
  const wantSet=new Set([...leads.filter(l=>l.status==="interested").map(l=>l.id),...dealLead]);
  const reachSet=new Set([...leads.filter(l=>["declined","thinking","interested"].includes(l.status)).map(l=>l.id),...wantSet]);
  const callSet=new Set([...leads.filter(l=>l.status!=="new").map(l=>l.id),...reachSet]);
  const called=callSet.size,reached=reachSet.size;
  const won=deals.filter(d=>d.stage==="won"),wonM=won.filter(d=>inPeriod(d.closedAt,"month"));
  const revM=wonM.reduce((a,d)=>a+num(d.value),0),profM=wonM.reduce((a,d)=>a+profitOf(d),0);
  const pipe=deals.filter(d=>d.stage==="meeting"||d.stage==="proposal").reduce((a,d)=>a+num(d.value),0);
  const calls=acts.filter(a=>a.kind==="call"),today=dayKey(Date.now());
  const todayCalls=calls.filter(a=>dayKey(ms(a.createdAt))===today).length;
  const teamGoal=people().filter(id=>member(id).role!=="manager"||id===meId).reduce((a,id)=>a+(num(member(id).goal)||DEF_GOAL),0);
  const days=[...Array(14)].map((_,i)=>dayKey(Date.now()-(13-i)*864e5));
  const byDay=days.map(d=>calls.filter(a=>dayKey(ms(a.createdAt))===d).length),max=Math.max(1,...byDay),hv=S.hover;
  const steps=[["Kontaktai",leads.length,"var(--s-new)"],["Paskambinta",called,"var(--s-no_answer)"],["Pasiekta",reached,"var(--s-thinking)"],["Nori",wantSet.size,"var(--s-interested)"],["Laimėta",wonSet.size,"var(--accent)"]];
  const leaders=people().map(id=>({id,s:memberStats(id)})).sort((a,b)=>b.s.rev-a.s.rev||b.s.month-a.s.month).slice(0,5);
  return`<div class="scroll thin"><div class="page">
    <div class="ph"><div><h1 class="title">Apžvalga</h1><p class="sub">${new Date().toLocaleDateString("lt-LT",{timeZone:TZ,weekday:"long",month:"long",day:"numeric"})}</p></div></div>
    <div class="tiles">
      <div class="card tile hero"><span class="lbl">Pajamos šį mėnesį</span><span class="k tnum">${eurShort(revM)}</span><small>pelnas ${eur(profM)}</small></div>
      <div class="card tile"><span class="lbl">Atviri sandoriai</span><span class="k tnum">${eurShort(pipe)}</span><small>${pl(deals.filter(d=>d.stage==="meeting"||d.stage==="proposal").length,"derinamas","derinami","derinamų")}</small></div>
      <div class="card tile"><span class="lbl">Skambučių šiandien</span><span class="k tnum">${todayCalls}</span><small>komandos tikslas ${teamGoal}</small></div>
      <div class="card tile"><span class="lbl">Pasiekiamumas</span><span class="k tnum">${called?Math.round(reached/called*100)+" %":"—"}</span><small>${reached} iš ${called} atsiliepė</small></div></div>
    <div class="grid2">
      <section class="card panel"><h2>Piltuvėlis</h2><div class="funnel">${steps.map(([t,c,col],i)=>{const base=steps[0][1]||1,prev=i?steps[i-1][1]:0;return`<div class="frow"><span class="t2">${t}</span><div class="ftrack"><span style="width:${Math.max(c?2:0,c/base*100)}%;background:${col}"></span></div><span class="mono tnum r">${c}${i&&prev?` <span class="muted" style="font-size:11px">${Math.round(c/prev*100)}%</span>`:""}</span></div>`}).join("")}</div></section>
      <section class="card panel"><h2>Lyderiai šį mėnesį</h2>${leaders.length?`<table><tbody>${leaders.map(({id,s},i)=>`<tr><td style="width:30px"><span class="rank ${i===0&&s.rev+s.month>0?"first":""}">${i+1}</span></td><td><span style="display:inline-flex;align-items:center;gap:8px">${avatar(id,24)}${esc(who(id))}</span></td><td class="r mono tnum">${s.month} skamb.</td><td class="r mono tnum" style="font-weight:600">${eur(s.rev)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="margin-top:12px;font-size:13px">Dar nėra duomenų.</p>`}</section></div>
    <section class="card panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Skambučiai per 14 dienų</h2><span class="muted tnum" style="font-size:12px">${hv!==null?`${esc(days[hv])}: ${byDay[hv]}`:`iš viso ${byDay.reduce((a,b)=>a+b,0)} · daugiausia ${max}`}</span></div>
      <div class="bars">${byDay.map((c,i)=>`<button data-act="bar" data-i="${i}" aria-label="${esc(days[i])}: ${c} skambučių"><span style="height:${c/max*100}%;opacity:${hv===null||hv===i?1:.3}"></span></button>`).join("")}</div>
      <div class="muted" style="margin-top:8px;display:flex;justify-content:space-between;font-size:11px"><span>${esc(days[0].slice(5).replace("-","."))}</span><span>šiandien</span></div></section>
    <section class="card panel"><h2>Kontaktai pagal statusą</h2>
      <div style="margin-top:14px;display:flex;height:12px;gap:2px;overflow:hidden;border-radius:999px" role="img" aria-label="Kontaktų pasiskirstymas">${leads.length?STATUSES.filter(s=>counts[s.id]).map(s=>`<div title="${s.short}: ${counts[s.id]}" style="flex-grow:${counts[s.id]};background:var(--s-${s.id})"></div>`).join(""):`<div style="flex:1;background:var(--line)"></div>`}</div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 22px">${STATUSES.map(s=>`<span style="display:inline-flex;align-items:center;gap:8px;font-size:13px" class="t2">${sdot(s.id)}${s.short} <b class="mono tnum" style="color:var(--text);font-weight:500">${counts[s.id]}</b></span>`).join("")}</div></section>
  </div></div>`;
}

/* ===== render ===== */
function render(bg){
  const a=document.activeElement,key=a?.dataset?.key,sel=key&&"selectionStart" in a?[a.selectionStart,a.selectionEnd]:null;
  const sc=document.querySelector(".center,.scroll"),top=sc?.scrollTop||0;
  const pane=document.querySelector(".drawer .pane"),ptop=pane?.scrollTop||0;
  const tl=$("tlist"),tAtBottom=!tl||tl.scrollHeight-tl.scrollTop-tl.clientHeight<40;
  if(bg&&document.querySelector(".drawer form")?.contains(a))return; // live data must not wipe a deal being edited
  renderShell();
  const r=route();
  $("main").innerHTML=connBanner()+(r==="kontaktai"?viewContacts():r==="pardavimai"?viewDeals():r==="komanda"?viewTeam():r==="apzvalga"?viewOverview():viewCall());
  const sc2=document.querySelector(".center,.scroll");if(sc2)sc2.scrollTop=top;
  const p2=document.querySelector(".drawer .pane");if(p2)p2.scrollTop=ptop;
  const tl2=$("tlist");if(tl2&&tAtBottom)tl2.scrollTop=tl2.scrollHeight;
  if(key){const el=document.querySelector(`[data-key="${key}"]`);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch{}}}
}

/* ===== events ===== */
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-stop]"))return;
  const b=e.target.closest("[data-act]");
  if(!b){if(S.menu){S.menu=null;render()}return}
  if(b.tagName==="FORM")return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==="drawer-bg"&&e.target.closest("[data-stop-bg]"))return;
  switch(act){
    case"theme":setTheme(theme()==="dark"?"light":"dark");render();break;
    case"tab":S.tab=b.dataset.v;render();break;
    case"scope":S.scope=b.dataset.v;S.sel=null;render();break;
    case"pick":S.sel=id;S.sheet=false;S.editing=false;S.askWhen=false;S.dealAsk=false;history.replaceState(null,"","#");render();break;
    case"sheet-open":S.sheet=true;render();break;
    case"sheet-close":S.sheet=false;render();break;
    case"skip":{const c=current(queues());if(c){S.skipped.add(c.l.id);S.sel=null;S.note="";render()}break}
    case"outcome":{const c=current(queues());if(!c)break;const s=b.dataset.s;
      if(s==="thinking"){S.askWhen=true;render()}else if(s==="interested"){S.dealAsk=true;render()}else logCall(c.l,s);break}
    case"callback":{const c=current(queues());if(!c)break;const d=new Date();d.setDate(d.getDate()+Number(b.dataset.d));d.setHours(10,0,0,0);logCall(c.l,"thinking",{callbackAt:d.getTime()});break}
    case"callback-custom":{const c=current(queues()),t=Date.parse(S.custom);if(c&&t)logCall(c.l,"thinking",{callbackAt:t});break}
    case"ask-back":S.askWhen=false;render();break;
    case"deal-back":S.dealAsk=false;render();break;
    case"deal-skip":{const c=current(queues());if(c)logCall(c.l,"interested");break}
    case"edit-toggle":S.editing=!S.editing;render();break;
    case"edit-close":S.editing=false;render();break;
    case"filter":S.filter=b.dataset.v;render();break;
    case"add-toggle":S.adding=!S.adding;S.finding=false;render();break;
    case"find-toggle":S.finding=!S.finding;S.adding=false;render();break;
    case"find-open":S.finding=true;break;
    case"find-close":S.finding=false;render();break;
    case"menu":e.stopPropagation();S.menu=S.menu===id?null:id;render();break;
    case"set":e.stopPropagation();S.menu=null;setStatus(id,b.dataset.s);break;
    case"open":if(e.target.closest(".st,.c3"))break;S.sel=id;S.scope="all";location.hash="";break;
    case"fchip":{const arr=S.form[b.dataset.arr],v=b.dataset.v;S.form[b.dataset.arr]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];render();break}
    case"fcount":S.form.count=Number(b.dataset.v);render();break;
    case"req":S.reqText=buildRequest();render();
      try{await navigator.clipboard.writeText(S.reqText);toast("Nukopijuota. Įklijuok į pokalbį su Claude.")}
      catch{const t=$("reqbox");t?.focus();t?.select();toast("Pažymėjau tekstą, nukopijuok jį rankiniu būdu.")}break;
    case"csv":exportCsv();break;
    case"bar":S.hover=S.hover===Number(b.dataset.i)?null:Number(b.dataset.i);render();break;
    case"period":S.period=b.dataset.v;render();break;
    case"deal-open":S.dealOpen=id;render();break;
    case"drawer-bg":case"drawer-close":S.dealOpen=null;render();break;
    case"deal-open-lead":S.dealOpen=null;S.sel=id;S.scope="all";location.hash="";break;
    case"distribute":b.disabled=true;await distribute();break;
  }
});
document.addEventListener("input",e=>{
  const k=e.target.dataset?.key;if(!k)return;const v=e.target.value;
  if(k==="note")S.note=v;
  else if(k==="composer"){S.composer=v;const s=e.target.closest("form")?.querySelector(".send");if(s)s.disabled=!v.trim()}
  else if(k==="custom"){S.custom=v;render()}
  else if(k==="q"){S.q=v;render()}
  else if(k.startsWith("f."))S.form[k.slice(2)]=v;
});
document.addEventListener("change",e=>{
  const t=e.target,k=t.dataset||{};
  if(k.key==="sort"){S.sort=t.value;render()}
  else if(k.key==="who"){S.who=t.value;render()}
  else if(k.assign!==undefined)assign(k.assign,t.value);
  else if(k.role!==undefined)saveMember(k.role,{role:t.value});
  else if(k.comm!==undefined)saveMember(k.comm,{commission:Math.max(0,Math.min(100,num(t.value)))});
  else if(k.goal!==undefined)saveMember(k.goal,{goal:Math.max(1,Math.round(num(t.value))||DEF_GOAL)});
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.dataset?.key==="composer"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const c=current(queues());if(c)sendNote(c.l);return}
  if(e.key==="Escape"){if(S.dealOpen){S.dealOpen=null;render();return}if(S.menu){S.menu=null;render();return}}
  if(t.closest("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(route()!==""||S.editing||S.dealAsk)return;
  const map={"1":"no_answer","2":"declined","3":"thinking","4":"interested"};
  const c=current(queues());if(!c||!map[e.key])return;
  e.preventDefault();const s=map[e.key];
  if(s==="thinking"){S.askWhen=true;render()}else if(s==="interested"){S.dealAsk=true;render()}else logCall(c.l,s);
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,act=f.dataset.act;
  if(act==="note-form"){const c=current(queues());if(c)sendNote(c.l);return}
  const d=Object.fromEntries(new FormData(f));for(const k in d)d[k]=String(d[k]).trim().slice(0,2000);
  if(act==="edit-form"){
    const c=current(queues());if(!c)return;
    const next={...c.l,...d,updatedAt:Date.now()};leads=leads.map(x=>x.id===next.id?next:x);S.editing=false;render();
    if(await saveLead(next))toast("Išsaugota.");
  }else if(act==="deal-form"){
    const c=current(queues());if(!c)return;
    if(!(num(d.value)>0)){toast("Įrašyk sumą arba spausk „Be sandorio“.");return}
    logCall(c.l,"interested",{deal:{value:d.value,cost:d.cost,stage:d.stage,title:d.title}});
  }else if(act==="deal-edit"){
    const old=deals.find(x=>x.id===S.dealOpen);if(!old)return;
    const next={...old,stage:d.stage,value:num(d.value),cost:num(d.cost),title:d.title,owner:d.owner||old.owner,note:d.note};
    S.dealOpen=null;await saveDeal(next,old.stage);toast("Sandoris išsaugotas.");
  }else if(act==="add-form"){
    if(!d.name)return;
    const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\b(uab|mb|ii|ab|vsi)\b/g,"").replace(/[^a-z0-9]/g,"");
    const pk=s=>String(s||"").replace(/\D/g,"").slice(-8);
    if(leads.some(l=>(d.companyCode&&l.companyCode===d.companyCode)||(pk(d.phone).length===8&&pk(l.phone)===pk(d.phone))||norm(l.name)===norm(d.name))){toast("Toks kontaktas jau yra sąraše.");return}
    const now=Date.now(),l={id:uid(),name:d.name,companyCode:d.companyCode||"",category:d.category||"",city:d.city||"",phone:d.phone||"",email:d.email||"",website:d.website||"",revenue:"",need:d.need||"Svetainė",reason:"",source:"",status:"new",callbackAt:null,attempts:0,lastCalledAt:null,lastCalledBy:"",assignee:"",createdBy:meId||"",createdAt:now,updatedAt:now};
    leads=[l,...leads];S.adding=false;render();
    if(await saveLead(l))await addAct({leadId:l.id,kind:"created",status:null,note:""});
  }
});

async function exportCsv(){
  const cell=v=>/[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  const head=["Pavadinimas","Statusas","Atsakingas","Telefonas","El. paštas","Sritis","Miestas","Pajamos","Reikia","Svetainė","Įmonės kodas","Bandymų","Paskutinis skambutis","Sandorio suma","Sandorio etapas","Šaltinis"];
  const rows=leads.map(l=>{const d=deals.find(x=>x.leadId===l.id);return[l.name,stat(l.status).label,l.assignee?who(l.assignee):"",l.phone,l.email,l.category,l.city,l.revenue,l.need,l.website,l.companyCode,String(l.attempts||0),l.lastCalledAt?new Date(ms(l.lastCalledAt)).toISOString():"",d?String(num(d.value)):"",d?stage(d.stage).label:"",l.source].map(v=>cell(String(v||"")))});
  const csv="﻿"+[head,...rows].map(r=>r.join(";")).join("\n");
  if(downloads){try{await downloads.save({filename:`rysys-${dayKey(Date.now())}.csv`,data:csv});return}catch(e){if(e?.code==="declined")return}}
  try{await navigator.clipboard.writeText(csv);toast("CSV nukopijuotas. Įklijuok į Excel ar Google Sheets.")}catch{toast("Nepavyko eksportuoti.")}
}

addEventListener("hashchange",()=>{S.menu=null;S.sheet=false;S.dealOpen=null;render()});
matchMedia("(min-width:1280px)").addEventListener("change",render);
setInterval(()=>render(true),60000);
render();
connect();
</script>
</body>
</html>
