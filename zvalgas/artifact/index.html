<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Žvalgas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --paper:#f2f0eb;--surface:#faf9f6;--ink:#161513;--ink-2:#3b3934;--muted:#7a766d;
  --line:#e0dcd3;--line-2:#cfcabf;--accent:#d9461b;--accent-ink:#b8380f;
  --rail:#161513;--rail-2:#2a2824;--rail-text:#a8a398;
  --s-new:#9a958b;--s-no_answer:#c08a1e;--s-declined:#b5432f;--s-thinking:#3d6aa3;--s-interested:#2e7a4e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
.serif{font-family:"Instrument Serif",Georgia,serif}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.thin{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* shell */
.app{display:flex;height:100dvh;flex-direction:column}
@media(min-width:768px){.app{flex-direction:row}}
.rail{display:none;width:76px;flex-shrink:0;flex-direction:column;align-items:center;background:var(--rail);color:var(--rail-text);padding:16px 0}
@media(min-width:768px){.rail{display:flex}}
.logo{font-family:"Instrument Serif",serif;font-size:30px;line-height:1;color:var(--paper);margin-bottom:24px}
.logo span{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{position:relative;display:flex;width:64px;flex-direction:column;align-items:center;gap:4px;border-radius:12px;padding:10px 0;font-size:10.5px}
.nav a:hover{color:var(--paper)}
.nav a[aria-current=page]{background:var(--rail-2);color:var(--paper)}
.nav a[aria-current=page]::before{content:"";position:absolute;left:-6px;top:12px;height:24px;width:3px;border-radius:3px;background:var(--accent)}
.badge{position:absolute;top:4px;right:8px;border-radius:999px;background:var(--accent);padding:0 4px;font-size:9px;font-weight:500;line-height:14px;color:#fff}
.me{margin-top:auto}
.main{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.tabs{display:none}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:10.5px;color:var(--muted)}
.tabs a[aria-current=page]{color:var(--ink)}
.banner{position:absolute;inset:0 0 auto 0;z-index:40;padding:8px 16px;text-align:center;font-size:13px;color:#fff;background:var(--accent)}
.banner.info{background:var(--ink)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:60;border-radius:10px;background:var(--ink);color:var(--paper);padding:10px 14px;font-size:13px;box-shadow:0 12px 32px -12px rgba(0,0,0,.4)}
.avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:500;overflow:hidden;background:var(--muted)}
.avatar img{width:100%;height:100%;object-fit:cover}
.scroll{height:100%;overflow-y:auto}
.page{max-width:1200px;margin:0 auto;padding:24px 20px 64px}
@media(min-width:768px){.page{padding:32px 32px 64px}}
h1.title{font-size:24px;font-weight:600;letter-spacing:-.02em}
.sub{margin-top:4px;font-size:13px;color:var(--muted)}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.btn{display:inline-flex;height:36px;align-items:center;gap:6px;border-radius:8px;padding:0 14px;font-size:13px;border:1px solid var(--line-2)}
.btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.btn:disabled{opacity:.4}
.inp{height:42px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:16px}
.inp:focus{border-color:var(--ink);outline:none}
.inp::placeholder,textarea::placeholder{color:#7a766db3}
.card{border:1px solid var(--line);border-radius:16px;background:var(--surface)}

/* call */
.call{display:flex;height:100%}
.queue{display:none;width:300px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);flex-direction:column;min-height:0}
@media(min-width:1024px){.queue{display:flex}}
.queue.sheet{display:flex;position:absolute;inset:0;z-index:30;width:auto}
.qhead{padding:20px 16px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:12px;border-radius:8px;background:var(--paper);padding:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{display:flex;height:32px;align-items:center;justify-content:center;gap:6px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(22,21,19,.08)}
.qlist{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px;list-style:none}
.qitem{display:flex;width:100%;flex-direction:column;gap:2px;border-radius:12px;padding:10px 12px;text-align:left}
.qitem:hover,.qitem[aria-current=true]{background:var(--paper)}
.qitem[aria-current=true]{box-shadow:inset 0 0 0 1px var(--line)}
.qname{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-width:0}
.qname span:last-child,.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qmeta{padding-left:14px;font-size:12px;color:var(--muted)}
.center{min-width:0;flex:1;overflow-y:auto}
.mbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:rgba(242,240,235,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 20px;font-size:13px}
@media(min-width:1024px){.mbar{display:none}}
.pillcount{border-radius:999px;background:var(--ink);color:var(--paper);padding:0 6px;font-size:11px}
.focus{max-width:760px;margin:0 auto;padding:24px 20px 32px}
@media(min-width:768px){.focus{padding:32px 32px}}
.ftop{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.fname{margin-top:12px;font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
@media(min-width:768px){.fname{font-size:34px}}
.phone{margin-top:24px;display:flex;flex-direction:column;gap:12px;padding:12px}
@media(min-width:640px){.phone{flex-direction:row;align-items:center;padding-left:20px}}
.phone .num{font-family:"Geist Mono",monospace;font-size:24px;white-space:nowrap;margin-top:2px}
.callbtn{display:inline-flex;height:48px;align-items:center;justify-content:center;gap:8px;border-radius:12px;background:var(--accent);padding:0 20px;font-size:15px;font-weight:500;color:#fff}
.links{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13.5px;color:var(--ink-2)}
.links a,.links span{display:inline-flex;align-items:center;gap:6px}
.u{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px}
.why{margin-top:24px;border-radius:16px;background:var(--ink);color:var(--paper);padding:16px 20px}
.why .lbl{color:var(--rail-text);display:flex;align-items:center;gap:8px}
.why .tag{border-radius:999px;background:var(--rail-2);padding:2px 8px;text-transform:none;letter-spacing:0;color:var(--paper)}
.why p{margin-top:8px;font-size:15px;line-height:1.6}
.facts{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
@media(min-width:640px){.facts{grid-template-columns:1fr 1fr 1fr}}
.facts dd{margin-top:4px;font-size:13.5px;color:var(--ink-2);word-break:break-word}
.outcome{margin-top:32px;padding:16px}
.outcome h2,.panel h2{font-size:13px;font-weight:500}
textarea.note{margin-top:12px;width:100%;resize:vertical;border:1px solid var(--line);border-radius:12px;background:rgba(242,240,235,.6);padding:12px;font-size:16px;line-height:1.55}
textarea.note:focus{border-color:var(--ink);outline:none}
.obtns{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.obtns{grid-template-columns:repeat(4,1fr)}}
.obtn{display:flex;height:56px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;background:rgba(242,240,235,.4);padding:0 16px;font-size:14.5px;font-weight:500}
.obtn span{display:inline-flex;align-items:center;gap:8px}
.obtn kbd{display:none;font-family:"Geist Mono",monospace;font-size:11px;color:var(--muted)}
@media(min-width:768px){.obtn kbd{display:inline}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:13.5px;color:var(--ink-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.thread{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.thread.side{width:360px;flex-shrink:0;border-left:1px solid var(--line)}
.thread.below{height:520px;border-top:1px solid var(--line)}
.thead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 12px}
.tlist{flex:1;min-height:0;overflow-y:auto;padding:0 20px 16px;list-style:none;display:flex;flex-direction:column;gap:16px}
.titem{display:flex;gap:12px}
.bubble{margin-top:6px;white-space:pre-wrap;border-radius:4px 12px 12px 12px;background:var(--paper);padding:8px 12px;font-size:13.5px;line-height:1.55;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.spill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:1px 10px;font-size:12px;color:var(--ink-2)}
.composer{border-top:1px solid var(--line);padding:12px}
.composer div{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px}
.composer div:focus-within{border-color:var(--ink)}
.composer textarea{flex:1;max-height:128px;min-height:36px;resize:none;padding:8px;font-size:16px}
.composer textarea:focus{outline:none}
.send{display:grid;place-items:center;width:36px;height:36px;flex-shrink:0;border-radius:8px;background:var(--ink);color:var(--paper)}
.send:disabled{opacity:.3}
.empty{display:grid;place-items:center;min-height:70%;padding:64px 24px;text-align:center}
.empty .big{font-family:"Instrument Serif",serif;font-style:italic;font-size:34px;color:var(--ink-2)}

/* contacts */
.filters{margin:24px -4px 0;display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.filters button{display:flex;flex-shrink:0;height:32px;align-items:center;gap:8px;border-radius:999px;padding:0 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.filters .n{font-family:"Geist Mono",monospace;font-size:11px;opacity:.6}
.bar{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.bar input{flex:1 1 220px;min-width:0;height:36px;font-size:16px}
.bar input:focus{outline:none}
.rows{list-style:none;margin-top:12px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 16px;border-bottom:1px solid var(--line);border-radius:8px;padding:14px 8px;cursor:pointer}
.row:hover{background:var(--surface)}
@media(min-width:768px){.row{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 9.5rem}}
.row .c2{grid-column:span 2;min-width:0}
.row .c3{display:none;min-width:0;font-size:12.5px;color:var(--muted)}
@media(min-width:768px){.row .c2{grid-column:auto}.row .c3{display:block}.row .st{order:9}}
.st{width:9rem;position:relative}
.pick{display:flex;width:100%;height:32px;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 10px 0 12px;font-size:13px;color:var(--ink-2)}
.menu{position:absolute;right:0;z-index:30;margin-top:6px;width:224px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px;box-shadow:0 12px 32px -12px rgba(22,21,19,.25);list-style:none}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border-radius:8px;padding:9px 10px;text-align:left;font-size:13px;color:var(--ink-2)}
.menu button:hover{background:var(--paper)}
form.add{margin-bottom:20px;display:grid;gap:10px;padding:16px}
@media(min-width:640px){form.add{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){form.add{grid-template-columns:repeat(4,1fr)}}
form.add .acts{display:flex;align-items:center;justify-content:flex-end;gap:12px}
@media(min-width:640px){form.add .acts{grid-column:1/-1}}

/* search */
.sgrid{display:grid;gap:40px}
@media(min-width:1024px){.sgrid{grid-template-columns:400px minmax(0,1fr)}}
.req{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;font-family:"Geist Mono",monospace;font-size:12.5px;line-height:1.6;resize:vertical}

/* stats */
.tiles{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:768px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{padding:16px}
.tile b{display:block;margin-top:8px;font-family:"Instrument Serif",serif;font-weight:400;font-size:40px;line-height:1}
.tile small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
.panel{margin-top:24px;padding:20px}
.stack{margin-top:16px;display:flex;height:12px;gap:2px;overflow:hidden;border-radius:999px}
.legend{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;list-style:none}
@media(min-width:640px){.legend{grid-template-columns:repeat(5,1fr)}}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.bars{position:relative;margin-top:16px;height:160px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:2px}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end}
.bars span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--ink)}
table{width:100%;margin-top:12px;border-collapse:collapse;font-size:13px}
th{padding:8px 0;text-align:left;font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td{padding:10px 0;border-top:1px solid var(--line)}
.r{text-align:right}
.two{display:grid;gap:24px}
@media(min-width:768px){.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Meniu">
    <a class="logo" href="#">Ž<span>.</span></a>
    <div class="nav" id="nav"></div>
    <div class="me" id="me"></div>
  </nav>
  <main class="main" id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Meniu"></nav>
</div>
<div id="toast"></div>

<script>
/* ---------- constants ---------- */
const STATUSES=[
  {id:"new",label:"Neskambinta",short:"Neskambinta"},
  {id:"no_answer",label:"Skambinta — neatsiliepė",short:"Neatsiliepė"},
  {id:"declined",label:"Skambinta — nenori",short:"Nenori"},
  {id:"thinking",label:"Skambinta — pagalvos",short:"Pagalvos"},
  {id:"interested",label:"Skambinta — nori",short:"Nori"},
];
const NEEDS=["Svetainė","Svetainės atnaujinimas","Rezervacijų sistema","El. parduotuvė","Vidinė sistema / CRM"];
const REVENUE=["iki 50 tūkst. €","50–150 tūkst. €","150–500 tūkst. €","0,5–1 mln. €","1–5 mln. €","5 mln. € +"];
const RETRY_MS=3*3600e3;
const ICON={
  phone:"M6.6 3.5h2.2l1.4 3.6-1.7 1.1a10 10 0 0 0 4.3 4.3l1.1-1.7 3.6 1.4v2.2a1.8 1.8 0 0 1-1.9 1.8A13.7 13.7 0 0 1 4.8 5.4a1.8 1.8 0 0 1 1.8-1.9Z",
  list:"M8 6h11M8 12h11M8 18h11M4 6h.01M4 12h.01M4 18h.01",
  spark:"M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18",
  chart:"M4 20V10M10 20V4M16 20v-7M22 20H2",
  mail:"M4 6h16v12H4zM4 7l8 6 8-6",
  globe:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18",
  send:"M4 12 20 4l-6 16-2.5-6.5L4 12Z",
  x:"M6 6l12 12M18 6 6 18",
  skip:"M6 6l8 6-8 6V6Zm12 0v12",
  edit:"M4 20h4L19 9l-4-4L4 16v4Zm9-13 4 4",
  plus:"M12 5v14M5 12h14",
  download:"M12 4v12m-5-5 5 5 5-5M4 20h16",
  copy:"M9 9h10v10H9zM5 15V5h10",
  arrow:"M5 12h14m-5-5 5 5-5 5",
};
const NAV=[["","Skambinti","phone"],["kontaktai","Kontaktai","list"],["paieska","Paieška","spark"],["statistika","Statistika","chart"]];

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon=(n,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
const stat=id=>STATUSES.find(s=>s.id===id)||STATUSES[0];
const sdot=id=>`<span class="dot" style="background:var(--s-${stat(id).id})"></span>`;
const safeUrl=u=>{const v=/^https?:\/\//i.test(u||"")?u:"https://"+u;return /^https:\/\//i.test(v)?v:""};
const host=u=>{try{return new URL(safeUrl(u)).hostname.replace(/^www\./,"")}catch{return u}};
const tel=p=>"tel:"+String(p||"").replace(/[^\d+]/g,"");
const ms=v=>typeof v==="number"?v:(v?Date.parse(v)||0:0);
const TZ="Europe/Vilnius";
const dayKey=t=>new Date(t).toLocaleDateString("lt-LT",{timeZone:TZ});
const hm=t=>new Date(t).toLocaleTimeString("lt-LT",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
function when(t){
  t=ms(t);if(!t)return"—";const d=Date.now()-t;
  if(d>=0&&d<6e4)return"ką tik";
  if(d>=0&&d<36e5)return`prieš ${Math.floor(d/6e4)} min.`;
  if(dayKey(t)===dayKey(Date.now()))return`šiandien ${hm(t)}`;
  if(dayKey(t)===dayKey(Date.now()-864e5))return`vakar ${hm(t)}`;
  if(dayKey(t)===dayKey(Date.now()+864e5))return`rytoj ${hm(t)}`;
  return new Date(t).toLocaleDateString("lt-LT",{timeZone:TZ,month:"long",day:"numeric"})+" "+hm(t);
}
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
let toastT;function toast(t){const el=$("toast");el.innerHTML=`<div class="toast rise">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML="",3200)}

/* ---------- state ---------- */
let db=null,user=null,downloads=null,meId=null;
let leads=[],acts=[],names={},avatars={};
const S={conn:"wait",loaded:false,tab:"queue",sel:null,skipped:new Set(),sheet:false,filter:"all",q:"",sort:"created",adding:false,menu:null,
  note:"",askWhen:false,custom:"",editing:false,composer:"",busy:false,hover:null,
  form:{industry:"",city:"",revenue:[],needs:[],count:10},reqText:""};

/* ---------- queue ---------- */
function place(l,now=Date.now()){
  const T=v=>ms(v);
  if(l.status==="interested")return{l,tab:"won",rank:0,key:-T(l.updatedAt),label:"Nori",tone:"var(--s-interested)"};
  if(l.status==="declined")return null;
  if(l.status==="thinking"){const due=T(l.callbackAt);
    if(!due||due<=now)return{l,tab:"queue",rank:0,key:due,label:"Perskambinti dabar",tone:"var(--s-thinking)"};
    return{l,tab:"waiting",rank:0,key:due,label:"Perskambinti "+when(due),tone:"var(--s-thinking)"};}
  if(l.status==="no_answer"){const last=T(l.lastCalledAt),label=`Neatsiliepė ×${l.attempts||1}`;
    if(now-last>=RETRY_MS)return{l,tab:"queue",rank:2,key:last,label,tone:"var(--s-no_answer)"};
    return{l,tab:"waiting",rank:1,key:last+RETRY_MS,label:"Bandyti vėl "+when(last+RETRY_MS),tone:"var(--s-no_answer)"};}
  return{l,tab:"queue",rank:1,key:-T(l.createdAt),label:"Naujas",tone:"var(--accent)"};
}
function queues(){
  const q={queue:[],waiting:[],won:[]},now=Date.now();
  for(const l of leads){const p=place(l,now);if(p)q[p.tab].push(p)}
  for(const k in q)q[k].sort((a,b)=>a.rank-b.rank||a.key-b.key);
  return q;
}
function current(q){
  if(S.sel){const l=leads.find(x=>x.id===S.sel);if(l)return place(l)||{l,tab:"waiting",label:"Nenori",tone:"var(--muted)"};}
  return q.queue.find(p=>!S.skipped.has(p.l.id))||null;
}

const PALETTE=["#3d6aa3","#2e7a4e","#8a5a9e","#b5432f","#c08a1e","#3f7f86","#6b6b2f"];
const pcolor=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]};
const who=id=>id===meId?(names[id]||"Aš"):(names[id]||"Komandos narys");
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("")||"?";
function avatar(id,size=28){
  const n=who(id);
  if(avatars[id])return`<span class="avatar" style="width:${size}px;height:${size}px"><img alt="" src="${esc(avatars[id])}"></span>`;
  return`<span class="avatar" style="width:${size}px;height:${size}px;font-size:${size*.4}px;background:${pcolor(id||n)}">${esc(initials(n))}</span>`;
}
let resolving=false;
async function resolveNames(){
  if(!user||resolving)return;
  const ids=[...new Set([meId,...acts.map(a=>a.author),...leads.map(l=>l.lastCalledBy)].filter(Boolean))];
  const missing=ids.filter(i=>!(i in names));if(!missing.length)return;
  resolving=true;
  try{const ps=await user.profiles(ids);for(const i of ids){names[i]=ps[i]?.name||"";avatars[i]=ps[i]?.avatarUrl||""}}catch{}
  resolving=false;render();
}

/* ---------- writes ---------- */
async function saveLead(l){
  if(!db){toast("Debesis nepasiekiamas — pakeitimas neišsaugotas.");return false}
  try{await db.collection("leads").doc(l.id).set(l);return true}
  catch(e){toast(e?.code==="invalid_argument"?"Neturi teisės keisti šio sąrašo.":"Nepavyko išsaugoti. Bandyk dar kartą.");return false}
}
async function addAct(a){
  if(!db)return;
  try{await db.collection("activities").doc(uid()).set({...a,author:meId||"",createdAt:Date.now()})}catch{toast("Nepavyko įrašyti istorijos.")}
}
async function logCall(l,status,callbackAt){
  if(S.busy)return;S.busy=true;
  const now=Date.now();
  const next={...l,status,callbackAt:status==="thinking"?(callbackAt||null):null,attempts:(l.attempts||0)+1,lastCalledAt:now,lastCalledBy:meId||"",updatedAt:now};
  delete next.fresh;
  const note=S.note.trim();
  leads=leads.map(x=>x.id===l.id?next:x);
  S.note="";S.askWhen=false;S.custom="";S.sel=null;history.replaceState(null,"","#");
  render();
  if(await saveLead(next))await addAct({leadId:l.id,kind:"call",status,note});
  S.busy=false;render();
}
async function setStatus(id,status){
  const l=leads.find(x=>x.id===id);if(!l||l.status===status)return;
  const next={...l,status,callbackAt:status==="thinking"?l.callbackAt||null:null,updatedAt:Date.now()};
  leads=leads.map(x=>x.id===id?next:x);render();
  if(await saveLead(next))await addAct({leadId:id,kind:"status",status,note:""});
}
async function sendNote(l){
  const note=S.composer.trim();if(!note)return;S.composer="";render();
  await addAct({leadId:l.id,kind:"note",status:null,note});
}

/* ---------- data ---------- */
async function connect(){
  const c=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(!c){S.conn="none";render();return}
  [db,user,downloads]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")].map(p=>p.catch(()=>null)));
  if(user){try{meId=await user.id()}catch{}}
  if(!db){S.conn="none";render();return}
  let got=false;
  const timer=setTimeout(()=>{if(!got){S.conn="slow";render()}},10000);
  db.collection("leads").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(timer);S.conn="ok"}
    leads=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;render();resolveNames();
  },e=>{clearTimeout(timer);S.conn=e.code==="revoked"?"revoked":"error";S.loaded=true;render()});
  db.collection("activities").orderBy("createdAt","desc").limit(1000).onSnapshot(snap=>{
    acts=snap.docs.map(d=>({...d.data(),id:d.id}));render();resolveNames();
  },()=>{});
}

  const F=S.form,chip=(arr,v)=>`<button class="chip" data-act="fchip" data-arr="${arr}" data-v="${esc(v)}" aria-pressed="${F[arr].includes(v)}">${esc(v)}</button>`;
  return`<div class="scroll thin"><div class="page"><div class="sgrid">
    <section><h1 class="title">Paieška</h1><p class="sub">Užpildyk filtrus ir nusiųsk užklausą Claude. Jis suras įmones internete ir įrašys jas tiesiai į šį sąrašą.</p>
      <div style="margin-top:28px;display:flex;flex-direction:column;gap:24px">
        <div><span class="lbl" style="margin-bottom:8px">Sritis</span><input class="inp" data-key="f.industry" value="${esc(F.industry)}" placeholder="kirpyklos, autoservisai, statybos…"></div>
        <div><span class="lbl" style="margin-bottom:8px">Miestas</span><input class="inp" data-key="f.city" value="${esc(F.city)}" placeholder="Visa Lietuva"></div>
        <div><span class="lbl" style="margin-bottom:8px">Metinės pajamos</span><div class="chips">${REVENUE.map(v=>chip("revenue",v)).join("")}</div></div>
        <div><span class="lbl" style="margin-bottom:8px">Ko trūksta</span><div class="chips">${NEEDS.map(v=>chip("needs",v)).join("")}</div></div>
        <div><span class="lbl" style="margin-bottom:8px">Kiekis</span><div class="chips">${[10,20,30,50].map(c=>`<button class="chip mono" data-act="fcount" data-v="${c}" aria-pressed="${F.count===c}">${c}</button>`).join("")}</div></div>
        <button class="btn accent" data-act="req" style="height:48px;justify-content:center;font-size:15px">${icon("copy",17)} Paruošti ir nukopijuoti užklausą</button>
      </div></section>
    <section style="min-width:0">
      <div class="card" style="padding:20px"><h2 style="font-size:15px;font-weight:600">Kaip tai veikia</h2>
        <ol style="margin:12px 0 0 18px;font-size:14px;line-height:1.8;color:var(--ink-2)">
          <li>Spausk „Paruošti ir nukopijuoti užklausą“.</li>
          <li>Atidaryk pokalbį su Claude, kur buvo sukurtas Žvalgas, ir įklijuok.</li>
          <li>Po kelių minučių naujos įmonės atsiras skiltyje „Skambinti“.</li></ol>
        <p class="muted" style="margin-top:12px;font-size:12.5px;line-height:1.6">Šis puslapis pats internete ieškoti negali, tai Claude puslapių apribojimas. Išgalvotų telefonų nenorime, todėl paiešką atlieka Claude pokalbyje.</p></div>
      ${S.reqText?`<div class="rise" style="margin-top:20px"><span class="lbl" style="margin-bottom:8px">Užklausa (pažymėk ir nukopijuok, jei nenukopijavo automatiškai)</span><textarea class="req" readonly id="reqbox">${esc(S.reqText)}</textarea></div>`:""}
    </section></div></div></div>`;
}

function viewStats(){
  const counts=Object.fromEntries(STATUSES.map(s=>[s.id,0]));leads.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
  const called=leads.length-counts.new,reached=counts.declined+counts.thinking+counts.interested;
  const pct=(a,b)=>b?Math.round(a/b*100)+" %":"—";
  const calls=acts.filter(a=>a.kind==="call");
  const today=dayKey(Date.now()),weekAgo=Date.now()-7*864e5;
  const per=list=>{const m={};for(const a of list){const k=a.author||"?";m[k]??={id:k,calls:0,reached:0,interested:0};m[k].calls++;if(a.status!=="no_answer")m[k].reached++;if(a.status==="interested")m[k].interested++}return Object.values(m).sort((a,b)=>b.calls-a.calls)};
  const tRows=per(calls.filter(a=>dayKey(ms(a.createdAt))===today)),wRows=per(calls.filter(a=>ms(a.createdAt)>=weekAgo));
  const days=[...Array(14)].map((_,i)=>dayKey(Date.now()-(13-i)*864e5));
  const byDay=days.map(d=>calls.filter(a=>dayKey(ms(a.createdAt))===d).length),max=Math.max(1,...byDay);
  const todayCalls=byDay[13];
  const table=(t,rows)=>`<div class="card panel" style="margin-top:0"><h2>${t}</h2>${rows.length?`<table><thead><tr><th>Kas</th><th class="r">Skambučių</th><th class="r">Pasiekta</th><th class="r">Nori</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><span style="display:inline-flex;align-items:center;gap:8px">${avatar(r.id,22)}${esc(who(r.id))}</span></td><td class="r mono tnum">${r.calls}</td><td class="r mono tnum">${r.reached}</td><td class="r mono tnum">${r.interested}</td></tr>`).join("")}</tbody></table>`:`<p class="muted" style="margin-top:16px;font-size:13px">Dar nėra skambučių.</p>`}</div>`;
  const hv=S.hover;
  return`<div class="scroll thin"><div class="page" style="max-width:1100px"><h1 class="title">Statistika</h1>
    <div class="tiles">
      <div class="card tile"><span class="lbl">Skambučių šiandien</span><b class="tnum">${todayCalls}</b></div>
      <div class="card tile"><span class="lbl">Kontaktų</span><b class="tnum">${leads.length}</b><small>${counts.new} dar neskambinta</small></div>
      <div class="card tile"><span class="lbl">Pasiekta</span><b class="tnum">${pct(reached,called)}</b><small>${reached} iš ${called} atsiliepė</small></div>
      <div class="card tile"><span class="lbl">Nori</span><b class="tnum">${counts.interested}</b><small>${pct(counts.interested,reached)} pasiektų</small></div></div>
    <section class="card panel"><h2>Kontaktai pagal statusą</h2>
      <div class="stack" role="img" aria-label="Kontaktų pasiskirstymas pagal statusą">${leads.length?STATUSES.filter(s=>counts[s.id]).map(s=>`<div title="${s.short}: ${counts[s.id]}" style="flex-grow:${counts[s.id]};background:var(--s-${s.id})"></div>`).join(""):`<div style="flex:1;background:var(--line)"></div>`}</div>
      <ul class="legend">${STATUSES.map(s=>`<li>${sdot(s.id)}${s.short}<span class="mono tnum" style="font-size:12px;color:var(--ink)">${counts[s.id]}</span></li>`).join("")}</ul></section>
    <section class="card panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Skambučiai per 14 dienų</h2><span class="muted tnum" style="font-size:12px">${hv!==null?`${esc(days[hv])}: ${byDay[hv]}`:`iš viso ${byDay.reduce((a,b)=>a+b,0)} · daugiausia ${max}`}</span></div>
      <div class="bars">${byDay.map((c,i)=>`<button data-act="bar" data-i="${i}" aria-label="${esc(days[i])}: ${c} skambučių"><span style="height:${c/max*100}%;opacity:${hv===null||hv===i?1:.35}"></span></button>`).join("")}</div>
      <div class="muted" style="margin-top:8px;display:flex;justify-content:space-between;font-size:11px"><span>${esc(days[0])}</span><span>šiandien</span></div></section>
    <div class="two" style="margin-top:24px">${table("Šiandien",tRows)}${table("Per 7 dienas",wRows)}</div>
  </div></div>`;
}

/* ---------- render ---------- */
function render(){
  // Keep focus, caret and scroll while live data re-renders the view.
  const a=document.activeElement,key=a?.dataset?.key,sel=key&&"selectionStart" in a?[a.selectionStart,a.selectionEnd]:null;
  const center=document.querySelector(".center,.scroll"),top=center?.scrollTop||0;
  const tl=$("tlist"),tAtBottom=!tl||tl.scrollHeight-tl.scrollTop-tl.clientHeight<40;
  renderShell();
  const r=route();
  $("main").innerHTML=connBanner()+(r==="kontaktai"?viewContacts():r==="paieska"?viewSearch():r==="statistika"?viewStats():viewCall());
  const c2=document.querySelector(".center,.scroll");if(c2)c2.scrollTop=top;
  const tl2=$("tlist");if(tl2&&tAtBottom)tl2.scrollTop=tl2.scrollHeight;
  if(key){const el=document.querySelector(`[data-key="${key}"]`);if(el){el.focus({preventScroll:true});if(sel&&el.setSelectionRange)try{el.setSelectionRange(sel[0],sel[1])}catch{}}}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-stop]"))return;
  const b=e.target.closest("[data-act]");
  if(!b){if(S.menu){S.menu=null;render()}return}
  const act=b.dataset.act,id=b.dataset.id;
  if(b.tagName==="FORM")return;
  switch(act){
    case"tab":S.tab=b.dataset.v;render();break;
    case"pick":S.sel=id;S.sheet=false;S.editing=false;S.askWhen=false;history.replaceState(null,"","#");render();break;
    case"sheet-open":S.sheet=true;render();break;
    case"sheet-close":S.sheet=false;render();break;
    case"skip":{const c=current(queues());if(c){S.skipped.add(c.l.id);S.sel=null;S.note="";render()}break}
    case"outcome":{const c=current(queues());if(!c)break;const s=b.dataset.s;if(s==="thinking"){S.askWhen=true;render()}else logCall(c.l,s);break}
    case"callback":{const c=current(queues());if(!c)break;const d=new Date();d.setDate(d.getDate()+Number(b.dataset.d));d.setHours(10,0,0,0);logCall(c.l,"thinking",d.getTime());break}
    case"callback-custom":{const c=current(queues()),t=Date.parse(S.custom);if(c&&t)logCall(c.l,"thinking",t);break}
    case"ask-back":S.askWhen=false;render();break;
    case"edit-toggle":S.editing=!S.editing;render();break;
    case"edit-close":S.editing=false;render();break;
    case"filter":S.filter=b.dataset.v;render();break;
    case"add-toggle":S.adding=!S.adding;render();break;
    case"menu":e.stopPropagation();S.menu=S.menu===id?null:id;render();break;
    case"set":e.stopPropagation();S.menu=null;setStatus(id,b.dataset.s);break;
    case"open":if(e.target.closest(".st"))break;S.sel=id;location.hash="";break;
    case"fchip":{const arr=S.form[b.dataset.arr],v=b.dataset.v;S.form[b.dataset.arr]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];render();break}
    case"fcount":S.form.count=Number(b.dataset.v);render();break;
    case"req":S.reqText=buildRequest();render();
      try{await navigator.clipboard.writeText(S.reqText);toast("Nukopijuota. Įklijuok į pokalbį su Claude.")}
      catch{const t=$("reqbox");t?.focus();t?.select();toast("Pažymėjau tekstą: nukopijuok jį rankiniu būdu.")}break;
    case"csv":exportCsv();break;
    case"bar":S.hover=S.hover===Number(b.dataset.i)?null:Number(b.dataset.i);render();break;
  }
});
document.addEventListener("input",e=>{
  const k=e.target.dataset?.key;if(!k)return;const v=e.target.value;
  if(k==="note")S.note=v;
  else if(k==="composer"){S.composer=v;const s=e.target.closest("form")?.querySelector(".send");if(s)s.disabled=!v.trim();return}
  else if(k==="custom"){S.custom=v;render();return}
  else if(k==="q"){S.q=v;render();return}
  else if(k==="sort"){S.sort=v;render();return}
  else if(k.startsWith("f."))S.form[k.slice(2)]=v;
});
document.addEventListener("change",e=>{if(e.target.dataset?.key==="sort"){S.sort=e.target.value;render()}});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(t.dataset?.key==="composer"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();const c=current(queues());if(c)sendNote(c.l);return}
  if(t.closest("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey)return;
  if(route()!=="")return;
  const map={"1":"no_answer","2":"declined","3":"thinking","4":"interested"};
  const c=current(queues());if(!c||S.editing)return;
  if(map[e.key]){e.preventDefault();if(map[e.key]==="thinking"){S.askWhen=true;render()}else logCall(c.l,map[e.key])}
  if(e.key==="Escape"&&S.menu){S.menu=null;render()}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target,act=f.dataset.act;
  if(act==="note-form"){const c=current(queues());if(c)sendNote(c.l);return}
  const d=Object.fromEntries(new FormData(f));for(const k in d)d[k]=String(d[k]).trim().slice(0,1000);
  if(act==="edit-form"){
    const c=current(queues());if(!c)return;
    const next={...c.l,...d,updatedAt:Date.now()};leads=leads.map(x=>x.id===next.id?next:x);S.editing=false;render();
    if(await saveLead(next))toast("Išsaugota.");
  }else if(act==="add-form"){
    if(!d.name)return;
    const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\b(uab|mb|ii|ab|vsi)\b/g,"").replace(/[^a-z0-9]/g,"");
    const pk=s=>String(s||"").replace(/\D/g,"").slice(-8);
    if(leads.some(l=>(d.companyCode&&l.companyCode===d.companyCode)||(pk(d.phone).length===8&&pk(l.phone)===pk(d.phone))||norm(l.name)===norm(d.name))){toast("Toks kontaktas jau yra sąraše.");return}
    const now=Date.now(),l={id:uid(),name:d.name,companyCode:d.companyCode||"",category:d.category||"",city:d.city||"",phone:d.phone||"",email:d.email||"",website:d.website||"",revenue:"",need:d.need||"Svetainė",reason:"",source:"",status:"new",callbackAt:null,attempts:0,lastCalledAt:null,lastCalledBy:"",createdBy:meId||"",createdAt:now,updatedAt:now};
    leads=[l,...leads];S.adding=false;render();
    if(await saveLead(l))await addAct({leadId:l.id,kind:"created",status:null,note:""});
  }
});

async function exportCsv(){
  const cell=v=>/[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  const head=["Pavadinimas","Statusas","Telefonas","El. paštas","Sritis","Miestas","Pajamos","Reikia","Svetainė","Įmonės kodas","Bandymų","Paskutinis skambutis","Šaltinis"];
  const rows=leads.map(l=>[l.name,stat(l.status).label,l.phone,l.email,l.category,l.city,l.revenue,l.need,l.website,l.companyCode,String(l.attempts||0),l.lastCalledAt?new Date(ms(l.lastCalledAt)).toISOString():"",l.source].map(v=>cell(String(v||""))));
  const csv="﻿"+[head,...rows].map(r=>r.join(";")).join("\n");
  if(downloads){try{await downloads.save({filename:`zvalgas-${new Date().toISOString().slice(0,10)}.csv`,data:csv});return}catch(e){if(e?.code==="declined")return}}
  try{await navigator.clipboard.writeText(csv);toast("CSV nukopijuotas. Įklijuok į Excel ar Google Sheets.")}catch{toast("Nepavyko eksportuoti.")}
}

addEventListener("hashchange",()=>{S.menu=null;S.sheet=false;render()});
matchMedia("(min-width:1280px)").addEventListener("change",render);
setInterval(render,60000); // relative times and the 3-hour retry window
render();
connect();
</script>
