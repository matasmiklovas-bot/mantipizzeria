<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coldai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Coldai. Apple-style: system font, iOS colours, large titles, filled controls, springy motion.
   Colour carries meaning only: green = call / won, red = declined, blue = callback, orange = no answer. */
:root{
  --bg:#f5f5f7;--side:rgba(242,242,247,.78);--surface:#fff;--sunk:#f2f2f7;--fill:rgba(120,120,128,.12);--fill-2:rgba(120,120,128,.2);
  --hover:rgba(0,0,0,.04);--line:rgba(60,60,67,.12);--line-2:rgba(60,60,67,.22);
  --text:#1d1d1f;--text-2:#3a3a3c;--muted:#86868b;--ink:#1d1d1f;--on-ink:#fff;
  --call:#34c759;--call-ink:#248a3d;--call-hover:#2fb350;--call-soft:rgba(52,199,89,.14);--accent:#007aff;
  --danger:#ff3b30;--danger-soft:rgba(255,59,48,.1);
  --s-new:#8e8e93;--s-no_answer:#ff9500;--s-declined:#ff3b30;--s-thinking:#007aff;--s-interested:#34c759;
  --d-meeting:#007aff;--d-proposal:#af52de;--d-won:#34c759;--d-lost:#8e8e93;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --r:12px;--rl:20px;
  --sh:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035);
  --sh-2:0 2px 6px rgba(0,0,0,.05),0 14px 36px -8px rgba(0,0,0,.12);
  --pop:0 0 0 .5px rgba(0,0,0,.08),0 22px 50px -12px rgba(0,0,0,.3);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#000;--side:rgba(28,28,30,.72);--surface:#1c1c1e;--sunk:#2c2c2e;--fill:rgba(118,118,128,.24);--fill-2:rgba(118,118,128,.36);
  --hover:rgba(255,255,255,.06);--line:rgba(84,84,88,.6);--line-2:rgba(118,118,128,.5);
  --text:#f5f5f7;--text-2:#d1d1d6;--muted:#98989d;--ink:#f5f5f7;--on-ink:#000;
  --call:#30d158;--call-ink:#30d158;--call-hover:#3ade68;--call-soft:rgba(48,209,88,.18);--accent:#0a84ff;
  --danger:#ff453a;--danger-soft:rgba(255,69,58,.16);
  --s-new:#8e8e93;--s-no_answer:#ff9f0a;--s-declined:#ff453a;--s-thinking:#0a84ff;--s-interested:#30d158;
  --d-meeting:#0a84ff;--d-proposal:#bf5af2;--d-won:#30d158;--d-lost:#8e8e93;
  --sh:none;--sh-2:0 0 0 .5px rgba(255,255,255,.08);--pop:0 0 0 .5px rgba(255,255,255,.12),0 24px 60px -10px rgba(0,0,0,.9);
  color-scheme:dark;
}

/* base */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:15px;line-height:1.45;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;border-radius:0;letter-spacing:inherit}
select option{background:var(--surface);color:var(--text)}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
html{-webkit-tap-highlight-color:transparent}
a,button,summary,label,select,input,textarea,[data-act]{touch-action:manipulation}
.mono,.num,.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.t2{color:var(--text-2)}.small{font-size:13px;line-height:1.5}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.thin{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{display:inline-block;min-width:20px;border-radius:6px;background:var(--fill);padding:0 6px;font-family:var(--mono);font-size:11px;line-height:18px;text-align:center;color:var(--muted)}
button,a.go,.btn,.chip,.obtn,.qitem,.dcard,.nav a,.tabs a,.cv-reply,.csugg button,.onbl a{transition:transform .25s var(--ease),background-color .2s,border-color .2s,color .2s,box-shadow .25s var(--ease),opacity .2s}
button:active:not(:disabled),a.go:active,.btn:active,.chip:active{transform:scale(.96)}
.obtn:active:not(:disabled),.qitem:active,.dcard:active,.cv-reply:active,.csugg button:active{transform:scale(.98)}

/* motion */
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.3}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes drawer{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shim{to{background-position:-200% 0}}
.in{animation:in .35s var(--ease) both}
.view{height:100%;animation:viewin .45s var(--ease) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== shell ===== */
.app{display:flex;height:100dvh;flex-direction:column}
@media(min-width:768px){.app{flex-direction:row}}
aside.side{display:none;width:72px;flex-shrink:0;flex-direction:column;background:var(--side);backdrop-filter:saturate(1.8) blur(30px);-webkit-backdrop-filter:saturate(1.8) blur(30px);border-right:.5px solid var(--line)}
@media(min-width:768px){aside.side{display:flex}}
@media(min-width:1180px){aside.side{width:240px}}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;height:76px;padding:0 16px;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.025em}
@media(min-width:1180px){.brand{justify-content:flex-start;padding:0 22px}}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;flex-shrink:0;box-shadow:0 6px 14px -6px rgba(0,0,0,.45);transition:transform .5s var(--spring)}
.brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
.brand .word{display:none}
@media(min-width:1180px){.brand .word{display:inline}}
.brand .live{display:none;width:8px;height:8px;border-radius:50%;background:var(--line-2);flex-shrink:0;margin-left:auto}
@media(min-width:1180px){.brand .live{display:block}}
.brand .live.on{background:var(--call);box-shadow:0 0 0 3px var(--call-soft)}
.nav{display:flex;flex-direction:column;padding:2px 12px;gap:2px}
.nav a,.sidefoot>a,.sidefoot>button,.sidefoot .who{display:flex;align-items:center;justify-content:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:var(--text);font-size:15px;font-weight:500}
@media(min-width:1180px){.nav a,.sidefoot>a,.sidefoot>button,.sidefoot .who{justify-content:flex-start}}
.nav a svg,.sidefoot svg{color:var(--call-ink)}
.nav a:hover,.sidefoot>a:hover,.sidefoot>button:hover{background:var(--hover)}
.nav a[aria-current=page],.sidefoot>a[aria-current=page]{background:var(--call);color:#fff;box-shadow:0 4px 12px -4px color-mix(in srgb,var(--call) 70%,transparent)}
.nav a[aria-current=page] svg,.sidefoot>a[aria-current=page] svg{color:#fff}
.nav .lab,.nav .cnt,.sidefoot .lab{display:none}
@media(min-width:1180px){.nav .lab,.sidefoot .lab{display:inline}.nav .cnt{display:inline;margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.nav a[aria-current=page] .cnt{color:rgba(255,255,255,.85)}}
.sidefoot{margin-top:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.sidefoot>a,.sidefoot>button{font-size:14.5px;height:38px}
.sidefoot .who{font-size:14.5px;height:48px;margin-top:6px;border-top:.5px solid var(--line);border-radius:0;padding-top:6px}
.sidefoot .who .out{display:none;margin-left:auto;width:32px;height:32px;place-items:center;border-radius:8px;color:var(--muted)}
.sidefoot .who .out:hover{background:var(--hover);color:var(--text)}
@media(min-width:1180px){.sidefoot .who .out{display:grid}}
@media(max-width:1179px){.sidefoot .who{display:none}}
.main{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}

/* phone tab bar + "Daugiau" sheet */
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px)}
@media(min-width:768px){.tabs{display:none}}
.tabs a,.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;font-weight:500;color:var(--muted)}
.tabs [aria-current=page]{color:var(--call-ink)}
.moresheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;animation:fade .25s both}
@media(min-width:768px){.moresheet{display:none}}
.msheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom));box-shadow:var(--pop);display:flex;flex-direction:column;gap:2px;animation:sheet .45s var(--ease) both}
.msheet::before{content:"";align-self:center;width:38px;height:5px;border-radius:3px;background:var(--fill-2);margin:2px 0 8px}
.msheet a,.msheet button{display:flex;align-items:center;gap:14px;height:54px;padding:0 14px;border-radius:14px;font-size:17px;font-weight:500;text-align:left}
.msheet a:active,.msheet button:active{background:var(--hover)}
.msheet a[aria-current=page]{background:var(--sunk)}
.msheet svg{color:var(--call-ink)}

/* feedback */
.banner{padding:10px 20px;font-size:13.5px;background:var(--surface);color:var(--text-2);border-bottom:.5px solid var(--line)}
.banner.err{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;border-radius:999px;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--on-ink);padding:12px 20px;font-size:14.5px;font-weight:500;box-shadow:var(--pop);max-width:calc(100vw - 32px);animation:toast .5s var(--spring) both}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:768px){.toast{bottom:32px}}
.avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:600;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

/* page */
.scroll{height:100%;overflow-y:auto}
.page{max-width:1200px;margin:0 auto;padding:0 16px 96px}
@media(min-width:768px){.page{padding:0 40px 80px}}
.page.narrow{max-width:860px}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;padding:34px 0 22px}
@media(max-width:767px){.ph{padding:22px 0 14px}}
.ph h1{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.ph .meta{display:block;margin-top:4px;font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);letter-spacing:-.01em}
.lbl{display:block;font-size:13px;color:var(--muted)}
.sect{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sect span{font-weight:400;font-size:13.5px;color:var(--muted);letter-spacing:-.01em}
.box{border-radius:var(--rl);background:var(--surface);box-shadow:var(--sh)}
:root[data-theme=dark] .box{box-shadow:none}
.panel{padding:20px 22px}
.empty{display:grid;place-items:center;min-height:60vh;padding:64px 24px;text-align:center}
.empty h2{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.03em}
.none{padding:8px 6px 14px;font-size:13px;color:var(--muted)}

/* controls: filled capsules, no borders */
.btn{display:inline-flex;height:36px;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:0 16px;font-size:14.5px;font-weight:500;background:var(--fill);color:var(--text);white-space:nowrap}
.btn:hover{background:var(--fill-2)}
.btn.ink{background:var(--ink);color:var(--on-ink)}
.btn.ink:hover{opacity:.86}
.btn.go{background:var(--call);color:#fff;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--call) 90%,transparent)}
.btn.go:hover{background:var(--call-hover)}
.btn.red{background:var(--danger-soft);color:var(--danger)}
.btn.red:hover{background:color-mix(in srgb,var(--danger) 18%,transparent)}
label.btn{cursor:pointer}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.iconbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--muted);flex-shrink:0;background:var(--fill)}
.iconbtn:hover{color:var(--text);background:var(--fill-2)}
.mini-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--accent);background:transparent}
.mini-btn:hover{background:var(--hover)}
.linkbtn{display:inline-flex;align-items:center;gap:5px;font-weight:500;color:var(--accent)}
.inp{height:42px;width:100%;border-radius:var(--r);background:var(--sunk);padding:0 13px;font-size:16px;color:var(--text);transition:box-shadow .2s,background .2s}
@media(min-width:1024px){.inp{font-size:15px}}
.inp:focus{outline:none;background:var(--surface);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
.inp:disabled{opacity:.6}
.inp::placeholder,textarea::placeholder{color:var(--muted)}
textarea.inp{height:auto;padding:11px 13px;line-height:1.55;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.seg{display:inline-flex;gap:0;padding:2px;border-radius:10px;background:var(--fill)}
.seg button{height:30px;padding:0 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1px rgba(0,0,0,.1)}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#636366}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{height:34px;border-radius:999px;padding:0 15px;font-size:14px;font-weight:500;color:var(--text);background:var(--fill)}
.chip:hover{background:var(--fill-2)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.tagline{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.u{color:var(--accent)}
.u:hover{text-decoration:underline;text-underline-offset:3px}
.steps{margin:2px 0 14px 20px;font-size:15px;line-height:1.75;color:var(--text-2)}
.steps b{color:var(--text);font-weight:600}

/* ===== call ===== */
.call{display:flex;height:100%}
.queue{display:none;width:310px;flex-shrink:0;border-right:.5px solid var(--line);background:var(--surface);flex-direction:column;min-height:0}
@media(min-width:1024px){.queue{display:flex}}
.queue.sheet{display:flex;position:absolute;inset:0;z-index:30;width:auto;animation:fade .25s both}
.qhead{padding:0 16px 10px}
.qtop{display:flex;align-items:center;justify-content:space-between;height:68px}
.qtop h1{font-family:var(--display);font-size:28px;font-weight:700;letter-spacing:-.03em}
.goal{display:flex;align-items:center;gap:10px;font-size:13px;margin-bottom:12px}
.goal .track{flex:1;height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.goal .track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#30d158,#34c759);transition:width .8s var(--ease)}
.goal .mono{font-weight:600}
.qtabs{display:grid;grid-template-columns:repeat(3,1fr);padding:2px;border-radius:10px;background:var(--fill)}
.qtabs button{height:30px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text)}
.qtabs button[aria-pressed=true]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1px rgba(0,0,0,.1)}
:root[data-theme=dark] .qtabs button[aria-pressed=true]{background:#636366}
.qtabs .n{font-size:11.5px;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.qlist{flex:1;min-height:0;overflow-y:auto;list-style:none;padding:4px 0 16px}
.qlist li{animation:in .4s var(--ease) both}
.qlist li:nth-child(2){animation-delay:.02s}.qlist li:nth-child(3){animation-delay:.04s}.qlist li:nth-child(4){animation-delay:.06s}.qlist li:nth-child(5){animation-delay:.08s}.qlist li:nth-child(6){animation-delay:.1s}.qlist li:nth-child(7){animation-delay:.12s}.qlist li:nth-child(n+8){animation-delay:.14s}
.qitem{display:grid;grid-template-columns:8px 1fr auto;column-gap:10px;row-gap:1px;margin:1px 8px;width:calc(100% - 16px);padding:11px 12px;border-radius:12px;text-align:left}
.qitem:hover{background:var(--hover)}
.qitem[aria-current=true]{background:var(--call-soft)}
.qitem .dot{margin-top:7px}
.qitem b{font-weight:600;font-size:15px}
.qitem small{grid-column:2/4;font-size:13px;color:var(--muted)}
.qitem .qrev{align-self:center;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.center{min-width:0;flex:1;overflow-y:auto}
.mbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:52px;border-bottom:.5px solid var(--line);padding:0 16px;font-size:15px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.8) blur(24px);-webkit-backdrop-filter:saturate(1.8) blur(24px)}
@media(min-width:1024px){.mbar{display:none}}
.focus{max-width:860px;margin:0 auto;padding:16px 14px 56px}
@media(min-width:768px){.focus{padding:24px 32px 64px}}

/* lead card */
.hero{border-radius:24px;background:var(--surface);box-shadow:var(--sh-2);padding:20px 20px 16px;animation:rise .5s var(--ease) both}
@media(min-width:768px){.hero{padding:24px 28px 20px}}
.crumbs{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.crumbs>span:first-child{font-weight:600}
.crumbs .push{margin-left:auto}
.crumbs button.t2{color:var(--accent);font-weight:500}
.askai{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;background:var(--fill);color:var(--text)!important;font-weight:500}
.askai:hover{background:var(--fill-2)}
.askai svg{color:var(--call-ink)}
.crumbs .askai+button{margin-left:2px}
.fname{margin-top:12px;font-family:var(--display);font-size:32px;font-weight:700;line-height:1.08;letter-spacing:-.035em;word-break:break-word}
@media(min-width:768px){.fname{font-size:40px}}
.fmeta{margin-top:4px;font-size:13px;color:var(--muted);letter-spacing:.02em}
.htags{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.htags span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--fill);font-size:13px;color:var(--text-2)}
.htags svg{opacity:.6}
.htags .need{background:var(--call-soft);color:var(--call-ink);font-weight:600}
.dial{margin-top:18px;display:flex;flex-direction:column;border-radius:18px;background:var(--sunk);overflow:hidden}
@media(min-width:640px){.dial{flex-direction:row;align-items:stretch}}
.dial .nr{flex:1;padding:13px 18px}
.dial .nr .num{display:block;margin-top:1px;font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.dial .copy{display:flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 18px;color:var(--accent);font-size:14.5px;font-weight:500}
.dial .copy:hover{background:var(--hover)}
@media(min-width:640px){.dial .copy span{display:none}}
.dial a.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;margin:6px;padding:0 34px;border-radius:14px;background:var(--call);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;box-shadow:0 8px 20px -10px color-mix(in srgb,var(--call) 90%,transparent)}
.dial a.go:hover{background:var(--call-hover)}
.links{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:14.5px;color:var(--text-2)}
.links a,.links span{display:inline-flex;align-items:center;gap:6px}
.links a.u{color:var(--accent)}
.hlink{display:inline-flex;align-items:center;gap:6px;margin-left:auto;height:32px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;color:var(--text)}
.hlink:hover{background:var(--fill-2)}
.whybox{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:15px 18px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);cursor:pointer;animation:rise .5s .04s var(--ease) both}
.wicon{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--call-soft);color:var(--call-ink)}
.whybox p{margin-top:2px;font-size:15px;line-height:1.55;color:var(--text)}
@media(min-width:768px){.whybox p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.whybox.open p{-webkit-line-clamp:unset}}

/* e-mail / SMS */
.mailbox{margin-top:12px;display:grid;gap:12px;padding:18px 20px;border-radius:20px;background:var(--surface);box-shadow:var(--sh-2);animation:rise .4s var(--ease) both}
.mailbox header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mailbox header b{font-size:17px;font-weight:600;letter-spacing:-.02em;margin-right:auto}
.mailbox textarea{font-size:15px;line-height:1.6}

/* conversation guide */
.cv{margin-top:12px;border-radius:22px;background:var(--surface);box-shadow:var(--sh);overflow:hidden;animation:rise .5s .08s var(--ease) both}
.cv>header,.outcome header{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;min-height:52px;padding:10px 12px 2px 20px;font-size:17px;font-weight:600;letter-spacing:-.02em}
.cv-me{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.cv-me input{width:100px;height:32px;padding:0 11px;border-radius:9px;background:var(--sunk);font-size:14px;color:var(--text)}
.cv-me input:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.cv-body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cv-past{display:flex;flex-direction:column;gap:6px;padding:0 4px 4px}
.cv-you{font-size:14px;line-height:1.5;color:var(--muted)}
.cv-them{display:flex;justify-content:flex-end}
.cv-them span{display:inline-block;max-width:80%;border-radius:18px 18px 5px 18px;background:var(--accent);color:#fff;padding:8px 14px;font-size:14px;font-weight:500;animation:pop .35s var(--spring) both}
.cv-now{margin-top:4px;background:var(--sunk);border-radius:18px;padding:18px 18px 16px;animation:pop .4s var(--ease) both}
.cv-now>.lbl:first-child{color:var(--call-ink);font-weight:700;text-transform:uppercase;letter-spacing:.07em;font-size:11px}
.cv-now .lbl{display:block;margin-bottom:6px}
.cv-say{font-family:var(--display);font-size:21px;line-height:1.38;letter-spacing:-.02em;color:var(--text);font-weight:600}
@media(min-width:768px){.cv-say{font-size:23px}}
.cv-tip{margin-top:10px;display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.45;color:var(--text-2)}
.cv-tip svg{flex-shrink:0;margin-top:2px;color:var(--call-ink)}
.cv-replies{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.cv-replies{grid-template-columns:1fr 1fr}}
.cv-reply{position:relative;min-height:50px;padding:12px 38px 12px 16px;border-radius:14px;background:var(--surface);text-align:left;font-size:15px;font-weight:500;color:var(--text);box-shadow:var(--sh)}
:root[data-theme=dark] .cv-reply{background:#3a3a3c}
.cv-reply::after{content:"›";position:absolute;right:16px;top:50%;transform:translateY(-52%);font-size:22px;color:var(--muted);transition:transform .25s var(--ease),color .2s}
.cv-reply:hover{box-shadow:var(--sh-2)}
.cv-reply:hover::after{color:var(--call-ink);transform:translate(3px,-52%)}
.cv-end{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:16px;padding:13px 14px 13px 16px;background:var(--surface);box-shadow:inset 4px 0 0 var(--tone)}
.cv-end b{display:block;font-size:16px}
.cv-end small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}

/* AI plan */
.aibrief{margin-top:12px;border-radius:20px;background:var(--surface);box-shadow:var(--sh);padding:15px 20px 17px;animation:rise .5s .12s var(--ease) both}
.aibrief header{display:flex;align-items:center;gap:10px;font-size:15px}.aibrief header b{flex:1;font-weight:600}
.aib{margin-top:8px;font-size:15px;line-height:1.6}.aib p{margin:0 0 6px}.aib ul{margin:2px 0 8px 18px}.aib li{margin:2px 0}
.aierr{margin-top:8px;font-size:14px;color:var(--danger)}
.shim{margin-top:10px;display:grid;gap:8px}.shim i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--fill),var(--fill-2),var(--fill));background-size:200% 100%;animation:shim 1.3s linear infinite}
.shim i:nth-child(2){width:82%}.shim i:nth-child(3){width:64%}

/* facts */
.brief.facts{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.brief.facts{grid-template-columns:repeat(4,1fr)}}
.brief.facts>div{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--sh)}
.brief.facts>div:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:768px){.brief.facts>div:last-child:nth-child(odd){grid-column:auto}}
.brief dt{font-size:12.5px;color:var(--muted)}
.brief dd{font-size:15px;font-weight:600;letter-spacing:-.015em;word-break:break-word}
.brief dd .muted{font-weight:400}

/* outcome */
.outcome{margin-top:12px;border-radius:22px;background:var(--surface);box-shadow:var(--sh-2)}
.outcome .pad{padding:4px 16px 16px}
.live-call{display:inline-flex;align-items:center;gap:7px;color:var(--call-ink);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--call);animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 4px var(--call-soft)}
textarea.note{width:100%;resize:vertical;border-radius:14px;background:var(--sunk);padding:12px 14px;font-size:16px;line-height:1.5;color:var(--text)}
@media(min-width:1024px){textarea.note{font-size:15px}}
textarea.note:focus{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
.obtns{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.obtns{grid-template-columns:repeat(4,1fr)}}
.obtn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:62px;padding:0 16px;font-size:16px;font-weight:600;border-radius:16px;background:var(--sunk)}
.obtn span{display:inline-flex;align-items:center;gap:10px}
.obtn .dot{width:11px;height:11px;box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 20%,transparent)}
.obtn:hover{background:color-mix(in srgb,var(--tone) 12%,var(--sunk))}
.obtn .kbd{display:none}
@media(min-width:768px){.obtn .kbd{display:inline-block}}
.sub{margin-top:12px}
.skip{display:flex;justify-content:flex-end;margin-top:10px}
.skip button{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--accent)}
.dealform{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:640px){.dealform{grid-template-columns:1fr 1fr 1fr}}
.dealform .full{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* history */
.thread{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.thread.side{width:360px;flex-shrink:0;border-left:.5px solid var(--line)}
.thread.below{height:520px;border-top:.5px solid var(--line)}
.thead{display:flex;align-items:center;justify-content:space-between;height:66px;padding:0 20px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.03em}
.thead .mono{font-family:var(--sans);font-size:14px;font-weight:500}
.tlist{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 14px;list-style:none;display:flex;flex-direction:column;gap:16px}
.titem{display:grid;grid-template-columns:26px 1fr;gap:10px;animation:in .35s var(--ease) both}
.titem .h{display:flex;align-items:baseline;gap:8px;font-size:14px}
.titem .h b{font-weight:600}
.titem .ev{margin-top:2px;font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.titem .msg{margin-top:6px;white-space:pre-wrap;font-size:14.5px;line-height:1.5;color:var(--text);background:var(--sunk);border-radius:5px 16px 16px 16px;padding:9px 13px}
.composer{padding:10px 12px 12px}
.composer div{display:flex;align-items:flex-end;gap:8px;border-radius:22px;background:var(--sunk);padding:5px 5px 5px 8px}
.composer div:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.composer textarea{flex:1;max-height:128px;min-height:34px;resize:none;padding:7px 6px;font-size:16px}
@media(min-width:1024px){.composer textarea{font-size:14.5px}}
.composer textarea:focus{outline:none}
.send{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--accent);color:#fff}

/* ===== contacts ===== */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0;height:40px;border-radius:12px;background:var(--fill);padding:0 12px;color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 30%,transparent)}
.search input{flex:1;min-width:0;height:100%;font-size:16px;color:var(--text)}
@media(min-width:1024px){.search input{font-size:15px}}
.search input:focus{outline:none}
.sel{height:40px;border-radius:12px;background:var(--fill);padding:0 12px;font-size:14.5px;font-weight:500;color:var(--text)}
.statusbar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.statusbar button{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text);background:var(--fill);white-space:nowrap}
.statusbar button:hover{background:var(--fill-2)}
.statusbar button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.statusbar .n{font-size:12.5px;opacity:.6;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:var(--rl);box-shadow:var(--sh)}
.grid{width:100%;border-collapse:collapse;font-size:15px}
.grid th{position:sticky;top:0;z-index:1;background:var(--surface);text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);padding:14px 10px 10px;border-bottom:.5px solid var(--line);white-space:nowrap}
.grid td{padding:12px 10px;border-bottom:.5px solid var(--line);vertical-align:middle}
.grid tr:last-child td{border-bottom:0}
.grid td:first-child,.grid th:first-child{padding-left:20px}
.grid td:last-child,.grid th:last-child{padding-right:16px}
.grid tbody tr{cursor:pointer;animation:in .35s var(--ease) both}
.grid tbody tr:hover td{background:var(--hover)}
.grid .r{text-align:right}
.grid td.mono{font-variant-numeric:tabular-nums}
.hide-s,.hide-m{display:none}
@media(min-width:900px){.hide-s{display:table-cell}}
@media(min-width:1360px){.hide-m{display:table-cell}}
@media(max-width:899px){.grid td:first-child{max-width:190px!important}.grid td,.grid th{padding-left:8px;padding-right:8px}}
@media(max-width:639px){
  .tablewrap:has(.leads){overflow:visible}
  .leads thead{display:none}
  .leads,.leads tbody{display:block}
  .leads tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3px 12px;padding:13px 16px;border-bottom:.5px solid var(--line)}
  .leads tbody tr:last-child{border-bottom:0}
  .leads td{border:0!important;padding:0!important;background:none!important}
  .leads td.hide-s,.leads td.hide-m{display:none}
  .leads td:first-child{max-width:none!important;grid-column:1;grid-row:1}
  .leads td.st{grid-column:2;grid-row:1/3}
  .leads td.mono{grid-column:1;grid-row:2;font-size:14px;color:var(--text-2)}
}
.pick{position:relative;display:inline-block}
.pick>button{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;color:var(--text);white-space:nowrap}
.pick>button:hover{background:var(--fill-2)}
.menu{position:absolute;right:0;z-index:30;margin-top:6px;width:250px;border-radius:16px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);padding:6px;box-shadow:var(--pop);list-style:none;transform-origin:top right;animation:pop .3s var(--spring) both}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border-radius:10px;padding:10px 11px;text-align:left;font-size:15px;color:var(--text)}
.menu button:hover{background:var(--accent);color:#fff}
.mini{height:32px;width:70px;border-radius:9px;background:var(--sunk);padding:0 9px;font-size:14px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
.mini:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
form.add{display:grid;gap:10px;padding:18px;margin-bottom:16px}
@media(min-width:640px){form.add{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){form.add{grid-template-columns:repeat(4,1fr)}}
form.add .acts{display:flex;align-items:center;justify-content:flex-end;gap:8px}
@media(min-width:640px){form.add .acts{grid-column:1/-1}}
.req{width:100%;min-height:180px;border-radius:14px;background:var(--sunk);padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;resize:vertical;color:var(--text)}
.ailog{margin-top:12px;list-style:none;border-radius:14px;background:var(--sunk);padding:10px 14px;font-size:14px;line-height:1.75;color:var(--text-2);max-height:180px;overflow:auto}
.ailog li{animation:in .3s var(--ease) both}
.ailog li.now{color:var(--call-ink);font-weight:500}
.ailog li.now::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;background:var(--call);animation:pulse 1s infinite}

/* ===== metrics ===== */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{border-radius:var(--rl);background:var(--surface);box-shadow:var(--sh);padding:18px 20px 16px;animation:rise .55s var(--ease) both}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
.kpi .lbl{font-size:13.5px;font-weight:500}
.kpi .v{display:block;margin-top:8px;font-family:var(--display);font-size:36px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
@media(max-width:767px){.kpi .v{font-size:28px}}
.kpi .v .muted{font-size:18px!important;font-weight:600}
.kpi small{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.kpi:first-child{background:linear-gradient(160deg,#34c759,#1f9e4a);color:#fff;box-shadow:0 14px 30px -14px rgba(52,199,89,.7)}
.kpi:first-child .lbl,.kpi:first-child small{color:rgba(255,255,255,.82)}
.cols{display:grid;gap:12px;margin-top:12px}
@media(min-width:960px){.cols{grid-template-columns:1fr 1fr}}
.cols .box,.box.panel+.box.panel{animation:rise .55s .12s var(--ease) both}
.funnel{display:flex;flex-direction:column;gap:11px}
.frow{display:grid;grid-template-columns:104px 1fr 76px;align-items:center;gap:12px;font-size:14px}
.ftrack{height:24px;border-radius:8px;overflow:hidden;background:var(--fill)}
.ftrack span{display:block;height:100%;border-radius:8px;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.bars{height:160px;display:flex;align-items:flex-end;gap:6px}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end}
.bars span{display:block;width:100%;min-height:3px;background:color-mix(in srgb,var(--call) 45%,var(--fill));border-radius:7px;transform-origin:bottom;animation:growy .8s var(--ease) both}
@keyframes growy{from{transform:scaleY(0)}to{transform:none}}
.bars button:last-child span{background:var(--call)}
.axis{margin-top:8px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rank{font-size:13px;color:var(--muted);width:18px;display:inline-block;font-variant-numeric:tabular-nums}
.cblist{display:flex;flex-direction:column;gap:2px}
.cbrow{display:grid;grid-template-columns:10px minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 10px;border-radius:12px;text-align:left;font-size:15px}
.cbrow:hover{background:var(--hover)}
.cbrow b{font-weight:600}
.cbrow .late{color:var(--danger)}

/* deals board */
.board{display:grid;gap:12px;margin-top:14px}
@media(min-width:1000px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.col{background:var(--fill);border-radius:var(--rl);padding:12px 10px 4px;min-height:120px}
:root[data-theme=dark] .col{background:#141416}
.col h3{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:2px 6px 12px;font-size:15px;font-weight:600}
.col h3 span{white-space:nowrap;font-weight:400;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dcard{display:block;width:100%;text-align:left;border-radius:14px;box-shadow:var(--sh);background:var(--surface);padding:13px 14px;margin-bottom:8px;animation:rise .45s var(--ease) both}
.dcard:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dcard .top b{font-weight:600;font-size:15px}
.dcard .top .mono{font-weight:600}
.dcard .bot{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dcard .bot svg{vertical-align:-2px}
.drawer{position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.25);animation:fade .25s both}
.drawer .pane{width:min(460px,100%);height:100%;overflow-y:auto;background:var(--surface);box-shadow:var(--pop);animation:drawer .45s var(--ease) both}
.drawer .phd{display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 22px;border-bottom:.5px solid var(--line)}
.drawer .phd b{font-family:var(--display);font-size:22px;font-weight:700!important;letter-spacing:-.03em}
.ledger{border-radius:14px;background:var(--sunk);font-size:14.5px;overflow:hidden;font-variant-numeric:tabular-nums}
.ledger div{display:flex;justify-content:space-between;padding:10px 14px;border-top:.5px solid var(--line)}
.ledger div:first-child{border-top:0}
.ledger .tot{font-weight:600}

/* ===== settings (inset grouped) ===== */
.sset{display:grid;gap:14px;margin-bottom:16px;padding:22px 24px;animation:rise .5s var(--ease) both}
.sset:nth-of-type(2){animation-delay:.05s}.sset:nth-of-type(3){animation-delay:.1s}.sset:nth-of-type(4){animation-delay:.15s}
@media(min-width:900px){.sset{grid-template-columns:240px 1fr;gap:28px}}
.sset .sh h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.025em}
.sset .sh p{margin-top:4px;font-size:14px;line-height:1.55;color:var(--muted)}
.sset .sb{min-width:0;display:flex;flex-direction:column;gap:12px}
.sset.danger .sh h2{color:var(--danger)}
.setgrid{display:grid!important;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.setgrid{grid-template-columns:1fr 1fr}}
.setgrid .full{grid-column:1/-1;display:flex;justify-content:flex-end}
.keyrow{display:flex;flex-wrap:wrap;gap:8px}
.keyrow .inp{flex:1 1 240px}
.invite{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--sunk)}
.invite .mono{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--accent)}

/* getting started */
.onb{max-width:540px;text-align:left}.onb h2{font-size:40px}.onb>p{margin-top:6px;font-size:16px}
.onbl{margin-top:24px;list-style:none;display:grid;gap:10px;counter-reset:s}
.onbl li{animation:rise .5s var(--ease) both}.onbl li:nth-child(2){animation-delay:.07s}.onbl li:nth-child(3){animation-delay:.14s}
.onbl a{position:relative;display:block;padding:16px 18px 16px 62px;border-radius:18px;background:var(--surface);box-shadow:var(--sh)}
.onbl a:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}
.onbl a::before{counter-increment:s;content:counter(s);position:absolute;left:16px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--call);color:#fff;font-weight:700;font-size:14px}
.onbl b{display:block;font-size:16px;font-weight:600}.onbl span{display:block;margin-top:2px;font-size:14px;color:var(--muted);line-height:1.45}

/* ===== Coldai chat ===== */
.chat{height:100%;display:flex;flex-direction:column;max-width:820px;margin:0 auto;padding:0 16px}
.chead{display:flex;align-items:center;gap:12px;padding:22px 2px 10px}
.ctitle{flex:1;min-width:0}.ctitle b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}.ctitle small{color:var(--muted);font-size:13.5px}
.cav{display:inline-grid;place-items:center;flex-shrink:0;width:30px;height:30px;border-radius:9px;background:#0b0b0c}
.cav svg{width:78%;height:78%}
.cav.big{width:44px;height:44px;border-radius:13px}.cav.huge{width:72px;height:72px;border-radius:20px;box-shadow:0 18px 36px -14px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.08)}
.cctx{display:flex;align-items:center;gap:6px;align-self:flex-start;margin-bottom:8px;padding:2px 4px 2px 14px;border-radius:999px;background:var(--fill);font-size:13.5px}
.cmsgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:8px 2px 18px}
.cmsg{display:flex;gap:12px;animation:in .35s var(--ease) both}
.cmsg.me{justify-content:flex-end}
.cmsg.me .cb{max-width:76%;background:var(--fill);color:var(--text);border-radius:22px;padding:10px 16px;font-size:16px;line-height:1.5;white-space:pre-wrap}
.cmsg.ai .cb{flex:1;min-width:0;font-size:16px;line-height:1.65;color:var(--text);padding-top:3px}
.cmsg.ai .cb p{margin:0 0 10px}.cmsg.ai .cb ul{margin:4px 0 10px 20px}.cmsg.ai .cb li{margin:4px 0}
.cmsg.ai .cb code{font-family:var(--mono);font-size:13.5px;background:var(--fill);padding:1px 5px;border-radius:5px}
.csearch{display:inline-flex;align-items:center;gap:5px;margin:0 6px 8px 0;padding:3px 10px;border-radius:999px;background:var(--fill);color:var(--text-2);font-size:12.5px}
.typing{display:inline-flex;gap:5px;padding:9px 0}.typing i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dots 1.2s ease-in-out infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:none;opacity:1}}
.cempty{margin:auto;text-align:center;max-width:640px;padding:24px 0}
.cempty .cav.huge{animation:pop .6s var(--spring) both}
.cempty h2{margin-top:18px;font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.035em}.cempty p{margin-top:6px;font-size:15.5px}
.csugg{margin-top:26px;display:grid;grid-template-columns:1fr;gap:10px;text-align:left}
@media(min-width:640px){.csugg{grid-template-columns:1fr 1fr}}
.csugg button{display:flex;flex-direction:column;gap:3px;padding:15px 17px;border-radius:18px;background:var(--surface);box-shadow:var(--sh);text-align:left;animation:rise .5s var(--ease) both}
.csugg button:nth-child(2){animation-delay:.05s}.csugg button:nth-child(3){animation-delay:.1s}.csugg button:nth-child(4){animation-delay:.15s}
.csugg button:hover{box-shadow:var(--sh-2);transform:translateY(-1px)}.csugg b{font-size:15px;font-weight:600}.csugg span{font-size:13.5px;color:var(--muted);line-height:1.45}
.cerr{align-self:center;max-width:100%;border-radius:14px;background:var(--danger-soft);color:var(--danger);padding:10px 15px;font-size:14px;line-height:1.5;text-align:center}
.ccomp{display:flex;align-items:flex-end;gap:8px;margin:0 0 18px;padding:7px 7px 7px 18px;border-radius:28px;background:var(--surface);box-shadow:var(--sh-2),0 0 0 .5px var(--line)}
.ccomp:focus-within{box-shadow:var(--sh-2),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.ccomp textarea{flex:1;min-height:42px;max-height:180px;resize:none;border:0;outline:none;background:none;padding:10px 0;font-size:16px;line-height:1.45;color:var(--text)}
.csend{display:grid;place-items:center;width:42px;height:42px;flex-shrink:0;border-radius:50%;color:var(--on-ink);background:var(--ink)}
.csend:disabled{opacity:.25}
.aioff{display:flex;gap:12px;align-items:flex-start}.aioff p{margin-top:6px;font-size:15px;line-height:1.6}
.mpick button{min-width:0}
@media(max-width:767px){.chat{padding:0 12px}.ccomp{margin-bottom:10px}.chead{padding-top:16px}}
@media(max-width:560px){.hide-xs{display:none}}

/* touch: bigger targets */
@media(pointer:coarse){
  .btn,.seg button,.qtabs button,.chip,.sel,.search,.pick>button,.statusbar button{min-height:44px}
  .inp{height:48px}.mini{height:42px;width:74px}
  .nav a{height:46px}
  .qitem{padding:14px 16px}.obtn{height:66px}
  .menu button{padding:13px 12px}
  .iconbtn{width:44px;height:44px}
  .grid td{padding:14px 10px}
  .skip button{min-height:44px;padding:0 6px}
  .cv-me input{height:42px;width:110px;font-size:16px}
}

/* ===== round 2: goal ring, finder, palette, celebration ===== */
.goal{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.goal b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em}.goal b .muted{font-weight:500}
.goal small{display:block;font-size:12.5px;color:var(--muted)}
.ring{transform:rotate(-90deg);flex-shrink:0;overflow:visible}
.ring circle{fill:none}
.ring .rb{stroke:var(--call-soft)}
.ring .rf{stroke:url(#cm-g);stroke-linecap:round;transition:stroke-dashoffset 1.1s var(--ease)}
.ring.full .rf{filter:drop-shadow(0 0 4px rgba(48,209,88,.6))}
.mring{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.dial a.go.live{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--call) 18%,transparent),0 8px 20px -10px var(--call)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120}
html.theming,html.theming *{transition:background-color .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease)!important}
.sidefoot .kbd{font-size:10.5px}
@media(max-width:1179px){.sidefoot .kbd{display:none!important}}

/* finder */
.finder{padding:20px 22px;margin-bottom:16px;animation:rise .45s var(--ease) both}
.fhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fhead h2{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.03em}
.fhead p{margin-top:3px;font-size:14px;color:var(--muted)}
.fform{margin-top:16px;display:grid;gap:8px}
@media(min-width:900px){.fform{grid-template-columns:1fr 1fr;column-gap:16px}.fform .field:nth-of-type(1){grid-column:1;grid-row:1}.fform .qrow:nth-of-type(1){grid-column:1;grid-row:2}.fform .field:nth-of-type(2){grid-column:2;grid-row:1}.fform .qrow:nth-of-type(2){grid-column:2;grid-row:2}.fform .fmore,.fform .fgo{grid-column:1/-1}}
.qrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.qchip{flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--text-2);background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.qchip:hover{background:var(--hover)}
.qchip.on{background:var(--call);color:#fff;box-shadow:none}
.fmore{margin-top:4px;border-radius:14px;background:var(--sunk);padding:0 14px}
.fmore summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;height:44px;font-size:14.5px;font-weight:500;color:var(--accent)}
.fmore summary::-webkit-details-marker{display:none}
.fmore[open]{padding-bottom:14px}.fmore .lbl{margin-bottom:6px}
.fbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-weight:600}
.fgo{margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn.big{height:46px;padding:0 26px;font-size:16px;font-weight:600}
.fres{margin-top:16px;border-top:.5px solid var(--line);padding-top:14px}
.fstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px;min-height:36px}
.fstat b{font-size:16px}
.fstat .btn{margin-left:auto}
.scan{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--call-soft);border-top-color:var(--call);animation:spin .8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.fcards{list-style:none;margin-top:12px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.fcards li{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--sunk);animation:pop .45s var(--spring) both;min-width:0}
.fcards b{font-size:15px;font-weight:600}.fcards span{font-size:13px;color:var(--muted)}.fcards .fph{color:var(--text-2);font-variant-numeric:tabular-nums}

/* ⌘K palette */
.palbg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade .2s both}
.pal{width:min(600px,100%);border-radius:20px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.8) blur(40px);-webkit-backdrop-filter:saturate(1.8) blur(40px);box-shadow:var(--pop);overflow:hidden;animation:pop .35s var(--spring) both}
.palq{display:flex;align-items:center;gap:12px;height:60px;padding:0 18px;border-bottom:.5px solid var(--line);color:var(--muted)}
.palq input{flex:1;min-width:0;height:100%;font-size:19px;color:var(--text)}
.palq input:focus{outline:none}
.palr{list-style:none;padding:6px;max-height:50vh;overflow:auto}
.palr button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left}
.palr button[aria-selected=true],.palr button:hover{background:var(--accent);color:#fff}
.palr button[aria-selected=true] small,.palr button:hover small,.palr button[aria-selected=true] .palst,.palr button:hover .palst{color:rgba(255,255,255,.85)}
.palr .trunc{flex:1;min-width:0}.palr b{display:block;font-size:15.5px;font-weight:600}.palr small{display:block;font-size:13px;color:var(--muted)}
.palst{font-size:13px;color:var(--muted);flex-shrink:0}
.palnone{padding:22px;text-align:center;color:var(--muted)}
.palfoot{display:flex;gap:16px;padding:10px 16px;border-top:.5px solid var(--line);font-size:12.5px;color:var(--muted)}
.palfoot .kbd{margin-right:3px}

/* How a name sounds out loud: "BALTIC FOREST GROUP, UAB" -> "Baltic Forest Group". */
const LOWER=/^(IR|IN|AND|ĮMONĖ|GROŽIO|SALONAS)$/i;
const LEGAL=/^(UAB|MB|IĮ|AB|VŠĮ|PĮ|IVV|ŽŪB|KB|TŪB)$/i;
function spokenName(n){
  n=String(n||"").replace(/\([^)]*\)/g," ").split(",")[0];
  const w=n.split(/\s+/).filter(t=>t&&!LEGAL.test(t.replace(/[.,]/g,"")));
  const out=w.map((t,i)=>i&&LOWER.test(t)?t.toLocaleLowerCase("lt"):/\p{Ll}/u.test(t)||t.length<3||t.includes(".")?t:t.charAt(0)+t.slice(1).toLocaleLowerCase("lt")).join(" ").trim();
  return out||String(n).trim();
}
/* "Paberžė, Vilniaus r." -> "Vilnius", "Klaipėdos r." -> "Klaipėda" */
function spokenCity(c){
  c=String(c||"").trim();if(!c)return"";
  const parts=c.split(",").map(x=>x.trim());let t=parts[parts.length-1];
  if(!/\sr\.?$/.test(t))return parts[0];
  t=t.replace(/\s*r\.?$/,"");
  return t.replace(/io$/,"is").replace(/aus$/,"us").replace(/os$/,"a").replace(/ės$/,"ė").replace(/o$/,"as");
}

function place(l,now=Date.now()){
  const T=v=>ms(v);
  if(l.status==="interested")return{l,tab:"won",rank:0,key:-T(l.updatedAt),label:"Nori",tone:"var(--s-interested)"};
  if(l.status==="declined")return null;
  if(l.status==="thinking"){const due=T(l.callbackAt);
    if(!due||due<=now)return{l,tab:"queue",rank:0,key:due,label:"Perskambinti dabar",tone:"var(--s-thinking)"};
    return{l,tab:"waiting",rank:0,key:due,label:"Perskambinti "+when(due),tone:"var(--s-thinking)"};}
  if(l.status==="no_answer"){const last=T(l.lastCalledAt),label=`Neatsiliepė ×${l.attempts||1}`;
    if(now-last>=RETRY_MS)return{l,tab:"queue",rank:2,key:last,label,tone:"var(--s-no_answer)"};
    return{l,tab:"waiting",rank:1,key:last+RETRY_MS,label:"Bandyti vėl "+when(last+RETRY_MS),tone:"var(--s-no_answer)"};}
  return{l,tab:"queue",rank:1,key:-T(l.createdAt),label:"Naujas",tone:"var(--accent)"};
}

}

async function wipe(silent){
  if(!db||S.wiping)return;
  if(!silent&&!confirm("Ištrinti VISUS skambučius, pastabas, sandorius ir pelną?\n\nKontaktai (pavadinimai, telefonai, el. paštai, pajamos) liks. Statusai grįš į „Neskambinta“. Atšaukti nebus galima."))return;
  S.wiping=true;render();let n=0,fail=0;
  const del=async col=>{let docs=[];try{docs=(await db.collection(col).get()).docs}catch{docs=(col==="deals"?deals:acts).map(x=>({id:x.id}))}
    for(const d of docs){try{await db.collection(col).doc(d.id).delete();n++}catch{fail++}}};
  try{
    await del("deals");await del("activities");
    for(const l of leads){
      if(l.status==="new"&&!l.attempts&&!l.lastCalledAt&&!l.callbackAt&&!l.note)continue;
      const patch={status:"new",attempts:0,lastCalledAt:null,lastCalledBy:"",callbackAt:null,note:"",updatedAt:Date.now()};
      const ref=db.collection("leads").doc(l.id);
      try{if(typeof ref.update==="function")await ref.update(patch);else await ref.set({...l,...patch});n++}catch{fail++}
    }
  }finally{S.wiping=false;S.sel=null;S.cv=null;S.note="";render()}
  toast(fail?`Išvalyta, bet ${fail} įrašų nepavyko. Komandoje spausk „Išvalyti“ dar kartą.`:"Skambučiai ir pardavimai išvalyti. Kontaktai liko, visi vėl „Neskambinta“.");
}

let seeded=false;
async function backfill(){
  if(seeded||!db)return;seeded=true;
  for(const l of leads){
    const s=SEED[l.id];if(!s)continue;
    const [rev,val,emp]=s,patch={};
    if(val&&typeof l.revenueValue!=="number"){patch.revenue=rev;patch.revenueValue=val}
    if(emp&&!l.employees)patch.employees=emp;
    if(!Object.keys(patch).length)continue;
    try{await db.collection("leads").doc(l.id).set({...l,...patch})}catch{}
  }
}
async function connect(){
  const c=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(!c){S.conn="none";render();return}
  let smp;[db,user,downloads,ai,smp]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads"),c.use("ai"),c.use("sample")].map(p=>p.catch(()=>null)));
  aiApi=ai&&window.COLDLINE_WEB?webAi():typeof smp==="function"?sampleAi(smp):null;
  if(aiApi&&!NAV.some(n=>n[0]==="claude"))NAV.splice(1,0,["claude",aiApi.web?"AI":"Claude","spark"]);
  if(user){try{meId=await user.id();isOwner=await user.isOwner()}catch{}}
  if(!db){S.conn="none";render();return}
  let got=false;const timer=setTimeout(()=>{if(!got){S.conn="slow";render()}},10000);
  const fail=e=>{clearTimeout(timer);S.conn=e?.code==="revoked"?"revoked":"error";S.loaded=true;render()};
  db.collection("leads").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(timer);S.conn="ok"}
    leads=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;render(true);resolveNames();
    if(!snap.metadata.fromCache){backfill();fresh0.leads=true;maybeReset()}
  },fail);
  db.collection("activities").orderBy("createdAt","desc").limit(1000).onSnapshot(snap=>{acts=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames();if(!snap.metadata?.fromCache){fresh0.acts=true;maybeReset()}},()=>{});
  db.collection("deals").onSnapshot(snap=>{deals=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames();if(!snap.metadata?.fromCache){fresh0.deals=true;maybeReset()}},()=>{});
  db.collection("meta").onSnapshot(snap=>{const sd=snap.docs.find(d=>d.id==="settings");settings=sd?{...sd.data()}:{};render(true);
    if(snap.metadata?.fromCache)return;metaIds=new Set(snap.docs.map(d=>d.id));fresh0.meta=true;maybeReset()},()=>{});
  let joined=false;
  db.collection("team").onSnapshot(snap=>{
    team=Object.fromEntries(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
    if(!joined&&meId&&!snap.metadata.fromCache){joined=true;if(!team[meId])saveMember(meId,{role:isOwner?"manager":"caller",commission:DEF_COMMISSION,goal:DEF_GOAL,joinedAt:Date.now()})}
    render(true);resolveNames();
  },()=>{});
}

const OFFER={"Svetainė":["svetainė, kuri gerai veikia telefone ir atveda naujų klientų","svetainės","svetainė"],

function mailTpl(l,kind){
  const st=settings||{},me=callName()||"",co=String(st.company||"").trim(),from=me&&co?` iš „${co}“`:co?` iš „${co}“`:"";
  const [offer,needGen,need]=OFFER[l.need]||OFFER["Svetainė"],problem=PROBLEM[l.need]||PROBLEM["Svetainė"];
  const md=deals.filter(d=>d.leadId===l.id&&d.meetingAt).sort((a,b)=>ms(b.meetingAt)-ms(a.meetingAt))[0];
  const whenTxt=md?" "+new Date(ms(md.meetingAt)).toLocaleString("lt-LT",{timeZone:TZ,weekday:"long",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";
  const sign=[st.sign||me,st.phone].filter(Boolean).join("\n");
  const site=st.site?`Mūsų darbų pavyzdžiai: ${st.site}`:"";
  const price=num(st.price)>0?` Kaina prasideda nuo ${eur(num(st.price))}.`:"";
  const T={
    after:{subject:`${spokenName(l.name)}: pasiūlymas po pokalbio`,
      body:`Laba diena,\n\načiū už pokalbį telefonu. Kaip ir sutarėme, siunčiu trumpai.\n\nPastebėjau, kad ${problem}, todėl dalis žmonių, kurie jau nori pirkti, nueina pas konkurentus. Pasiūlymas paprastas: ${offer}.${price}\n\n${site}\n\nJei patogu, susiskambinkime 15 minučių – parodysiu, kaip tai atrodytų jums.\n\nPagarbiai\n${sign}`,
      sms:`Laba diena, čia ${me||"[vardas]"}${from}. Ačiū už pokalbį! ${st.site?"Darbų pavyzdžiai: "+st.site+". ":""}Jei kils klausimų, skambinkite.`},
    meeting:{subject:`Susitikimo patvirtinimas${whenTxt?":"+whenTxt:""}`,
      body:`Laba diena,\n\načiū už pokalbį. Patvirtinu mūsų susitikimą${whenTxt||" [data ir laikas]"}.\n\nParodysiu, kaip galėtų atrodyti jūsų ${need}, ir pasakysiu tikslią kainą. Užtruksime apie 15 minučių.\n\nJei laikas netinka, tiesiog atrašykite.\n\n${sign}`,
      sms:`Laba diena, čia ${me||"[vardas]"}${from}. Primenu mūsų susitikimą${whenTxt||" [data ir laikas]"}. Iki!`},
    missed:{subject:`${spokenName(l.name)}: trumpas klausimas`,
      body:`Laba diena,\n\nbandžiau jums paskambinti. Esu ${me||"[vardas]"}${from}.\n\nPastebėjau, kad ${problem}, ir turiu paprastą pasiūlymą, kaip tai pataisyti.${price}\n\nKada jums patogu trumpai pasikalbėti telefonu?\n\n${sign}`,
      sms:`Laba diena, čia ${me||"[vardas]"}${from}. Bandžiau prisiskambinti dėl jūsų ${needGen}. Kada patogu trumpai pasikalbėti?`}};
  const t=T[kind]||T.after;
  return{subject:t.subject,body:t.body.replace(/\n{3,}/g,"\n\n").trim(),sms:t.sms};
}

    <ol class="onbl"><li><a href="#kontaktai" data-act="find-open"><b>Rask įmonių</b><span>Iš 1551.lt su telefonais ir apyvarta, arba įkelk savo sąrašą iš Excel.</span></a></li>
      <li><a href="#nustatymai"><b>Pakviesk komandą</b><span>Nusiųsk kvietimo nuorodą – kolegos matys tuos pačius kontaktus.</span></a></li>

  else if(!cur)center=`<div class="empty"><div><h2>Eilė tuščia</h2><p class="muted" style="margin:6px auto 0;max-width:360px;font-size:14px">${leads.length?"Visiems paskambinta. Neatsiliepę ir galvojantys grįš patys.":"Dar nėra kontaktų."}</p><a href="#kontaktai" data-act="find-open" class="btn ink" style="margin-top:18px">${icon("search",15)} Rasti įmonių</a></div></div>`;
  else{

    const days=[["Rytoj, 10:00",1],["Po 3 d.",3],["Po savaitės",7],["Po 2 sav.",14]];
    const ld=deals.filter(d=>d.leadId===l.id);
    const tags=[[icon("pin",13),spokenCity(l.city)||l.city],[icon("tag",13),(l.category||"").split(",")[0]],[icon("euro",13),l.revenue?revShort(l)+" apyvarta":""],[icon("users",13),l.employees||""]].filter(t=>t[1]);
    center=`<article class="focus in" id="lead-${esc(l.id)}">

      <h1 class="fname">${esc(spokenName(l.name))}</h1>${spokenName(l.name)!==l.name?`<p class="fmeta">${esc(l.name)}</p>`:""}
      ${tags.length?`<div class="htags">${tags.map(([i,t])=>`<span>${i}${esc(t)}</span>`).join("")}<span class="need">${esc(l.need||"Svetainė")}</span></div>`:""}
      ${S.editing?`</section>`+editForm(l):`
      <div class="dial"><div class="nr"><span class="lbl">Telefonas</span><span class="num">${esc(l.phone||"—")}</span></div>
        ${l.phone?`<button class="copy" data-act="copy" data-v="${esc(l.phone)}" title="Kopijuoti numerį">${icon("copy",16)}<span>Kopijuoti</span></button><a class="go${S.callFor===l.id&&S.callStart?" live":""}" data-act="dial" data-id="${esc(l.id)}" data-v="${esc(l.phone)}" href="${esc(tel(l.phone))}">${icon("phone",18)} Skambinti</a>`:""}</div>
      <div class="links">${l.email?`<a href="mailto:${esc(l.email)}" class="u">${esc(l.email)}</a>`:""}
        ${l.website&&safeUrl(l.website)?`<a class="u" target="_blank" rel="noreferrer" href="${esc(safeUrl(l.website))}">${esc(host(l.website))}</a>`:`<span class="muted">Svetainės nėra</span>`}
        ${l.source&&safeUrl(l.source)?`<a class="u muted" target="_blank" rel="noreferrer" href="${esc(safeUrl(l.source))}">Šaltinis: ${esc(host(l.source))}</a>`:""}
        ${l.email||l.phone?`<button class="hlink" data-act="mail-open" data-id="${esc(l.id)}">${icon("mail",14)} Laiškas ar SMS</button>`:""}</div>
      </section>
      ${mailPanel(l)}
      ${l.reason?`<div class="whybox${S.whyOpen===l.id?" open":""}" data-act="why-toggle" data-id="${esc(l.id)}" title="Spausk, kad matytum visą"><span class="wicon">${icon("spark",15)}</span><div><span class="lbl">Kodėl skambinti</span><p>${esc(l.reason)}</p></div></div>`:""}
      ${convoHtml(l)}

      <dl class="brief facts">

        <div><dt>Bandymai</dt><dd><span class="mono">${l.attempts||0}</span>${l.lastCalledAt?` <span class="muted">· paskutinis ${when(l.lastCalledAt)}, ${esc(firstName(l.lastCalledBy))}</span>`:""}</dd></div>
        ${l.companyCode?`<div><dt>Įmonės kodas</dt><dd class="mono">${esc(l.companyCode)}</dd></div>`:""}
        ${ld.length?`<div><dt>Sandoriai</dt><dd style="display:flex;gap:14px;flex-wrap:wrap">${ld.map(d=>`<span class="tagline">${ddot(d.stage)}<span class="mono">${eur(d.value)}</span> ${stage(d.stage).label}</span>`).join("")}</dd></div>`:""}
      </dl>`}
      <section class="outcome">
        <header><span>Rezultatas</span><span style="display:inline-flex;align-items:center;gap:12px">${S.callFor===l.id&&S.callStart?`<span class="live-call"><span class="pulse"></span><span id="calltimer" class="mono">${fmtDur(Date.now()-S.callStart)}</span></span>`:""}${desk?`<span class="muted" style="font-weight:400;font-size:12px">klavišai 1–4</span>`:""}</span></header>
        <div class="pad">
        <textarea class="note" rows="2" data-key="note" placeholder="Su kuo kalbėjai ir ką sutarėte (nebūtina)">${esc(S.note)}</textarea>
        ${S.askWhen?`<div class="sub in"><span class="lbl" style="margin-bottom:8px">Kada perskambinti</span><div class="chips">
          ${days.map(([t,d])=>`<button class="chip" data-act="callback" data-d="${d}">${t}</button>`).join("")}
          <input type="datetime-local" class="chip" data-key="custom" value="${esc(S.custom)}">
          ${S.custom?`<button class="chip" data-act="callback-custom" aria-pressed="true">Išsaugoti</button>`:""}
          <button class="chip" data-act="ask-back">Atgal</button></div></div>`
        :S.dealAsk?`<form id="df-${esc(l.id)}" class="dealform sub in" data-act="deal-form">
          <label class="field">Suma, €<input class="inp mono" name="value" inputmode="decimal" placeholder="1200" autofocus></label>

          <label class="field">Kas parduodama<select class="inp" name="title">${NEEDS.map(n=>`<option ${n===l.need?"selected":""}>${n}</option>`).join("")}</select></label>

        ${cur.tab==="queue"?`<div class="skip"><button data-act="skip">Praleisti ${icon("skip",13)}</button></div>`:""}
        </div>
      </section>
    </article>${!wide?threadHtml(l,"below"):""}`;
  }
  if(cur&&!cur.l.aiBrief)queueBrief(cur.l.id);
  return`<div class="call">
    <aside class="queue ${S.sheet?"sheet":""}">${S.sheet?`<button data-act="sheet-close" aria-label="Uždaryti" class="iconbtn" style="position:absolute;right:10px;top:12px">${icon("x")}</button>`:""}${list}</aside>

    ${cur&&wide?threadHtml(cur.l,"side"):""}
  </div>`;
}

/* ===== deals view ===== */
function dealDrawer(){
  const d=deals.find(x=>x.id===S.dealOpen);if(!d)return"";
  const comm=commissionOf(d),prof=profitOf(d);
  return`<div class="drawer" data-act="drawer-bg"><div class="pane thin" data-stop-bg>
    <div class="phd"><b style="font-weight:600" class="trunc">${esc(d.leadName||"—")}</b><button class="iconbtn" data-act="drawer-close" aria-label="Uždaryti">${icon("x")}</button></div>
    <form id="de-${esc(d.id)}" data-act="deal-edit" style="padding:18px;display:grid;gap:14px">
      <label class="field">Etapas<select class="inp" name="stage">${STAGES.map(s=>`<option value="${s.id}" ${s.id===d.stage?"selected":""}>${s.label}</option>`).join("")}</select></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field">Suma, €<input class="inp mono" name="value" inputmode="decimal" value="${esc(num(d.value)||"")}"></label><label class="field">Savikaina, €<input class="inp mono" name="cost" inputmode="decimal" value="${esc(num(d.cost)||"")}"></label></div>
      <label class="field">Kas parduodama<select class="inp" name="title">${NEEDS.map(n=>`<option ${n===d.title?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="field">Susitikimas<input class="inp" type="datetime-local" name="meetingAt" value="${esc(dtLocal(d.meetingAt))}"></label>
      <label class="field">Atsakingas<select class="inp" name="owner">${memberOptions(d.owner,false)}</select></label>
      <label class="field">Pastaba<textarea class="inp" rows="4" name="note">${esc(d.note||"")}</textarea></label>
      <div class="ledger mono">
        <div><span>Suma</span><span>${eur(d.value)}</span></div>
        <div><span>Savikaina</span><span>−${eur(d.cost)}</span></div>
        <div><span>Komisiniai, ${num(member(d.owner).commission)} %</span><span>−${eur(comm)}</span></div>
        <div class="tot"><span>Pelnas</span><span style="color:${prof>=0?"var(--d-won)":"var(--danger)"}">${eur(prof)}</span></div></div>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="deal-open-lead" data-id="${esc(d.leadId)}">Atidaryti kontaktą</button><button class="btn ink">Išsaugoti</button></div>
      <p class="muted" style="font-size:12px">Sukurta ${when(d.createdAt)}${d.closedAt?` · uždaryta ${when(d.closedAt)}`:""}</p>
    </form></div></div>`;
}
function viewDeals(){
  const scoped=deals.filter(d=>S.who==="all"||d.owner===S.who);
  const open=scoped.filter(d=>d.stage==="meeting"||d.stage==="proposal");
  const wonP=scoped.filter(d=>d.stage==="won"&&inPeriod(d.closedAt));
  const rev=wonP.reduce((a,d)=>a+num(d.value),0),prof=wonP.reduce((a,d)=>a+profitOf(d),0),pipe=open.reduce((a,d)=>a+num(d.value),0);
  const closed=scoped.filter(d=>d.stage==="won"||d.stage==="lost"),winRate=closed.length?Math.round(closed.filter(d=>d.stage==="won").length/closed.length*100):null;
  const shown=s=>scoped.filter(d=>d.stage===s&&(s==="meeting"||s==="proposal"||inPeriod(d.closedAt))).sort((a,b)=>ms(b.updatedAt)-ms(a.updatedAt));
  const right=`<select class="sel" data-key="who"><option value="all">Visa komanda</option>${people().map(id=>`<option value="${esc(id)}" ${S.who===id?"selected":""}>${esc(who(id))}</option>`).join("")}</select>
    <div class="seg">${[["month","Šis mėn."],["prev","Praėjęs"],["year","Metai"],["all","Visi"]].map(([v,t])=>`<button data-act="period" data-v="${v}" aria-pressed="${S.period===v}">${t}</button>`).join("")}</div>`;
  return`<div class="scroll thin"><div class="page">${head("Pardavimai","",right)}
    <div class="kpis">
      <div class="kpi"><span class="lbl">Pajamos</span><span class="v">${eur(rev)}</span><small>${pl(wonP.length,"laimėtas sandoris","laimėti sandoriai","laimėtų sandorių")}</small></div>
      <div class="kpi"><span class="lbl">Pelnas</span><span class="v" style="color:${prof<0?"var(--danger)":"inherit"}">${eur(prof)}</span><small>po savikainos ir komisinių</small></div>
      <div class="kpi"><span class="lbl">Derinama</span><span class="v">${eur(pipe)}</span><small>${pl(open.length,"sandoris","sandoriai","sandorių")}</small></div>
      <div class="kpi"><span class="lbl">Laimima</span><span class="v">${winRate===null?"—":winRate+" %"}</span><small>iš ${pl(closed.length,"uždaryto","uždarytų","uždarytų")}</small></div></div>
    <div class="board">${STAGES.map(s=>{const items=shown(s.id);return`<section class="col">
      <h3><span style="display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;color:var(--text);font-weight:600">${ddot(s.id)}${s.label}</span><span>${items.length} · ${eur(items.reduce((a,d)=>a+num(d.value),0))}</span></h3>
      ${items.length?items.map(d=>`<button id="dc-${esc(d.id)}" class="dcard" data-act="deal-open" data-id="${esc(d.id)}">
        <div class="top"><b class="trunc">${esc(d.leadName?spokenName(d.leadName):"—")}</b><span class="mono">${eur(d.value)}</span></div>
        <div class="bot"><span class="trunc">${d.meetingAt&&d.stage==="meeting"?`${icon("cal",12)} ${esc(when(d.meetingAt))}`:esc(d.title||"")}</span><span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">${avatar(d.owner,16)}${when(d.updatedAt)}</span></div>
      </button>`).join(""):`<div class="none">—</div>`}
    </section>`}).join("")}</div>
    ${!deals.length?`<p class="muted" style="margin-top:20px;font-size:13px">Sandoris sukuriamas, kai skambučio rezultatas yra „Nori“ ir įrašai sumą.</p>`:""}
  </div>${dealDrawer()}</div>`;
}

    <form class="fform" data-act="find-form">
      <label class="field">Ką ieškoti<input class="inp" data-key="f.industry" value="${esc(F.industry)}" placeholder="pvz. kirpykla" enterkeyhint="search" ${busy?"disabled":""}></label>
      <div class="qrow">${QUICK_IND.map(v=>quick("industry",v)).join("")}</div>

        <span class="lbl">Metinės pajamos (nieko nepažymėjus – bet kokios)</span><div class="chips">${REVENUE.map(v=>chip("revenue",v)).join("")}</div>
        <span class="lbl" style="margin-top:12px">Ko trūksta</span><div class="chips">${NEEDS.map(v=>chip("needs",v)).join("")}</div></details>
      <div class="fgo"><div class="seg" aria-label="Kiek įmonių">${[5,10,15,20].map(c=>`<button type="button" data-act="fcount" data-v="${c}" aria-pressed="${F.count===c}">${c}</button>`).join("")}</div>
        ${busy?`<button type="button" class="btn" data-act="search-stop">${icon("x",15)} Stabdyti</button>`:`<button class="btn go big">${icon("search",16)} Ieškoti</button>`}</div>
    </form>
    ${busy||found.length||done?`<div class="fres">

/* ===== team view ===== */
function memberStats(id){
  const c=callsBy(id),today=dayKey(Date.now());
  const cT=c.filter(a=>dayKey(ms(a.createdAt))===today),cM=c.filter(a=>inPeriod(a.createdAt,"month"));
  const won=deals.filter(d=>d.owner===id&&d.stage==="won"&&inPeriod(d.closedAt,"month"));
  const rev=won.reduce((a,d)=>a+num(d.value),0);
  return{today:cT.length,month:cM.length,reached:cM.filter(a=>a.status!=="no_answer").length,interested:cM.filter(a=>a.status==="interested").length,won:won.length,rev,comm:won.reduce((a,d)=>a+commissionOf(d),0),leads:leads.filter(l=>l.assignee===id&&l.status!=="declined").length};
}

function ring(n,goal,size){

  return`<svg class="ring${p>=1?" full":""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-label="${n} iš ${goal}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${w}" class="rb"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${w}" class="rf" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p)).toFixed(1)}"/></svg>`;

/* A short burst of confetti for wins: a "Nori", a won deal, new companies found. */
function celebrate(){
  if(still())return;
  const cv=document.createElement("canvas"),dpr=Math.min(2,devicePixelRatio||1);cv.className="confetti";cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;document.body.appendChild(cv);
  const x=cv.getContext("2d");x.scale(dpr,dpr);const C=["#30d158","#64d2ff","#a6f7c0","#ffd60a","#bf5af2","#ffffff"];
  const P=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*13-5,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:5+Math.random()*6,h:8+Math.random()*8,c:C[Math.random()*C.length|0]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/1700;x.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));x.restore()}
    if(k<1)requestAnimationFrame(f);else cv.remove()})(t0);
}

const counted=new WeakSet(),still=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function countUp(){
  document.querySelectorAll(".kpi .v").forEach(el=>{
    if(counted.has(el))return;counted.add(el);if(still())return;
    const node=el.firstChild;if(!node||node.nodeType!==3)return;
    const txt=node.nodeValue,n=Number(txt.replace(/[^\d,.-]/g,"").replace(",","."));if(!Number.isFinite(n)||!n)return;
    const fmt=txt.includes("€")?v=>eur(v):txt.includes("%")?v=>Math.round(v)+" %":v=>String(Math.round(v));
    const t0=performance.now(),dur=750;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);if(el.firstChild===node)node.nodeValue=k<1?fmt(n*e):txt;if(k<1)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  });
}

/* ===== render ===== */
/* Rendering: the page is rebuilt as HTML but patched into the live DOM (morphdom), so the
   element under a finger is never replaced. Live-data renders wait while a finger is down. */
let pointerDown=false,pending=false,frame=0;
function render(bg){
  if(bg){pending=true;if(!pointerDown&&!frame)frame=requestAnimationFrame(()=>{frame=0;if(pending&&!pointerDown)paint()});return}
  paint();
}
const KEEP=new Set(["INPUT","TEXTAREA","SELECT"]);
function morphOpts(){return{
  onBeforeElUpdated(from,to){
    if(from.isEqualNode(to))return false;
    if(KEEP.has(from.tagName)){
      if(from===document.activeElement)return false;          // keep what is being typed, and the caret

const CSVCOLS={name:["pavadinimas","imone","imones pavadinimas","name","company","company name","klientas"],phone:["telefonas","tel","tel.","telefono nr","phone","mobile","mobilus"],
  email:["el. pastas","el pastas","elpastas","pastas","email","e-mail","e-pastas"],city:["miestas","city","vieta"],category:["sritis","kategorija","veikla","category","industry"],
  website:["svetaine","tinklalapis","website","web","url"],companyCode:["imones kodas","kodas","company code","code"],need:["reikia","siulyti","need"],reason:["pastaba","pastabos","kodel skambinti","note","notes"]};
function parseCsv(text){
  text=text.replace(/^\uFEFF/,"");const first=text.split(/\r?\n/)[0]||"";
  const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":first.includes("\t")?"\t":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch;continue}
    if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(c=>c.trim()))rows.push(row);row=[]}else cell+=ch}
  row.push(cell);if(row.some(c=>c.trim()))rows.push(row);
  if(rows.length<2)return null;
  const norm=h=>String(h).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
  const map=rows[0].map(h=>{const n=norm(h);return Object.keys(CSVCOLS).find(k=>CSVCOLS[k].includes(n))||null});
  if(!map.includes("name"))return null;
  return rows.slice(1).map(r=>{const o={};map.forEach((k,i)=>{if(k&&r[i]!=null&&String(r[i]).trim())o[k]=String(r[i]).trim()});if(o.need&&!NEEDS.includes(o.need))delete o.need;return o});
}
async function importLeads(text,filename){

  const key=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(uab|mb|ii|ab|vsi|pi)\b/g,"").replace(/[^a-z0-9]/g,"");
  const ph=s=>String(s||"").replace(/\D/g,"").slice(-8);
  const seen=leads.map(l=>({id:l.id,c:l.companyCode,p:ph(l.phone),n:key(l.name)}));
  let added=0,dup=0;const now=Date.now();
  for(const [i,r] of arr.entries()){
    if(!r||typeof r!=="object"||!String(r.name||"").trim()){continue}
    const c=String(r.companyCode||""),p=ph(r.phone),n=key(r.name),rid=/^[\w.-]{1,100}$/.test(String(r.id||""))?String(r.id):"";
    if(seen.some(x=>(rid&&x.id===rid)||(c&&x.c===c)||(p.length===8&&x.p===p)||(n.length>2&&x.n===n))){dup++;continue}
    const l={id:rid||uid(),status:"new",attempts:0,assignee:"",fresh:true,createdBy:meId||"",createdAt:now-i,updatedAt:now};
    for(const k of LEAD_FIELDS)if(r[k]!==undefined)l[k]=typeof r[k]==="number"?r[k]:String(r[k]).slice(0,2000);
    if(!l.need)l.need="Svetainė";
    if(await put("leads",l.id,l)){added++;seen.push({id:l.id,c,p,n})}
  }
  toast(`Importuota ${pl(added,"kontaktas","kontaktai","kontaktų")}${dup?`, praleista ${dup} jau esamų`:""}.`);
}
async function exportCsv(){
  const cell=v=>/[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  const head=["Pavadinimas","Statusas","Atsakingas","Telefonas","El. paštas","Sritis","Miestas","Pajamos","Reikia","Svetainė","Įmonės kodas","Bandymų","Paskutinis skambutis","Sandorio suma","Sandorio etapas","Šaltinis"];
  const rows=leads.map(l=>{const d=deals.find(x=>x.leadId===l.id);return[l.name,stat(l.status).label,l.assignee?who(l.assignee):"",l.phone,l.email,l.category,l.city,l.revenue,l.need,l.website,l.companyCode,String(l.attempts||0),l.lastCalledAt?new Date(ms(l.lastCalledAt)).toISOString():"",d?String(num(d.value)):"",d?stage(d.stage).label:"",l.source].map(v=>cell(String(v||"")))});
  const csv="﻿"+[head,...rows].map(r=>r.join(";")).join("\n");
  if(downloads){try{await downloads.save({filename:`rysys-${dayKey(Date.now())}.csv`,data:csv});return}catch(e){if(e?.code==="declined")return}}
  try{await navigator.clipboard.writeText(csv);toast("CSV nukopijuotas. Įklijuok į Excel ar Google Sheets.")}catch{toast("Nepavyko eksportuoti.")}
}
