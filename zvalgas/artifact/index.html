<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coldai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap&subset=latin-ext" rel="stylesheet">
<style>
/* Coldline. Colour carries meaning only: green = call / won, red = declined, blue = callback, amber = no answer. Everything else is ink on paper. */
:root{
  --bg:#f3f3f0;--surface:#fff;--sunk:#f7f7f4;--hover:#efefeb;--line:#e1e1dc;--line-2:#cbcbc4;
  --text:#0d0d0c;--text-2:#45453f;--muted:#7a7a72;--ink:#0d0d0c;--on-ink:#fff;
  --call:#0e7a43;--call-hover:#0a6236;--danger:#c2341f;--accent:var(--text);
  --s-new:#8f8f87;--s-no_answer:#b7791f;--s-declined:#c2341f;--s-thinking:#2f5fb3;--s-interested:#0e7a43;
  --d-meeting:#2f5fb3;--d-proposal:#6b46c1;--d-won:#0e7a43;--d-lost:#8f8f87;
  --r:7px;--pop:0 1px 2px rgba(0,0,0,.06),0 8px 24px -8px rgba(0,0,0,.18);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0f0f0e;--surface:#161615;--sunk:#121211;--hover:#1d1d1b;--line:#292926;--line-2:#3b3b37;
  --text:#f0f0eb;--text-2:#bcbcb3;--muted:#85857c;--ink:#f0f0eb;--on-ink:#0f0f0e;
  --call:#1e8a4c;--call-hover:#23a058;--danger:#e2614d;
  --s-new:#85857c;--s-no_answer:#d49a3a;--s-declined:#e2614d;--s-thinking:#6b9be6;--s-interested:#27a85f;
  --d-meeting:#6b9be6;--d-proposal:#a48ae6;--d-won:#27a85f;--d-lost:#85857c;
  --pop:0 1px 2px rgba(0,0,0,.4),0 12px 32px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{font-family:"Geist",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;border-radius:0}
select option{background:var(--surface);color:var(--text)}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
a{color:inherit;text-decoration:none}
::selection{background:var(--ink);color:var(--on-ink)}
:focus-visible{outline:2px solid var(--text);outline-offset:1px}
.mono,.num{font-family:"Geist Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.t2{color:var(--text-2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:1px;flex-shrink:0}
.thin{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html{-webkit-tap-highlight-color:transparent}
a,button,summary,label,select,input,textarea,[data-act]{touch-action:manipulation}
button,a.go,.btn,.chip,.obtn,.qitem,.dcard,.nav a,.tabs a{transition:transform .08s ease,background-color .12s ease,border-color .12s ease,color .12s ease}
button:active:not(:disabled),a.go:active,.btn:active,.chip:active,.nav a:active,.tabs a:active{transform:scale(.97)}
.obtn:active:not(:disabled),.qitem:active,.dcard:active{transform:scale(.985)}
.tnum{font-variant-numeric:tabular-nums}
.kbd{display:inline-block;min-width:18px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;font-family:"Geist Mono",monospace;font-size:10.5px;line-height:15px;text-align:center;color:var(--muted)}
@media(pointer:coarse){
  .btn,.seg button,.qtabs button,.chip,.sel,.search,.pick>button{min-height:44px}
  .inp{height:46px}.mini{height:40px;width:72px}
  .nav a,.sidefoot button,.sidefoot .who{height:46px}
  .qitem{padding:14px 16px}.obtn{height:64px}
  .menu button{padding:13px 12px}
  .iconbtn{width:44px;height:44px}
  .grid td{padding:13px 10px}
  .skip button{min-height:44px;padding:0 6px}
  .tabs a{padding:10px 0 9px}
  .cv-me input{height:40px;width:104px;font-size:16px}
}
@keyframes in{from{opacity:0}to{opacity:1}}
.in{animation:in .18s ease-out both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* shell */
.app{display:flex;height:100dvh;flex-direction:column}
@media(min-width:768px){.app{flex-direction:row}}
.side{display:none;width:64px;flex-shrink:0;flex-direction:column;border-right:1px solid var(--line);background:var(--surface)}
@media(min-width:768px){.side{display:flex}}
@media(min-width:1180px){.side{width:216px}}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;padding:0 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;letter-spacing:-.02em}
@media(min-width:1180px){.brand{justify-content:flex-start;padding:0 18px}}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--call);color:#fff;flex-shrink:0}
.brand .live{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex-shrink:0;margin-left:auto}
.brand .live{display:none}@media(min-width:1180px){.brand .live{display:block}}
.brand .live.on{background:var(--call)}
.brand .word{display:none}
@media(min-width:1180px){.brand .word{display:inline}}
.nav{display:flex;flex-direction:column;padding:10px 8px;gap:1px}
.nav a{display:flex;align-items:center;justify-content:center;gap:11px;height:40px;padding:0 12px;border-radius:var(--r);color:var(--text-2);font-size:14px;font-weight:500}
@media(min-width:1180px){.nav a{justify-content:flex-start}}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a[aria-current=page]{background:var(--sunk);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current=page] svg{color:var(--call)}
.nav .lab,.nav .cnt{display:none}
@media(min-width:1180px){.nav .lab{display:inline}.nav .cnt{display:inline;margin-left:auto;font-family:"Geist Mono",monospace;font-size:11.5px;opacity:.7}}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.sidefoot button,.sidefoot .who{display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border-radius:var(--r);color:var(--text-2);font-size:13px;width:100%;text-align:left}
.sidefoot button:hover{background:var(--hover);color:var(--text)}
.sidefoot .lab{display:none}
@media(min-width:1180px){.sidefoot .lab{display:inline}}
.main{position:relative;min-width:0;min-height:0;flex:1;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:768px){.tabs{display:none}}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;font-size:10.5px;color:var(--muted)}
.tabs a[aria-current=page]{color:var(--text);font-weight:600}.tabs a[aria-current=page] svg{color:var(--call)}
.banner{padding:9px 20px;font-size:13px;border-bottom:1px solid var(--line);background:var(--surface);color:var(--text-2)}
.banner.err{background:var(--danger);color:#fff;border-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;border-radius:var(--r);background:var(--ink);color:var(--on-ink);padding:10px 14px;font-size:13px;box-shadow:var(--pop);max-width:calc(100vw - 32px)}
.avatar{display:inline-flex;flex-shrink:0;align-items:center;justify-content:center;border-radius:3px;color:#fff;font-weight:500;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.scroll{height:100%;overflow-y:auto}
.page{max-width:1280px;margin:0 auto;padding:0 16px 72px}
@media(min-width:768px){.page{padding:0 32px 72px}}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:24px}
.ph h1{font-size:20px;font-weight:700;letter-spacing:-.025em}
.ph .meta{margin-left:10px;font-size:13px;color:var(--muted);font-weight:400}
.lbl{display:block;font-size:12px;color:var(--muted)}
.btn{display:inline-flex;height:34px;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);padding:0 12px;font-size:13px;font-weight:500;border:1px solid var(--line-2);background:var(--surface);color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ink:hover{opacity:.88}
.btn.go{background:var(--call);border-color:var(--call);color:#fff}
.btn.go:hover{background:var(--call-hover)}
.inp{height:38px;width:100%;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 10px;font-size:16px;color:var(--text)}
@media(min-width:1024px){.inp{font-size:14px}}
.inp:focus{border-color:var(--text);outline:none}
.inp::placeholder,textarea::placeholder{color:var(--muted)}
textarea.inp{height:auto;padding:9px 10px;line-height:1.5;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{height:30px;padding:0 11px;font-size:12.5px;color:var(--text-2);border-left:1px solid var(--line-2);white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 11px;font-size:13px;color:var(--text-2);background:var(--surface)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.tagline{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.empty{display:grid;place-items:center;min-height:60vh;padding:64px 24px;text-align:center}
.empty h2{font-size:18px;font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 1px 2px rgba(16,16,14,.04)}
.sect{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sect span{font-weight:400;font-size:12px;color:var(--muted)}

/* call */
.call{display:flex;height:100%}
.queue{display:none;width:300px;flex-shrink:0;border-right:1px solid var(--line);background:var(--surface);flex-direction:column;min-height:0}
@media(min-width:1024px){.queue{display:flex}}
.queue.sheet{display:flex;position:absolute;inset:0;z-index:30;width:auto}
.qhead{padding:0 14px 10px;border-bottom:1px solid var(--line)}
.qtop{display:flex;align-items:center;justify-content:space-between;height:56px}
.qtop h1{font-size:15px;font-weight:600}
.goal{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:10px}
.goal .track{flex:1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.goal .track span{display:block;height:100%;background:var(--call)}
.qtabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.qtabs button{height:30px;font-size:12.5px;color:var(--text-2);border-left:1px solid var(--line-2)}
.qtabs button:first-child{border-left:0}
.qtabs button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.qtabs .n{font-family:"Geist Mono",monospace;font-size:11px;opacity:.7;margin-left:4px}
.qlist{flex:1;min-height:0;overflow-y:auto;list-style:none}
.qitem{display:grid;grid-template-columns:8px 1fr auto;column-gap:10px;row-gap:2px;width:100%;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line)}
.qitem:hover{background:var(--hover)}
.qitem[aria-current=true]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--text)}
.qitem .dot{margin-top:6px}
.qitem b{font-weight:500;font-size:13.5px}
.qitem small{grid-column:2/4;font-size:12px;color:var(--muted)}
.center{min-width:0;flex:1;overflow-y:auto}
.mbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;height:48px;border-bottom:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:13px}
@media(min-width:1024px){.mbar{display:none}}
.focus{max-width:820px;margin:0 auto;padding:22px 16px 40px}
@media(min-width:768px){.focus{padding:28px 32px 48px}}
.crumbs{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.crumbs .push{margin-left:auto}
.fname{margin-top:10px;font-size:28px;font-weight:600;line-height:1.15;letter-spacing:-.02em;word-break:break-word}
@media(min-width:768px){.fname{font-size:32px}}
.fmeta{margin-top:4px;font-size:14px;color:var(--text-2)}
.dial{margin-top:22px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(16,16,14,.04),0 10px 30px -18px rgba(16,16,14,.25)}
@media(min-width:640px){.dial{flex-direction:row;align-items:stretch}}
.dial .nr{flex:1;padding:16px 20px}
.dial .copy{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;padding:0 18px;border-top:1px solid var(--line);color:var(--text-2);font-size:13.5px;font-weight:500}
.dial .copy:hover{background:var(--hover)}
@media(min-width:640px){.dial .copy{border-top:0;border-left:1px solid var(--line)}.dial .copy span{display:none}}
.dial .nr .num{display:block;margin-top:2px;font-size:26px;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.dial a.go{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 30px;background:var(--call);color:#fff;font-size:16px;font-weight:600;letter-spacing:-.01em}
.dial a.go:hover{background:var(--call-hover)}
.links{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--text-2)}
.links a,.links span{display:inline-flex;align-items:center;gap:6px}
.u{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.u:hover{text-decoration-color:var(--text)}
.brief{margin-top:24px;display:grid;gap:0;border-top:1px solid var(--line)}
.brief>div{display:grid;grid-template-columns:1fr;gap:2px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
@media(min-width:640px){.brief>div{grid-template-columns:132px 1fr;gap:16px;padding:12px 0}}
.brief dt{color:var(--muted);font-size:13px}
.brief dd{color:var(--text);word-break:break-word}
.brief .why dd{font-size:15px;line-height:1.55}
.whybox{margin-top:20px;border-left:3px solid var(--call);padding:2px 0 2px 14px}
.whybox p{margin-top:4px;font-size:15px;line-height:1.55;color:var(--text)}
.cv{margin-top:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(16,16,14,.04);overflow:hidden}
.cv>header{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;min-height:48px;padding:6px 10px 6px 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.mini-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.mini-btn:hover{background:var(--hover);color:var(--text)}
.cv-me{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.cv-me input{width:92px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:var(--sunk);font:inherit;font-size:13px;color:var(--text)}
.cv-me input:focus{outline:none;border-color:var(--text);background:var(--surface)}
.cv-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.cv-past{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.cv-you{font-size:13.5px;line-height:1.5;color:var(--muted)}
.cv-them{display:flex;justify-content:flex-end}
.cv-them span{display:inline-block;max-width:80%;border-radius:12px 12px 4px 12px;background:var(--ink);color:var(--on-ink);padding:6px 12px;font-size:13px;font-weight:500}
.cv-now .lbl{display:block;margin-bottom:6px}
.cv-say{font-size:18px;line-height:1.5;letter-spacing:-.005em;color:var(--text);font-weight:500}
@media(min-width:768px){.cv-say{font-size:19px}}
.cv-replies{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.cv-replies{grid-template-columns:1fr 1fr}}
.cv-reply{min-height:48px;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--sunk);text-align:left;font-size:14.5px;font-weight:500;color:var(--text)}
.cv-reply:hover{border-color:var(--text);background:var(--surface)}
.cv-end{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--tone);border-radius:10px;padding:12px 14px;background:var(--sunk)}
.cv-end b{display:block;font-size:15px}
.cv-end small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
details.plan{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.plan summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 16px;font-size:14px;font-weight:600}
details.plan summary::-webkit-details-marker{display:none}
details.plan[open] summary svg{transform:rotate(180deg)}
details.plan .body{padding:0 14px 14px;font-size:14px;line-height:1.6;color:var(--text-2)}
details.plan .say{border-left:2px solid var(--text);padding:2px 0 2px 12px;color:var(--text);margin:6px 0 16px}
details.plan dl{display:grid;gap:10px}
details.plan dt{font-weight:500;color:var(--text)}
.outcome{margin-top:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(16,16,14,.04)}
.outcome header{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.live-call{display:inline-flex;align-items:center;gap:7px;color:var(--call);font-weight:500;font-size:13px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--call);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.outcome .pad{padding:14px}
textarea.note{width:100%;resize:vertical;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunk);padding:10px 12px;font-size:16px;line-height:1.5;color:var(--text)}
@media(min-width:1024px){textarea.note{font-size:14px}}
textarea.note:focus{border-color:var(--text);outline:none;background:var(--surface)}
.obtns{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:640px){.obtns{grid-template-columns:repeat(4,1fr)}}
.obtn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:58px;padding:0 16px;font-size:15px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.obtn:hover{border-color:var(--line-2)}
.obtn:hover{background:var(--hover)}
.obtn span{display:inline-flex;align-items:center;gap:9px}
.obtn .kbd{display:none}
@media(min-width:768px){.obtn .kbd{display:inline-block}}
.sub{margin-top:12px}
.skip{display:flex;justify-content:flex-end;margin-top:10px}
.skip button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.skip button:hover{color:var(--text)}
.dealform{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:640px){.dealform{grid-template-columns:1fr 1fr 1fr}}
.dealform .full{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.thread{display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.thread.side{width:356px;flex-shrink:0;border-left:1px solid var(--line)}
.thread.below{height:520px;border-top:1px solid var(--line)}
.thead{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600}
.tlist{flex:1;min-height:0;overflow-y:auto;padding:14px 18px;list-style:none;display:flex;flex-direction:column;gap:14px}
.titem{display:grid;grid-template-columns:24px 1fr;gap:10px}
.titem .h{display:flex;align-items:baseline;gap:8px;font-size:13px}
.titem .h b{font-weight:600}
.titem .ev{margin-top:2px;font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.titem .msg{margin-top:5px;white-space:pre-wrap;font-size:13.5px;line-height:1.5;color:var(--text);border-left:2px solid var(--line-2);padding-left:10px}
.composer{border-top:1px solid var(--line);padding:10px}
.composer div{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:4px}
.composer div:focus-within{border-color:var(--text)}
.composer textarea{flex:1;max-height:128px;min-height:34px;resize:none;padding:7px 8px;font-size:16px}
@media(min-width:1024px){.composer textarea{font-size:13.5px}}
.composer textarea:focus{outline:none}
.send{display:grid;place-items:center;width:34px;height:34px;flex-shrink:0;border-radius:3px;background:var(--ink);color:var(--on-ink)}

/* tables & lists */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;flex:1 1 260px;min-width:0;height:34px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 10px;color:var(--muted)}
.search:focus-within{border-color:var(--text)}
.search input{flex:1;min-width:0;height:100%;font-size:16px;color:var(--text)}
@media(min-width:1024px){.search input{font-size:13.5px}}
.search input:focus{outline:none}
.sel{height:34px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 8px;font-size:13px;color:var(--text-2)}
.statusbar{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px}
.statusbar button{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.statusbar button:hover{color:var(--text)}
.statusbar button[aria-pressed=true]{color:var(--text);border-bottom-color:var(--text);font-weight:500}
.statusbar .n{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--muted)}
.grid{width:100%;border-collapse:collapse;font-size:13.5px}
.grid th{position:sticky;top:0;z-index:1;background:var(--bg);text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.grid td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{background:var(--surface)}
.grid .r{text-align:right}
.hide-s{display:none}
.hide-m{display:none}
@media(min-width:900px){.hide-s{display:table-cell}}
@media(min-width:1280px){.hide-m{display:table-cell}}
.tablewrap{overflow-x:auto}
.pick{position:relative;display:inline-block}
.pick>button{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.pick>button:hover{border-color:var(--line-2)}
.menu{position:absolute;right:0;z-index:30;margin-top:4px;width:232px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:4px;box-shadow:var(--pop);list-style:none}
.menu button{display:flex;width:100%;align-items:center;gap:10px;border-radius:3px;padding:8px 10px;text-align:left;font-size:13px;color:var(--text-2)}
.menu button:hover{background:var(--hover);color:var(--text)}
.mini{height:28px;width:64px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);padding:0 8px;font-size:13px;text-align:right;color:var(--text)}
.mini:focus{border-color:var(--text);outline:none}
.panel{padding:16px}
form.add{display:grid;gap:10px;padding:16px;margin-bottom:16px}
@media(min-width:640px){form.add{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){form.add{grid-template-columns:repeat(4,1fr)}}
form.add .acts{display:flex;align-items:center;justify-content:flex-end;gap:8px}
@media(min-width:640px){form.add .acts{grid-column:1/-1}}
.req{width:100%;min-height:180px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--sunk);padding:10px;font-family:"Geist Mono",monospace;font-size:12.5px;line-height:1.6;resize:vertical;color:var(--text)}

/* metrics */
.kpis{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(16,16,14,.04);background:var(--surface);overflow:hidden}
@media(min-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:16px 18px;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px}
.kpi .v{display:block;margin-top:8px;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.cols{display:grid;gap:16px;margin-top:16px}
@media(min-width:960px){.cols{grid-template-columns:1fr 1fr}}
.funnel{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:104px 1fr 84px;align-items:center;gap:12px;font-size:13px}
.ftrack{height:18px;background:var(--sunk);border:1px solid var(--line)}
.ftrack span{display:block;height:100%}
.bars{height:140px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line-2)}
.bars button{flex:1;height:100%;display:flex;align-items:flex-end}
.bars span{display:block;width:100%;background:var(--text);border-radius:2px 2px 0 0}
.axis{margin-top:6px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:"Geist Mono",monospace}
.board{display:grid;gap:16px;margin-top:20px}
@media(min-width:1000px){.board{grid-template-columns:repeat(4,minmax(0,1fr))}}
.col h3{display:flex;align-items:center;justify-content:space-between;gap:8px;height:34px;font-size:13px;font-weight:600;border-bottom:2px solid var(--text);margin-bottom:8px}
.col h3 span{font-weight:400;font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted)}
.dcard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(16,16,14,.04);background:var(--surface);padding:11px 12px;margin-bottom:8px}
.dcard:hover{border-color:var(--line-2)}
.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.dcard .top b{font-weight:500;font-size:13.5px}
.dcard .bot{margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.none{padding:14px 4px;font-size:12.5px;color:var(--muted)}
.drawer{position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(0,0,0,.32)}
.drawer .pane{width:min(420px,100%);height:100%;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line-2);animation:in .15s both}
.drawer .phd{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 18px;border-bottom:1px solid var(--line)}
.ledger{border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.ledger div{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line)}
.ledger div:first-child{border-top:0}
.ledger .tot{font-weight:600;background:var(--sunk)}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r);color:var(--muted)}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.rank{font-family:"Geist Mono",monospace;font-size:12px;color:var(--muted);width:18px;display:inline-block}
/* ===== modern layer ===== */
:root{--r:10px;--sh:0 1px 0 rgba(16,16,14,.03),0 1px 2px rgba(16,16,14,.04),0 6px 20px -10px rgba(16,16,14,.12);--tint:color-mix(in srgb,var(--call) 7%,var(--surface))}
:root[data-theme=dark]{--sh:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.7)}
body{font-size:14.5px;letter-spacing:-.003em}
.dot{border-radius:50%}
.avatar{border-radius:50%}
.box,.kpis,.cv,.outcome{border-radius:18px;box-shadow:var(--sh)}
.dial{border-radius:18px}
.dcard{border-radius:14px;box-shadow:var(--sh)}
.ph h1{font-size:22px;letter-spacing:-.03em}
.fname{font-weight:650;letter-spacing:-.035em}
.qtabs,.seg{border:0;background:var(--hover);padding:3px;border-radius:11px;gap:2px}
.qtabs button,.seg button{border:0!important;border-radius:8px;color:var(--muted)}
.qtabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 6px -2px rgba(0,0,0,.08);font-weight:500}
.qitem{margin:2px 8px;width:calc(100% - 16px);border:0;border-radius:12px;padding:11px 12px}
.qitem[aria-current=true]{background:var(--tint);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--call) 22%,transparent)}
.qitem .qrev{align-self:center;font-size:11.5px;color:var(--text-2);background:var(--hover);border-radius:6px;padding:1px 6px}
.qlist{padding:6px 0 12px}
.whybox{border-left:0;background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--sh);position:relative}
.whybox::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--call)}
.cv>header{border-bottom:0;padding-top:10px}
.cv-body{padding:4px 16px 18px}
.cv-past{border-bottom:0;padding-bottom:4px}
.cv-you{font-size:13.5px}
.cv-them span{border-radius:14px 14px 4px 14px;padding:7px 13px}
.cv-now{margin-top:6px;background:var(--tint);border:1px solid color-mix(in srgb,var(--call) 18%,transparent);border-radius:16px;padding:16px}
.cv-now>.lbl:first-child{color:var(--call);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.cv-say{font-size:19px;line-height:1.5;letter-spacing:-.012em}
@media(min-width:768px){.cv-say{font-size:20.5px}}
.cv-tip{margin-top:10px;display:flex;gap:7px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--text-2)}
.cv-tip svg{flex-shrink:0;margin-top:2px;color:var(--call)}
.cv-reply{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 36px 11px 14px;box-shadow:0 1px 2px rgba(16,16,14,.04)}
.cv-reply::after{content:"→";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);transition:transform .12s ease,color .12s ease}
.cv-reply:hover{border-color:var(--call);background:var(--surface)}
.cv-reply:hover::after{color:var(--call);transform:translate(3px,-50%)}
.cv-end{background:var(--surface);border-radius:14px}
.obtn{border-radius:14px;background:var(--surface);box-shadow:0 1px 2px rgba(16,16,14,.04)}
.kpi .v{font-weight:650;letter-spacing:-.04em}
.ftrack{border:0;border-radius:6px;overflow:hidden;background:var(--hover)}
.ftrack span{border-radius:6px}
.bars{gap:6px;border-bottom:0;height:150px}
.bars span{background:color-mix(in srgb,var(--call) 70%,var(--surface));border-radius:6px}
.bars button:last-child span{background:var(--call)}
.col h3{height:auto;padding-bottom:10px;border-bottom:2px solid var(--line);flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:3px}
.col h3 span{white-space:nowrap}
.grid th{background:transparent}
.grid tbody tr:hover td{background:var(--tint)}
.menu{border-radius:14px}.menu button{border-radius:8px}
.toast{border-radius:12px}
.btn{border-radius:10px}
.btn.go{box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 16px -8px color-mix(in srgb,var(--call) 80%,transparent)}
.dial a.go{font-size:16.5px}
.nav a[aria-current=page]{background:var(--tint);box-shadow:none;color:var(--text);font-weight:600}
@media(max-width:899px){.grid td:first-child{max-width:190px!important}.grid td,.grid th{padding-left:6px;padding-right:6px}}
/* ===== modern layer 2 ===== */
:root{--bg:#f4f5f2;--hero1:#0d1611;--hero2:#14251b;--glow:#22c55e}
:root[data-theme=dark]{--bg:#0b0c0b;--hero1:#121c16;--hero2:#18291f}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.main{background:radial-gradient(900px 320px at 75% -120px,color-mix(in srgb,var(--call) 9%,transparent),transparent 70%)}
.side{background:color-mix(in srgb,var(--surface) 70%,var(--bg));border-right:1px solid var(--line)}
.brand{border-bottom:0;height:68px}
.mark{background:linear-gradient(145deg,#2fbf6b,#0b6b3a);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px -4px rgba(14,122,67,.6);border-radius:10px}
.nav{gap:3px}
.nav a{border-radius:11px;height:42px}
.sidefoot{border-top:0}
.ph{border-bottom:0;min-height:76px;padding:22px 0 8px;margin-bottom:14px}
.ph h1{font-size:27px;font-weight:700;letter-spacing:-.04em}
/* hero */
.focus{max-width:860px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--glow) 26%,transparent),transparent 55%),linear-gradient(160deg,var(--hero1),var(--hero2));
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 48px -28px rgba(8,30,18,.8);animation:rise .3s ease-out both}
@media(min-width:768px){.hero{padding:26px 28px 22px}}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%);border-radius:inherit}
.hero{--text:#f2f4f1;--muted:rgba(255,255,255,.6)}
.hero .crumbs{color:rgba(255,255,255,.6)}
.hero .crumbs>span:first-child{background:rgba(255,255,255,.1);border-radius:99px;padding:4px 10px 4px 8px;color:#fff!important}
.hero .crumbs .push{color:rgba(255,255,255,.75)}
.hero .fname{margin-top:14px;color:#fff;font-size:30px}
@media(min-width:768px){.hero .fname{font-size:38px}}
.hero .fmeta{color:rgba(255,255,255,.55);font-size:13px;margin-top:6px}
.htags{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.htags span{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);font-size:12.5px;color:rgba(255,255,255,.88)}
.htags svg{opacity:.7}
.htags .need{background:color-mix(in srgb,var(--glow) 22%,transparent);border-color:color-mix(in srgb,var(--glow) 40%,transparent);color:#d7ffe6;font-weight:500}
.hero .dial{margin-top:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);box-shadow:none;border-radius:18px;backdrop-filter:blur(6px)}
.hero .dial .lbl{color:rgba(255,255,255,.55)}
.hero .dial .nr .num{color:#fff;font-size:30px;letter-spacing:-.02em}
.hero .dial .copy{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.1)}
.hero .dial .copy:hover{background:rgba(255,255,255,.06)}
.hero .dial a.go{background:linear-gradient(180deg,#26b765,#149a50);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px -10px rgba(34,197,94,.7);font-size:17px}
.hero .dial a.go:hover{background:linear-gradient(180deg,#2cc66f,#17a957)}
.hero .links{margin-top:14px;color:rgba(255,255,255,.7)}
.hero .links .muted{color:rgba(255,255,255,.5)}
.hero .u{text-decoration-color:rgba(255,255,255,.25)}
.hero .avatar{box-shadow:0 0 0 2px rgba(255,255,255,.15)}
/* why */
.whybox{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;margin-top:14px}
.whybox::before{display:none}
.wicon{display:grid;place-items:center;width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--tint);color:var(--call)}
.whybox p{margin-top:3px}
/* facts */
.brief.facts{border-top:0;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:768px){.brief.facts{grid-template-columns:repeat(4,1fr)}}
.brief.facts>div{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--sh)}
.brief.facts>div:last-child:nth-child(odd){grid-column:1/-1}
@media(min-width:768px){.brief.facts>div:last-child:nth-child(odd){grid-column:auto}}
.brief.facts dt{font-size:12px}
.brief.facts dd{font-size:15px;font-weight:550;letter-spacing:-.01em}
.brief.facts dd .muted{font-weight:400}
/* conversation + outcome */
.cv,.outcome{margin-top:16px}
.cv>header,.outcome header{font-size:15px;letter-spacing:-.01em}
.outcome header{border-bottom:0;padding-top:6px}
.outcome .pad{padding:0 16px 16px}
.obtn{height:64px;font-size:15.5px}
.obtn .dot{width:10px;height:10px;box-shadow:0 0 0 4px color-mix(in srgb,var(--tone) 18%,transparent)}
.obtn:hover{border-color:var(--tone);background:color-mix(in srgb,var(--tone) 7%,var(--surface))}
textarea.note{border-radius:14px;border-color:var(--line)}
/* queue */
.qhead{border-bottom:0;padding-bottom:6px}
.qtop h1{font-size:17px;font-weight:700;letter-spacing:-.03em}
.goal .track{height:6px;border-radius:99px;background:var(--hover)}
.goal .track span{border-radius:99px;background:linear-gradient(90deg,#2fbf6b,var(--call))}
/* metrics */
.kpis{background:none;border:0;box-shadow:none;overflow:visible;gap:12px;border-radius:0}
.kpi{margin:0;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--sh);padding:18px 20px;animation:rise .35s ease-out both}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}
.kpi:first-child{border:0;color:#fff;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--glow) 28%,transparent),transparent 60%),linear-gradient(160deg,var(--hero1),var(--hero2));box-shadow:0 18px 40px -24px rgba(8,30,18,.8)}
.kpi:first-child .lbl,.kpi:first-child small{color:rgba(255,255,255,.6)}
.kpi .v{font-size:34px}
.cols .box,.box{border-radius:18px}
.box{animation:rise .35s ease-out both}
.funnel{gap:10px}
.ftrack{height:22px}
/* board */
.board{gap:12px}
.col{background:color-mix(in srgb,var(--text) 3.5%,transparent);border-radius:18px;padding:12px 10px 4px;min-height:120px}
.col h3{border-bottom:0;padding:0 4px 10px}
.dcard{border-radius:14px}
.none{padding:6px 6px 14px}
/* tables */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.grid th{background:var(--surface);padding-top:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid tr:last-child td{border-bottom:0}
.grid td:first-child,.grid th:first-child{padding-left:16px}
.statusbar{border-bottom:0;gap:4px;margin-bottom:14px}
.statusbar button{border:0;margin:0;border-radius:99px;height:34px;padding:0 13px;background:transparent}
.statusbar button[aria-pressed=true]{background:var(--surface);box-shadow:var(--sh);border:0}
.search,.sel{border-radius:12px;border-color:var(--line);background:var(--surface);height:38px}
/* mobile */
.tabs{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px)}
.tabs a[aria-current=page]{color:var(--call)}
.mbar{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
@media(max-width:767px){.hero{border-radius:20px;padding:18px 16px}.hero .dial .nr .num{font-size:26px}.focus{padding-top:14px}}
.ailog{margin-top:12px;list-style:none;border-radius:12px;background:var(--sunk);border:1px solid var(--line);padding:10px 12px;font-family:"Geist Mono",monospace;font-size:12px;line-height:1.7;color:var(--text-2);max-height:180px;overflow:auto}
.ailog li.now{color:var(--call)}
.ailog li.now::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;background:var(--call);animation:pulse 1s infinite}
.cblist{display:flex;flex-direction:column;gap:4px}
.cbrow{display:grid;grid-template-columns:10px minmax(0,1.4fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 10px;border-radius:12px;text-align:left;font-size:13.5px}
.cbrow:hover{background:var(--tint)}
.cbrow b{font-weight:550}
.cbrow .late{color:var(--danger)}
label.btn{cursor:pointer}
/* compact call screen: card + conversation fit an iPad screen */
@media(min-width:768px){
  .focus{padding-top:18px}
  .hero{padding:20px 24px 18px}
  .hero .fname{font-size:32px;margin-top:10px}
  .htags{margin-top:10px}
  .hero .dial{margin-top:14px}
  .hero .dial .nr{padding:12px 18px}
  .hero .dial .nr .num{font-size:26px}
  .hero .dial a.go{min-height:54px}
  .hero .links{margin-top:10px}
  .whybox{margin-top:12px;padding:12px 16px}
  .whybox p{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  .whybox.open p{-webkit-line-clamp:unset}
  .cv{margin-top:12px}
}
/* ===== Claude chat ===== */
.tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr}
.chat{height:100%;display:flex;flex-direction:column;max-width:880px;margin:0 auto;padding:0 16px}
.chead{display:flex;align-items:center;gap:12px;padding:18px 2px 12px}
.ctitle{flex:1;min-width:0}.ctitle b{display:block;font-size:20px;letter-spacing:-.03em}.ctitle small{color:var(--muted);font-size:13px}
.cav{display:inline-grid;place-items:center;flex-shrink:0;width:28px;height:28px;border-radius:9px;color:#fff;background:linear-gradient(145deg,#2fbf6b,#0b6b3a);box-shadow:0 4px 12px -4px rgba(14,122,67,.6)}
.cav.big{width:40px;height:40px;border-radius:12px}.cav.huge{width:56px;height:56px;border-radius:17px}
.cctx{display:flex;align-items:center;gap:6px;align-self:flex-start;margin-bottom:8px;padding:2px 4px 2px 12px;border-radius:99px;background:var(--tint);border:1px solid color-mix(in srgb,var(--call) 22%,transparent);font-size:13px}
.cmsgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 2px 16px}
.cmsg{display:flex;gap:10px;animation:rise .25s ease-out both}
.cmsg.me{justify-content:flex-end}
.cmsg.me .cb{max-width:78%;background:var(--ink);color:var(--on-ink);border-radius:18px 18px 5px 18px;padding:10px 14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.cmsg.ai .cb{flex:1;min-width:0;font-size:15.5px;line-height:1.6;color:var(--text);padding-top:3px}
.cmsg.ai .cb p{margin:0 0 8px}.cmsg.ai .cb ul{margin:4px 0 10px 18px}.cmsg.ai .cb li{margin:3px 0}
.cmsg.ai .cb code{font-family:"Geist Mono",monospace;font-size:13px;background:var(--hover);padding:1px 5px;border-radius:5px}
.csearch{display:inline-flex;align-items:center;gap:5px;margin:0 6px 8px 0;padding:3px 9px;border-radius:99px;background:var(--hover);color:var(--text-2);font-size:12px}
.typing{display:inline-flex;gap:4px;padding:8px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.cempty{margin:auto;text-align:center;max-width:620px;padding:24px 0}
.cempty h2{margin-top:14px;font-size:26px;letter-spacing:-.035em}.cempty p{margin-top:6px;font-size:14px}
.csugg{margin-top:22px;display:grid;grid-template-columns:1fr;gap:10px;text-align:left}
@media(min-width:640px){.csugg{grid-template-columns:1fr 1fr}}
.csugg button{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);text-align:left}
.csugg button:hover{border-color:var(--call)}.csugg b{font-size:14px}.csugg span{font-size:13px;color:var(--muted);line-height:1.45}
.cerr{align-self:center;border-radius:12px;background:color-mix(in srgb,var(--danger) 10%,var(--surface));color:var(--danger);padding:9px 14px;font-size:13.5px}
.ccomp{display:flex;align-items:flex-end;gap:8px;margin:0 0 16px;padding:8px 8px 8px 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh)}
.ccomp:focus-within{border-color:var(--call);box-shadow:0 0 0 4px color-mix(in srgb,var(--call) 12%,transparent)}
.ccomp textarea{flex:1;min-height:40px;max-height:180px;resize:none;border:0;outline:none;background:none;padding:9px 0;font:inherit;font-size:16px;line-height:1.45;color:var(--text)}
.csend{display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;border-radius:14px;color:#fff;background:linear-gradient(180deg,#22b061,#0e8a49)}
.askai{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--glow) 18%,transparent);border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);color:#d7ffe6!important;font-weight:500}
.crumbs .askai+button{margin-left:4px}
.aioff{display:flex;gap:12px;align-items:flex-start}.aioff p{margin-top:6px;font-size:14px;line-height:1.6}
.aioff code{font-family:"Geist Mono",monospace;font-size:12.5px;background:var(--hover);padding:1px 5px;border-radius:5px}
@media(max-width:767px){.chat{padding:0 12px}.ccomp{margin-bottom:10px}}
/* ===== AI plan, model picker ===== */
.mark{background:linear-gradient(145deg,#34d27a,#0a6a39 70%);color:#fff}
.mpick button{min-width:0}
.aibrief{margin-top:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh);padding:12px 16px 14px}
.aibrief header{display:flex;align-items:center;gap:8px;font-size:14px}.aibrief header b{flex:1}
.aib{margin-top:8px;font-size:14.5px;line-height:1.55}.aib p{margin:0 0 6px}.aib ul{margin:2px 0 8px 18px}.aib li{margin:2px 0}
.aierr{margin-top:8px;font-size:13px;color:var(--danger)}

.shim i:nth-child(2){width:82%}.shim i:nth-child(3){width:64%}

@media(max-width:560px){.hide-xs{display:none}}
.hero .crumbs button.t2{color:rgba(255,255,255,.72)}

/* How a name sounds out loud: "BALTIC FOREST GROUP, UAB" -> "Baltic Forest Group". */
const LOWER=/^(IR|IN|AND|ĮMONĖ|GROŽIO|SALONAS)$/i;
const LEGAL=/^(UAB|MB|IĮ|AB|VŠĮ|PĮ|IVV|ŽŪB|KB|TŪB)$/i;
function spokenName(n){
  n=String(n||"").replace(/\([^)]*\)/g," ").split(",")[0];
  const w=n.split(/\s+/).filter(t=>t&&!LEGAL.test(t.replace(/[.,]/g,"")));
  const out=w.map((t,i)=>i&&LOWER.test(t)?t.toLocaleLowerCase("lt"):/\p{Ll}/u.test(t)||t.length<3||t.includes(".")?t:t.charAt(0)+t.slice(1).toLocaleLowerCase("lt")).join(" ").trim();
  return out||String(n).trim();
}
/* "Paberžė, Vilniaus r." -> "Vilnius", "Klaipėdos r." -> "Klaipėda" */
function spokenCity(c){
  c=String(c||"").trim();if(!c)return"";
  const parts=c.split(",").map(x=>x.trim());let t=parts[parts.length-1];
  if(!/\sr\.?$/.test(t))return parts[0];
  t=t.replace(/\s*r\.?$/,"");
  return t.replace(/io$/,"is").replace(/aus$/,"us").replace(/os$/,"a").replace(/ės$/,"ė").replace(/o$/,"as");
}

/* ===== queue ===== */
function place(l,now=Date.now()){
  const T=v=>ms(v);
  if(l.status==="interested")return{l,tab:"won",rank:0,key:-T(l.updatedAt),label:"Nori",tone:"var(--s-interested)"};
  if(l.status==="declined")return null;
  if(l.status==="thinking"){const due=T(l.callbackAt);
    if(!due||due<=now)return{l,tab:"queue",rank:0,key:due,label:"Perskambinti dabar",tone:"var(--s-thinking)"};
    return{l,tab:"waiting",rank:0,key:due,label:"Perskambinti "+when(due),tone:"var(--s-thinking)"};}
  if(l.status==="no_answer"){const last=T(l.lastCalledAt),label=`Neatsiliepė ×${l.attempts||1}`;
    if(now-last>=RETRY_MS)return{l,tab:"queue",rank:2,key:last,label,tone:"var(--s-no_answer)"};
    return{l,tab:"waiting",rank:1,key:last+RETRY_MS,label:"Bandyti vėl "+when(last+RETRY_MS),tone:"var(--s-no_answer)"};}
  return{l,tab:"queue",rank:1,key:-T(l.createdAt),label:"Naujas",tone:"var(--accent)"};
}
const mine=l=>!l.assignee||l.assignee===meId;
function queues(){
  const q={queue:[],waiting:[],won:[]},now=Date.now();
  for(const l of leads){if(S.scope==="mine"&&!mine(l))continue;const p=place(l,now);if(p)q[p.tab].push(p)}
  for(const k in q)q[k].sort((a,b)=>a.rank-b.rank||a.key-b.key);
  return q;
}
function current(q){
  if(S.sel){const l=leads.find(x=>x.id===S.sel);if(l)return place(l)||{l,tab:"waiting",label:"Nenori",tone:"var(--muted)"};}
  return q.queue.find(p=>!S.skipped.has(p.l.id))||null;
}

async function saveDeal(d,prevStage){
  d={...d,updatedAt:Date.now()};
  if(d.stage==="won"&&!d.closedAt)d.closedAt=Date.now();

async function distribute(){
  const callers=people().filter(id=>member(id).role!=="manager");
  const pool=callers.length?callers:people();
  const todo=leads.filter(l=>!l.assignee&&l.status==="new");
  if(!pool.length||!todo.length){toast(todo.length?"Nėra kam paskirstyti.":"Nėra nepriskirtų naujų kontaktų.");return}
  toast(`Skirstoma ${todo.length} kontaktų tarp ${pool.length} žmonių…`);
  let i=0;
  for(const l of todo){const to=pool[i++%pool.length];const next={...l,assignee:to,updatedAt:Date.now()};leads=leads.map(x=>x.id===l.id?next:x);await saveLead(next)}
  render();toast(`Paskirstyta: ${pl(todo.length,"kontaktas","kontaktai","kontaktų")}.`);
}

/* Owner-only: remove every call, note, deal and status, keep the contacts themselves. */
async function wipe(silent){
  if(!db||S.wiping)return;
  if(!silent&&!confirm("Ištrinti VISUS skambučius, pastabas, sandorius ir pelną?\n\nKontaktai (pavadinimai, telefonai, el. paštai, pajamos) liks. Statusai grįš į „Neskambinta“. Atšaukti nebus galima."))return;
  S.wiping=true;render();let n=0,fail=0;
  const del=async col=>{let docs=[];try{docs=(await db.collection(col).get()).docs}catch{docs=(col==="deals"?deals:acts).map(x=>({id:x.id}))}
    for(const d of docs){try{await db.collection(col).doc(d.id).delete();n++}catch{fail++}}};
  try{
    await del("deals");await del("activities");
    for(const l of leads){
      if(l.status==="new"&&!l.attempts&&!l.lastCalledAt&&!l.callbackAt&&!l.note)continue;
      const patch={status:"new",attempts:0,lastCalledAt:null,lastCalledBy:"",callbackAt:null,note:"",updatedAt:Date.now()};
      const ref=db.collection("leads").doc(l.id);
      try{if(typeof ref.update==="function")await ref.update(patch);else await ref.set({...l,...patch});n++}catch{fail++}
    }
  }finally{S.wiping=false;S.sel=null;S.cv=null;S.note="";render()}
  toast(fail?`Išvalyta, bet ${fail} įrašų nepavyko. Komandoje spausk „Išvalyti“ dar kartą.`:"Skambučiai ir pardavimai išvalyti. Kontaktai liko, visi vėl „Neskambinta“.");
}

async function backfill(){
  if(seeded||!db)return;seeded=true;
  for(const l of leads){
    const s=SEED[l.id];if(!s)continue;
    const [rev,val,emp]=s,patch={};
    if(val&&typeof l.revenueValue!=="number"){patch.revenue=rev;patch.revenueValue=val}
    if(emp&&!l.employees)patch.employees=emp;
    if(!Object.keys(patch).length)continue;
    try{await db.collection("leads").doc(l.id).set({...l,...patch})}catch{}
  }

async function connect(){
  const c=window.claude&&typeof window.claude.use==="function"?window.claude:null;
  if(!c){S.conn="none";render();return}
  let smp;[db,user,downloads,ai,smp]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads"),c.use("ai"),c.use("sample")].map(p=>p.catch(()=>null)));
  aiApi=ai&&window.COLDLINE_WEB?webAi():typeof smp==="function"?sampleAi(smp):null;
  if(aiApi&&!NAV.some(n=>n[0]==="claude"))NAV.splice(1,0,["claude",aiApi.web?"AI":"Claude","spark"]);
  if(user){try{meId=await user.id();isOwner=await user.isOwner()}catch{}}
  if(!db){S.conn="none";render();return}
  let got=false;const timer=setTimeout(()=>{if(!got){S.conn="slow";render()}},10000);
  const fail=e=>{clearTimeout(timer);S.conn=e?.code==="revoked"?"revoked":"error";S.loaded=true;render()};
  db.collection("leads").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){got=true;clearTimeout(timer);S.conn="ok"}
    leads=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded=true;render(true);resolveNames();
    if(!snap.metadata.fromCache){backfill();fresh0.leads=true;maybeReset()}
  },fail);
  db.collection("activities").orderBy("createdAt","desc").limit(1000).onSnapshot(snap=>{acts=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames();if(!snap.metadata?.fromCache){fresh0.acts=true;maybeReset()}},()=>{});
  db.collection("deals").onSnapshot(snap=>{deals=snap.docs.map(d=>({...d.data(),id:d.id}));render(true);resolveNames();if(!snap.metadata?.fromCache){fresh0.deals=true;maybeReset()}},()=>{});
  db.collection("meta").onSnapshot(snap=>{if(snap.metadata?.fromCache)return;metaIds=new Set(snap.docs.map(d=>d.id));fresh0.meta=true;maybeReset()},()=>{});
  let joined=false;
  db.collection("team").onSnapshot(snap=>{
    team=Object.fromEntries(snap.docs.map(d=>[d.id,{...d.data(),id:d.id}]));
    if(!joined&&meId&&!snap.metadata.fromCache){joined=true;if(!team[meId])saveMember(meId,{role:isOwner?"manager":"caller",commission:DEF_COMMISSION,goal:DEF_GOAL,joinedAt:Date.now()})}
    render(true);resolveNames();
  },()=>{});
}

    ${cur&&wide?threadHtml(cur.l,"side"):""}
  </div>`;
}

function dealDrawer(){
  const d=deals.find(x=>x.id===S.dealOpen);if(!d)return"";
  const comm=commissionOf(d),prof=profitOf(d);
  return`<div class="drawer" data-act="drawer-bg"><div class="pane thin" data-stop-bg>
    <div class="phd"><b style="font-weight:600" class="trunc">${esc(d.leadName||"—")}</b><button class="iconbtn" data-act="drawer-close" aria-label="Uždaryti">${icon("x")}</button></div>
    <form id="de-${esc(d.id)}" data-act="deal-edit" style="padding:18px;display:grid;gap:14px">
      <label class="field">Etapas<select class="inp" name="stage">${STAGES.map(s=>`<option value="${s.id}" ${s.id===d.stage?"selected":""}>${s.label}</option>`).join("")}</select></label>

      <label class="field">Kas parduodama<select class="inp" name="title">${NEEDS.map(n=>`<option ${n===d.title?"selected":""}>${n}</option>`).join("")}</select></label>
      <label class="field">Atsakingas<select class="inp" name="owner">${memberOptions(d.owner,false)}</select></label>

        <div><span>Suma</span><span>${eur(d.value)}</span></div>
        <div><span>Savikaina</span><span>−${eur(d.cost)}</span></div>
        <div><span>Komisiniai, ${num(member(d.owner).commission)} %</span><span>−${eur(comm)}</span></div>
        <div class="tot"><span>Pelnas</span><span style="color:${prof>=0?"var(--d-won)":"var(--danger)"}">${eur(prof)}</span></div></div>
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button type="button" class="btn" data-act="deal-open-lead" data-id="${esc(d.leadId)}">Atidaryti kontaktą</button><button class="btn ink">Išsaugoti</button></div>
      <p class="muted" style="font-size:12px">Sukurta ${when(d.createdAt)}${d.closedAt?` · uždaryta ${when(d.closedAt)}`:""}</p>
    </form></div></div>`;

function viewDeals(){
  const scoped=deals.filter(d=>S.who==="all"||d.owner===S.who);
  const open=scoped.filter(d=>d.stage==="meeting"||d.stage==="proposal");
  const wonP=scoped.filter(d=>d.stage==="won"&&inPeriod(d.closedAt));
  const rev=wonP.reduce((a,d)=>a+num(d.value),0),prof=wonP.reduce((a,d)=>a+profitOf(d),0),pipe=open.reduce((a,d)=>a+num(d.value),0);
  const closed=scoped.filter(d=>d.stage==="won"||d.stage==="lost"),winRate=closed.length?Math.round(closed.filter(d=>d.stage==="won").length/closed.length*100):null;
  const shown=s=>scoped.filter(d=>d.stage===s&&(s==="meeting"||s==="proposal"||inPeriod(d.closedAt))).sort((a,b)=>ms(b.updatedAt)-ms(a.updatedAt));
  const right=`<select class="sel" data-key="who"><option value="all">Visa komanda</option>${people().map(id=>`<option value="${esc(id)}" ${S.who===id?"selected":""}>${esc(who(id))}</option>`).join("")}</select>
    <div class="seg">${[["month","Šis mėn."],["prev","Praėjęs"],["year","Metai"],["all","Visi"]].map(([v,t])=>`<button data-act="period" data-v="${v}" aria-pressed="${S.period===v}">${t}</button>`).join("")}</div>`;
  return`<div class="scroll thin"><div class="page">${head("Pardavimai","",right)}
    <div class="kpis">
      <div class="kpi"><span class="lbl">Pajamos</span><span class="v">${eur(rev)}</span><small>${pl(wonP.length,"laimėtas sandoris","laimėti sandoriai","laimėtų sandorių")}</small></div>
      <div class="kpi"><span class="lbl">Pelnas</span><span class="v" style="color:${prof<0?"var(--danger)":"inherit"}">${eur(prof)}</span><small>po savikainos ir komisinių</small></div>
      <div class="kpi"><span class="lbl">Derinama</span><span class="v">${eur(pipe)}</span><small>${pl(open.length,"sandoris","sandoriai","sandorių")}</small></div>
      <div class="kpi"><span class="lbl">Laimima</span><span class="v">${winRate===null?"—":winRate+" %"}</span><small>iš ${pl(closed.length,"uždaryto","uždarytų","uždarytų")}</small></div></div>
    <div class="board">${STAGES.map(s=>{const items=shown(s.id);return`<section class="col">
      <h3><span style="display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13px;color:var(--text);font-weight:600">${ddot(s.id)}${s.label}</span><span>${items.length} · ${eur(items.reduce((a,d)=>a+num(d.value),0))}</span></h3>
      ${items.length?items.map(d=>`<button id="dc-${esc(d.id)}" class="dcard" data-act="deal-open" data-id="${esc(d.id)}">
        <div class="top"><b class="trunc">${esc(d.leadName?spokenName(d.leadName):"—")}</b><span class="mono">${eur(d.value)}</span></div>
        <div class="bot"><span class="trunc">${esc(d.title||"")}</span><span style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0">${avatar(d.owner,16)}${when(d.updatedAt)}</span></div>
      </button>`).join(""):`<div class="none">—</div>`}
    </section>`}).join("")}</div>
    ${!deals.length?`<p class="muted" style="margin-top:20px;font-size:13px">Sandoris sukuriamas, kai skambučio rezultatas yra „Nori“ ir įrašai sumą.</p>`:""}
  </div>${dealDrawer()}</div>`;
}

    <div style="margin-top:12px"><span class="lbl" style="margin-bottom:6px">Ko trūksta</span><div class="chips">${NEEDS.map(v=>chip("needs",v)).join("")}</div></div>

    ${S.aiLog&&S.aiLog.length?`<ul class="ailog">${S.aiLog.map((t,i)=>`<li class="${i===S.aiLog.length-1&&S.aiBusy?"now":""}">${esc(t)}</li>`).join("")}</ul>`:""}
    ${S.reqText?`<textarea class="req in" readonly id="reqbox" style="margin-top:12px">${esc(S.reqText)}</textarea>`:""}
  </section>`;
}

  return`<div class="scroll thin"><div class="page">${head("Kontaktai",`${leads.length} · ${leads.filter(l=>!l.assignee).length} nepriskirta`,right)}
    ${S.finding?findPanel():""}

/* ===== team view ===== */
function memberStats(id){
  const c=callsBy(id),today=dayKey(Date.now());
  const cT=c.filter(a=>dayKey(ms(a.createdAt))===today),cM=c.filter(a=>inPeriod(a.createdAt,"month"));
  const won=deals.filter(d=>d.owner===id&&d.stage==="won"&&inPeriod(d.closedAt,"month"));
  const rev=won.reduce((a,d)=>a+num(d.value),0);
  return{today:cT.length,month:cM.length,reached:cM.filter(a=>a.status!=="no_answer").length,interested:cM.filter(a=>a.status==="interested").length,won:won.length,rev,comm:won.reduce((a,d)=>a+commissionOf(d),0),leads:leads.filter(l=>l.assignee===id&&l.status!=="declined").length};
}

/* ===== AI backends =====
   Web version: the server (Vercel AI Gateway / API key, can search the web).
   Claude artifact: the viewer's own Claude account through `sample` (no key, no card; cannot browse). */
let aiApi=null;
const TIER={haiku:"quick",sonnet:"default",opus:"complex"};
const AI_RULES=`Tu esi Claude, įmontuotas į „Coldai“: Lietuvos komandos, kuri šaltais skambučiais parduoda svetaines, el. parduotuves, rezervacijų ir vidines sistemas mažoms įmonėms, darbo vietą.
Rašyk lietuviškai, paprastai ir žmogiškai, kaip kolega. Trumpai: dažniausiai 2–6 sakiniai arba trumpas sąrašas. Jei prašo frazės skambučiui, duok tikslų tekstą, kurį galima pasakyti balsu.
Būk tiesus: jei idėja silpna, taip ir pasakyk. Neišgalvok faktų apie įmones (telefonų, pajamų, el. paštų, klientų): naudok tik žemiau pateiktus duomenis, o jei ko nežinai, pasakyk. Nesiūlyk meluoti klientams ir nekurk netikrų atsiliepimų.`;
const BRIEF_RULES=`Tu padedi lietuviui, kuris šaltu skambučiu parduoda svetaines ir paprastas sistemas mažoms įmonėms. Iš įmonės duomenų parašyk trumpą skambučio planą lietuviškai, paprasta šnekamąja kalba, be išgalvotų faktų. Formatas tiksliai toks (be įžangos):
**Pradžia:** 1–2 sakiniai, ką pasakyti po pasisveikinimo, pritaikyti šiai įmonei.
**Kabliukas:** vienas konkretus dalykas, kurį jie greičiausiai praranda dabar.
**Jei sako…**
- „<tikėtinas prieštaravimas>“ – <ką atsakyti, 1 sakinys>
- „<tikėtinas prieštaravimas>“ – <ką atsakyti, 1 sakinys>
- „<tikėtinas prieštaravimas>“ – <ką atsakyti, 1 sakinys>
**Siūlyk:** ką konkrečiai siūlyti ir kokio susitikimo prašyti.
Iš viso iki 110 žodžių.`;
const leadFacts=l=>[`Įmonė: ${l.name||""}`,`Sritis: ${l.category||""}`,`Miestas: ${l.city||""}`,`Apyvarta: ${l.revenue||"nežinoma"}`,`Darbuotojai: ${l.employees||"nežinoma"}`,`Svetainė: ${l.website||"nėra"}`,`Ką siūlyti: ${l.need||"Svetainė"}`,`Kodėl skambinti: ${String(l.reason||"").slice(0,900)}`].join("\n");
function aiContext(leadId){
  const by={};for(const l of leads)by[l.status||"new"]=(by[l.status||"new"]||0)+1;
  const top=leads.filter(l=>(l.status||"new")==="new").sort((a,b)=>revVal(b)-revVal(a)).slice(0,15);
  const l=leadId&&leads.find(x=>x.id===leadId);
  return [`Šiandien ${new Date().toLocaleDateString("lt-LT")}. Klausia: ${who(meId)}.`,
    `Sąraše ${leads.length} įmonių. Pagal statusą: ${Object.entries(by).map(([k,v])=>`${stat(k).short} ${v}`).join(", ")||"nėra"}.`,
    top.length?`Neskambintos su didžiausia apyvarta:\n${top.map(x=>`- ${[x.name,x.city,x.category,x.revenue,x.need].filter(Boolean).join(" · ")}`).join("\n")}`:"",
    l?`Šiuo metu atidaryta įmonė:\n${leadFacts(l)}\nTelefonas: ${l.phone||""}\nEl. paštas: ${l.email||""}\nStatusas: ${stat(l.status).short}`:""].filter(Boolean).join("\n\n");
}
function aiErr(e){const c=e&&e.code;
  return c==="not_granted"?"Claude nenaudojamas: puslapiui neleista. Leisk, kai paklaus (perkrauk puslapį).":c==="rate_limited"?"Pasiektas tavo Claude limitas. Pabandyk vėliau.":c==="sampling_disabled"?"Claude šioje paskyroje neprieinamas.":c==="session_expired"?"Prisijunk prie Claude iš naujo.":c==="refused"?"Claude į tai neatsakys. Paklausk kitaip.":c==="cancelled"?"Sustabdyta.":"Claude neatsakė. Bandyk dar kartą."}
function sampleAi(smp){return{web:false,
  async chat(msgs,leadId,model,onEvent){
    try{await smp([{role:"user",content:AI_RULES+"\n\n"+aiContext(leadId)},...msgs],{cache:false,modelTier:TIER[model]||"quick",onText:({delta})=>onEvent({type:"text",text:delta})})}
    catch(e){onEvent({type:"error",message:aiErr(e)})}
  },
  async brief(leadId,model,force){
    const l=leads.find(x=>x.id===leadId);if(!l)return{error:"Nerasta įmonė."};if(l.aiBrief&&!force)return{brief:l.aiBrief};
    try{const {text}=await smp(BRIEF_RULES+"\n\n"+leadFacts(l),{modelTier:TIER[model]||"quick",cache:force?false:{gcTime:86400000}});
      const cur=leads.find(x=>x.id===leadId)||l;await put("leads",leadId,{...cur,aiBrief:text.slice(0,3000),aiBriefAt:Date.now()});return{brief:text}}
    catch(e){return{error:aiErr(e)}}
  }}}
function webAi(){return{web:true,
  chat:(msgs,leadId,model,onEvent)=>window.COLDLINE_WEB.chat(msgs,leadId,model,onEvent),
  brief:(leadId,model,force)=>window.COLDLINE_WEB.brief(leadId,model,force)}}

/* ===== AI model choice ===== */
const AIMODELS=[["haiku","Haiku","greitas, pigus"],["sonnet","Sonnet","geresnis"],["opus","Opus","protingiausias"]];
function aiModel(){try{const m=localStorage.getItem("coldai-model");return AIMODELS.some(x=>x[0]===m)?m:"haiku"}catch{return"haiku"}}
const modelPick=()=>`<div class="seg mpick" title="AI modelis">${AIMODELS.map(([k,t,n])=>`<button data-act="model" data-v="${k}" aria-pressed="${aiModel()===k}" title="${n}">${t}</button>`).join("")}</div>`;

/* ===== AI call plan per company ===== */
const briefSt={};let briefTimer=0;
function queueBrief(id){
  if(!aiApi||briefSt[id])return;
  clearTimeout(briefTimer);briefTimer=setTimeout(()=>{const c=current(queues());if(c&&c.l.id===id&&!c.l.aiBrief)makeBrief(id,false)},900);
}
async function makeBrief(id,force){
  const st=briefSt[id]=briefSt[id]||{};if(st.busy)return;st.busy=true;st.err="";render(true);
  try{const r=await aiApi.brief(id,aiModel(),force);
    if(r.brief){leads=leads.map(x=>x.id===id?{...x,aiBrief:r.brief,aiBriefAt:Date.now()}:x)}else st.err=r.error||"Nepavyko."}
  catch(e){st.err=e&&e.message||"Nepavyko."}
  st.busy=false;render(true);
}
function briefHtml(l){
  if(!aiApi)return"";
  const st=briefSt[l.id]||{},b=l.aiBrief;
  return`<section class="aibrief" id="ab-${esc(l.id)}"><header><span class="cav">${icon("spark",13)}</span><b>AI planas šiam skambučiui</b>
    <button class="mini-btn" data-act="brief-redo" data-id="${esc(l.id)}" ${st.busy?"disabled":""}>${st.busy?"Rašoma…":b?"Perrašyti":"Sugeneruoti"}</button></header>
    ${b?`<div class="aib">${md(b)}</div>`:st.err?`<p class="aierr">${esc(st.err)}</p>`:`<div class="shim"><i></i><i></i><i></i></div>`}</section>`;
}

/* ===== Claude chat (web version) ===== */
const CHATKEY=()=>"coldline-chat-"+(meId||"x");
function chatState(){
  const key=CHATKEY();
  if(!S.chat||(S.chat.key!==key&&!S.chat.busy)){let msgs=[];try{msgs=JSON.parse(localStorage.getItem(key)||"[]")}catch{}S.chat={key,msgs:Array.isArray(msgs)?msgs.slice(-40):[],busy:false,err:"",leadId:S.chat?S.chat.leadId:null}}
  return S.chat;
}
function saveChat(){try{localStorage.setItem(CHATKEY(),JSON.stringify(S.chat.msgs.slice(-40)))}catch{}}
function md(t){
  const lines=esc(t).split("\n"),out=[];let list=null;
  const inline=x=>x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>").replace(/(https:\/\/[^\s<)]+)/g,'<a href="$1" target="_blank" rel="noreferrer" class="u">$1</a>');
  for(const raw of lines){const ln=raw.trim();const m=ln.match(/^(?:[-•*]|\d+[.)])\s+(.*)$/);
    if(m){if(!list){list=[];out.push(list)}list.push(inline(m[1]));continue}

/* Rendering: the page is rebuilt as HTML but patched into the live DOM (morphdom), so the
   element under a finger is never replaced. Live-data renders wait while a finger is down. */
let pointerDown=false,pending=false,frame=0;
function render(bg){
  if(bg){pending=true;if(!pointerDown&&!frame)frame=requestAnimationFrame(()=>{frame=0;if(pending&&!pointerDown)paint()});return}
  paint();
}
const KEEP=new Set(["INPUT","TEXTAREA","SELECT"]);
function morphOpts(){return{
  onBeforeElUpdated(from,to){
    if(from.isEqualNode(to))return false;
    if(KEEP.has(from.tagName)){
      if(from===document.activeElement)return false;          // keep what is being typed, and the caret
      if(from.form&&!from.dataset.key)return false;           // uncontrolled form fields keep their value
    }
    if(from.tagName==="DETAILS"&&from.dataset.keepOpen!==undefined){to.open=from.open}
    return true;
  }}}
function patch(el,html){
  if(window.morphdom){const tmp=el.cloneNode(false);tmp.innerHTML=html;morphdom(el,tmp,{...morphOpts(),childrenOnly:true})}
  else el.innerHTML=html;
}

async function importLeads(text){
  let arr;try{arr=JSON.parse(text);if(!Array.isArray(arr))arr=arr.leads}catch{}
  if(!Array.isArray(arr)){toast("Tai ne Coldline kopija (reikia JSON sąrašo).");return}
  const key=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\b(uab|mb|ii|ab|vsi|pi)\b/g,"").replace(/[^a-z0-9]/g,"");
  const ph=s=>String(s||"").replace(/\D/g,"").slice(-8);
  const seen=leads.map(l=>({id:l.id,c:l.companyCode,p:ph(l.phone),n:key(l.name)}));
  let added=0,dup=0;const now=Date.now();
  for(const [i,r] of arr.entries()){
    if(!r||typeof r!=="object"||!String(r.name||"").trim()){continue}
    const c=String(r.companyCode||""),p=ph(r.phone),n=key(r.name),rid=/^[\w.-]{1,100}$/.test(String(r.id||""))?String(r.id):"";
    if(seen.some(x=>(rid&&x.id===rid)||(c&&x.c===c)||(p.length===8&&x.p===p)||(n.length>2&&x.n===n))){dup++;continue}
    const l={id:rid||uid(),status:"new",attempts:0,assignee:"",fresh:true,createdBy:meId||"",createdAt:now-i,updatedAt:now};
    for(const k of LEAD_FIELDS)if(r[k]!==undefined)l[k]=typeof r[k]==="number"?r[k]:String(r[k]).slice(0,2000);
    if(!l.need)l.need="Svetainė";
    if(await put("leads",l.id,l)){added++;seen.push({id:l.id,c,p,n})}
  }
  toast(`Importuota ${pl(added,"kontaktas","kontaktai","kontaktų")}${dup?`, praleista ${dup} jau esamų`:""}.`);
}
async function exportCsv(){
  const cell=v=>/[",\n;]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;
  const head=["Pavadinimas","Statusas","Atsakingas","Telefonas","El. paštas","Sritis","Miestas","Pajamos","Reikia","Svetainė","Įmonės kodas","Bandymų","Paskutinis skambutis","Sandorio suma","Sandorio etapas","Šaltinis"];
  const rows=leads.map(l=>{const d=deals.find(x=>x.leadId===l.id);return[l.name,stat(l.status).label,l.assignee?who(l.assignee):"",l.phone,l.email,l.category,l.city,l.revenue,l.need,l.website,l.companyCode,String(l.attempts||0),l.lastCalledAt?new Date(ms(l.lastCalledAt)).toISOString():"",d?String(num(d.value)):"",d?stage(d.stage).label:"",l.source].map(v=>cell(String(v||"")))});
  const csv="﻿"+[head,...rows].map(r=>r.join(";")).join("\n");
  if(downloads){try{await downloads.save({filename:`rysys-${dayKey(Date.now())}.csv`,data:csv});return}catch(e){if(e?.code==="declined")return}}
  try{await navigator.clipboard.writeText(csv);toast("CSV nukopijuotas. Įklijuok į Excel ar Google Sheets.")}catch{toast("Nepavyko eksportuoti.")}
}

render();
