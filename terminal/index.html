<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>claude@terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* macOS Terminal + Claude Code (dark) spalvos; tik ne-Apple įrenginiuose krenta į JetBrains Mono */
  :root {
    --bg: #1e1e1e; --fg: #f2f2f2; --dim: #999999; --inactive: #666666;
    --claude: #d77757; --claude-hi: #f0a585; --sugg: #b1b9f9; --ok: #4eba65; --err: #ff6b80; --warn: #ffc107;
    --bash: #fd5db1; --plan: #48968c; --pborder: #888888; --userbg: #373737; --sel: rgba(177,185,249,.28);
    --hl-kw: #c678dd; --hl-str: #98c379; --hl-num: #d19a66; --hl-com: #7f848e; --hl-tag: #e06c75; --hl-fn: #61afef;
    --tbar: #323232; --tbar-edge: #161616; --ttitle: rgba(255,255,255,.55); --winedge: rgba(255,255,255,.16); --tl-off: #4c4c4c;
    --wall: radial-gradient(120% 90% at 20% 10%, #2a3346 0%, #151a24 55%, #0b0d12 100%);
    --font: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, "JetBrains Mono", Consolas, monospace;
    --fs: 13px; --lh: 1.3;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1d1d1f; --dim: #666666; --inactive: #999999;
    --claude: #d77757; --claude-hi: #b5512f; --sugg: #5769f7; --ok: #2c7a39; --err: #ab2b3f; --warn: #966c1e;
    --bash: #ff0087; --plan: #006666; --pborder: #999999; --userbg: #f0f0f0; --sel: rgba(87,105,247,.18);
    --hl-kw: #a626a4; --hl-str: #50a14f; --hl-num: #986801; --hl-com: #a0a1a7; --hl-tag: #e45649; --hl-fn: #4078f2;
    --tbar: #e8e8e8; --tbar-edge: #c9c9c9; --ttitle: rgba(0,0,0,.55); --winedge: rgba(0,0,0,.18); --tl-off: #cfcfcf;
    --wall: radial-gradient(120% 90% at 20% 10%, #dfe7f5 0%, #b9c6dd 60%, #95a3bd 100%);
    color-scheme: light;
  }
  :root[data-theme="pro"] {
    --bg: #0c0c0c; --fg: #f2f2f2; --dim: #8e8e8e; --inactive: #5e5e5e; --userbg: #262626; --pborder: #7a7a7a;
    --tbar: #2a2a2a; --tbar-edge: #000; --wall: radial-gradient(120% 90% at 20% 10%, #2b2b2b 0%, #121212 60%, #050505 100%);
  }
  :root[data-theme="homebrew"] {
    --bg: #000000; --fg: #28fe14; --dim: #1f9e12; --inactive: #136b0b; --claude: #5dff4d; --claude-hi: #c6ffbf; --sugg: #9dff92;
    --ok: #28fe14; --err: #ff5f5f; --warn: #e6ff4d; --bash: #7dffb8; --plan: #3ee6c1; --pborder: #1f9e12; --userbg: #0a2607; --sel: rgba(40,254,20,.25);
    --hl-kw: #9dff92; --hl-str: #d7ff9a; --hl-num: #e6ff4d; --hl-com: #1f9e12; --hl-tag: #5dff4d; --hl-fn: #b8ffd0;
    --tbar: #1c1c1c; --tbar-edge: #000; --wall: radial-gradient(120% 90% at 20% 10%, #12301a 0%, #07130a 60%, #020502 100%);
  }
  :root[data-theme="ocean"] {
    --bg: #224fbc; --fg: #ffffff; --dim: #bccbf0; --inactive: #8aa2dc; --claude: #ffbf9a; --claude-hi: #ffe2d1; --sugg: #dfe4ff;
    --ok: #8ff0a4; --err: #ffb0bb; --warn: #ffe082; --bash: #ffb3dc; --plan: #a7f3e6; --pborder: #a9bbea; --userbg: #2e5fd4; --sel: rgba(255,255,255,.28);
    --hl-kw: #ffd0f7; --hl-str: #c6ffcf; --hl-num: #ffe082; --hl-com: #a9bbea; --hl-tag: #ffc2c2; --hl-fn: #d6f1ff;
    --tbar: #1c43a3; --tbar-edge: #14327c; --ttitle: rgba(255,255,255,.72); --wall: radial-gradient(120% 90% at 20% 10%, #3e6fe0 0%, #17368a 60%, #0b1c4d 100%);
  }
  :root[data-theme="solarized"] {
    --bg: #002b36; --fg: #93a1a1; --dim: #657b83; --inactive: #4b5f66; --claude: #cb4b16; --claude-hi: #f08a5d; --sugg: #268bd2;
    --ok: #859900; --err: #dc322f; --warn: #b58900; --bash: #d33682; --plan: #2aa198; --pborder: #586e75; --userbg: #073642; --sel: rgba(38,139,210,.3);
    --hl-kw: #859900; --hl-str: #2aa198; --hl-num: #d33682; --hl-com: #586e75; --hl-tag: #268bd2; --hl-fn: #b58900;
    --tbar: #073642; --tbar-edge: #001e26; --wall: radial-gradient(120% 90% at 20% 10%, #0b4a5a 0%, #002b36 60%, #00161c 100%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { overflow: hidden; color: var(--fg); font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
    -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  ::selection { background: var(--sel); }
  :focus-visible { outline: 1px solid var(--sugg); outline-offset: 1px; }
  #in:focus-visible { outline: 0; }

  /* ================= darbalaukis ir langas ================= */
  #desk { position: fixed; inset: 0; display: flex; background: var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #win { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; position: relative; }
  @media (min-width: 1000px) and (min-height: 620px) and (hover: hover) {
    #desk { background: var(--wall); padding: 34px max(34px, calc((100vw - 1240px) / 2)); }
    #win { border-radius: 10px; box-shadow: 0 0 0 .5px rgba(0,0,0,.85), inset 0 0 0 .5px var(--winedge), 0 22px 70px rgba(0,0,0,.55); }
  }
  #tbar { position: relative; flex: 0 0 auto; height: 28px; display: flex; align-items: center; justify-content: center;
    background: var(--tbar); border-bottom: 1px solid var(--tbar-edge); user-select: none; -webkit-user-select: none; }
  #wtitle { font: 500 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: var(--ttitle);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 150px); }
  .lights { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
  .tl.r { background: #ff5f57; box-shadow: inset 0 0 0 .5px #e2463f; }
  .tl.y { background: #febc2e; box-shadow: inset 0 0 0 .5px #e1a116; }
  .tl.g { background: #28c840; box-shadow: inset 0 0 0 .5px #14ae2a; }
  .tl svg { width: 8px; height: 8px; opacity: 0; transition: opacity .1s; }
  .lights:hover .tl svg, .lights:focus-within .tl svg { opacity: .62; }
  .tl.idle { cursor: default; }

  /* ================= terminalas ================= */
  #term { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 8px 10px 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #term::-webkit-scrollbar { width: 8px; } #term::-webkit-scrollbar-thumb { background: rgba(128,128,128,.35); border-radius: 4px; }
  #out { white-space: pre-wrap; word-break: break-word; }
  .row { min-height: calc(var(--lh) * 1em); }
  .blk { margin-top: calc(var(--lh) * 1em); }
  .blk.tight { margin-top: 0; }
  .turn > .blk:first-child { margin-top: 0; }
  .b { font-weight: 700; } .i { font-style: italic; } .u { text-decoration: underline; }
  .dim { color: var(--dim); } .acc { color: var(--claude); } .ok { color: var(--ok); } .err { color: var(--err); } .warn { color: var(--warn); }
  .sug { color: var(--sugg); } .pink { color: var(--bash); } .teal { color: var(--plan); }

  /* zsh eilutės prieš paleidimą */
  .shell .pr { color: var(--fg); }
  .tcur { display: inline-block; width: 1ch; height: calc(var(--lh) * 1em); vertical-align: top; background: var(--fg); }
  @keyframes drawBox { from { clip-path: inset(-1em 100% 0 0); } to { clip-path: inset(-1em 0 0 0); } }
  .wbox.draw { animation: drawBox .55s cubic-bezier(.65,0,.35,1) both; }
  .wbox.draw .clawd { animation: clawdIn .55s .38s cubic-bezier(.3,1.55,.5,1) both; }
  .wbox.draw .wr > *, .wbox.draw .wl > div { animation: fadeUp .3s ease-out both; }
  .wbox.draw .wr > :nth-child(2), .wbox.draw .wl > div:last-child { animation-delay: .32s; }
  .wbox.draw .wr > :nth-child(3) { animation-delay: .38s; } .wbox.draw .wr > :nth-child(4) { animation-delay: .44s; }
  .wbox.draw .wr > :nth-child(n+5) { animation-delay: .5s; }
  @keyframes clawdIn { from { transform: translateY(45%) scale(.55); opacity: 0; } to { transform: none; opacity: 1; } }
  #pa { transition: opacity .35s ease-out; }
  body.booting #pa { opacity: 0; }

  /* pasisveikinimo dėžutė */
  .wbox { position: relative; border: 1px solid var(--claude); border-radius: 7px; margin-top: calc(var(--lh) * .9em); padding: calc(var(--lh) * .55em) 1ch calc(var(--lh) * .45em); max-width: 100%; white-space: normal; }
  .wt { position: absolute; top: calc(var(--lh) * -.5em); left: 3ch; background: var(--bg); padding: 0 1ch; color: var(--claude); white-space: nowrap; }
  .wcols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  .wl { text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 1ch; min-width: 0; }
  .wl > div { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wr { border-left: 1px solid var(--claude); padding: 0 1ch 0 2ch; min-width: 0; }
  .wh { color: var(--claude); font-weight: 700; }
  .wsep { border-top: 1px solid var(--claude); margin: calc(var(--lh) * .5em) 0; }
  .clawd { display: block; width: 9ch; height: calc(var(--lh) * 3em); margin: calc(var(--lh) * 1em) 0; }
  .clawd rect { fill: var(--claude); }
  .wbox.narrow .wcols { grid-template-columns: 1fr; }
  .wbox.narrow .wr { border-left: 0; border-top: 1px solid var(--claude); margin-top: calc(var(--lh) * .5em); padding: calc(var(--lh) * .5em) 1ch 0; }
  .wbox.narrow .clawd { margin: calc(var(--lh) * .5em) 0; }

  /* žinutės: ⏺ / > / ⎿ */
  .user { background: var(--userbg); padding: 0 1ch 0 0; }
  .user .gt { color: var(--dim); display: inline-block; width: 2ch; padding-left: 0; }
  .user.bash .gt { color: var(--bash); } .user.mem .gt { color: var(--sugg); }
  .msg { display: grid; grid-template-columns: 2ch minmax(0, 1fr); }
  .dot { display: inline-block; width: .62em; height: .62em; border-radius: 50%; background: var(--fg); margin-top: calc((var(--lh) * 1em - .62em) / 2); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); } .dot.run { background: var(--dim); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .mc { min-width: 0; }
  .res { position: relative; padding-left: 5ch; }
  .res::before { content: ""; position: absolute; left: 2ch; top: .05em; width: .55em; height: calc(var(--lh) * .5em); border-left: 1px solid var(--dim); border-bottom: 1px solid var(--dim); }
  .res.noel::before { display: none; }
  .ind { padding-left: 5ch; }
  .tool .mc > .res { margin-left: -2ch; }
  .prev { color: var(--dim); padding-left: 3ch; white-space: pre; overflow-x: auto; }
  .more { color: var(--dim); padding-left: 3ch; cursor: pointer; }
  .acts { padding-left: 3ch; color: var(--dim); }
  .act, .acts a { color: var(--sugg); text-decoration: underline; text-underline-offset: 2px; }
  .full { display: none; padding-left: 3ch; white-space: pre; overflow-x: auto; }
  .tool.expanded .prev, .tool.expanded .more { display: none; }
  .tool.expanded .full { display: block; }

  /* markdown kaip Claude Code terminale */
  .md { white-space: normal; }
  .md > * + * { margin-top: calc(var(--lh) * 1em); }
  .md p { margin-block-end: 0; margin-inline: 0; white-space: pre-wrap; }
  .md > p:first-child { margin-top: 0; }
  .md .h { font-weight: 700; }
  .md strong { font-weight: 700; } .md em { font-style: italic; }
  .md code { color: var(--sugg); font: inherit; }
  .md a, .user a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  .md a:hover, .user a:hover { color: var(--sugg); }
  .md .list { display: flex; flex-direction: column; }
  .md .li { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 1ch; padding-left: calc(var(--i, 0) * 2ch); }
  .md .lc { white-space: pre-wrap; min-width: 0; }
  .md blockquote { margin: 0; padding-left: 2ch; border-left: 1px solid var(--dim); color: var(--dim); font-style: italic; }
  .md hr { border: 0; border-top: 1px solid var(--dim); margin-left: 0; margin-right: 0; }
  .md pre { margin-block-end: 0; margin-inline: 0; white-space: pre; overflow-x: auto; font: inherit; }
  .md > pre:first-child { margin-top: 0; }
  .md pre code { color: var(--fg); }
  .tbl { overflow-x: auto; }
  .tbl table { border-collapse: collapse; font: inherit; }
  .tbl th, .tbl td { border: 1px solid var(--dim); padding: 0 1ch; text-align: left; white-space: nowrap; }
  .tbl th { font-weight: 700; }
  .hk { color: var(--hl-kw); } .hs { color: var(--hl-str); } .hn { color: var(--hl-num); } .hc { color: var(--hl-com); font-style: italic; } .ht { color: var(--hl-tag); } .hf { color: var(--hl-fn); }

  /* lentelės ir sąrašai komandoms */
  .kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 2ch; }
  .kv > :nth-child(odd) { color: var(--dim); }
  .cmdlist { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 2ch; }
  .ctx { display: flex; gap: 3ch; flex-wrap: wrap; align-items: flex-start; }
  .grid { display: grid; grid-template-columns: repeat(10, 1.05em); gap: .3em; padding-top: .2em; }
  .grid i { width: 1.05em; height: 1.05em; border-radius: 2px; background: var(--c); }
  .grid i.free { background: none; box-shadow: inset 0 0 0 1px var(--inactive); }
  .sq { display: inline-block; width: .8em; height: .8em; border-radius: 2px; background: var(--c); vertical-align: -.05em; margin-right: 1ch; }
  .sq.free { background: none; box-shadow: inset 0 0 0 1px var(--inactive); }

  /* ================= įvestis ================= */
  #pa { margin-top: calc(var(--lh) * 1em); }
  .spin { margin-bottom: calc(var(--lh) * 1em); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spin .sg { color: var(--claude); display: inline-block; width: 2ch; }
  .spin .sv { background: linear-gradient(90deg, var(--claude) 0%, var(--claude) 42%, var(--claude-hi) 50%, var(--claude) 58%, var(--claude) 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2.2s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .spin .sd { color: var(--dim); }
  .queued { color: var(--dim); white-space: pre-wrap; margin-bottom: calc(var(--lh) * .5em); }
  #box { display: flex; align-items: flex-start; border-top: 1px solid var(--pborder); border-bottom: 1px solid var(--pborder); padding: calc(var(--lh) * .25em) 0; }
  #box.bash { border-color: var(--bash); } #box.mem { border-color: var(--sugg); }
  #ps { flex: 0 0 2ch; color: var(--fg); }
  #box.bash #ps { color: var(--bash); } #box.mem #ps { color: var(--sugg); }
  .inp { font: inherit; font-size: var(--ifs, var(--fs)); line-height: var(--lh); letter-spacing: 0; }
  #field { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  #in { display: block; width: 100%; background: transparent; border: 0; outline: 0; resize: none; padding: 0; margin: 0;
    color: var(--fg); caret-color: transparent; height: calc(var(--lh) * 1em); max-height: calc(var(--lh) * 10em); overflow-y: auto; }
  #in::placeholder { color: var(--dim); opacity: 1; }
  /* Terminal.app bloko kursorius: tekstas po juo invertuojamas */
  #mirror { position: absolute; left: 0; top: 0; visibility: hidden; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; pointer-events: none; }
  #cur { position: absolute; left: 0; top: 0; min-width: 1ch; height: calc(var(--lh) * 1em); background: var(--fg); color: var(--bg); white-space: pre;
    pointer-events: none; will-change: transform; animation: curblink 1.06s steps(1) infinite; }
  #cur.typing { animation: none; }
  #cur.off { background: none; color: transparent; box-shadow: inset 0 0 0 1px var(--dim); animation: none; }
  @keyframes curblink { 50% { opacity: 0; } }
  #foot { display: flex; justify-content: space-between; gap: 2ch; padding: 0 0 0 2ch; color: var(--dim); white-space: nowrap; min-height: calc(var(--lh) * 1em); }
  #fl { overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  #fr { overflow: hidden; text-overflow: ellipsis; text-align: right; }
  #fr button { color: var(--sugg); text-decoration: underline; }
  #fr .mb { color: var(--dim); text-decoration: none; border-radius: 4px; padding: 0 .5ch; margin-right: -.5ch; transition: background-color .15s, color .15s; display: inline-block; }
  #fr .mb:hover { color: var(--fg); background: rgba(128,128,128,.16); }
  #fr .mb.flip { animation: flipIn .45s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes flipIn { from { transform: rotateX(90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .rmeta { color: var(--dim); padding-left: 2ch; font-size: .92em; }
  .rmeta .ok { color: var(--ok); }
  #menu { padding-left: 2ch; }
  #menu .mi { display: grid; grid-template-columns: var(--w, 20ch) minmax(0, 1fr); column-gap: 2ch; cursor: pointer; }
  #menu .mi > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu .mi.sel { color: var(--sugg); }
  #menu .mi:not(.sel) .md2 { color: var(--dim); }
  #menu .short { display: grid; grid-template-columns: repeat(3, max-content); column-gap: 4ch; color: var(--dim); }
  @media (max-width: 760px) { #menu .short { grid-template-columns: max-content; } #menu .mi { grid-template-columns: minmax(0, 14ch) minmax(0, 1fr); } }
  #panel { border: 1px solid var(--pborder); border-radius: 6px; padding: calc(var(--lh) * .3em) 1ch; }
  #panel .pt { font-weight: 700; } #panel .pd { color: var(--dim); white-space: normal; }
  #panel .po { display: grid; grid-template-columns: 2ch minmax(0, 1fr); cursor: pointer; }
  #panel .po.sel { color: var(--sugg); }
  #panel .po .pn { display: grid; grid-template-columns: var(--w, 24ch) minmax(0, 1fr); column-gap: 2ch; }
  #panel .po .pn > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .po:not(.sel) .pdsc { color: var(--dim); }
  #panel .po .ck { color: var(--ok); }
  #panelHint { color: var(--dim); padding-left: 1ch; }
  [hidden] { display: none !important; }

  /* ================= fullscreen / focus ================= */
  body.zen #tbar { margin-top: -29px; opacity: 0; pointer-events: none; }
  body.zen #desk { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background: var(--bg); }
  body.zen #win { border-radius: 0; box-shadow: none; }
  #reveal { position: fixed; left: 0; right: 0; top: 0; height: 12px; z-index: 30; display: none; }
  body.zen #reveal { display: block; }
  body.zen.peek #tbar { margin-top: 0; opacity: 1; pointer-events: auto; }

  /* ================= svetainės peržiūra (Safari langas) ================= */
  #viewer { position: fixed; inset: 0; z-index: 90; display: flex; background: rgba(0,0,0,.35);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #vwin { flex: 1; display: flex; flex-direction: column; background: #fff; overflow: hidden; min-width: 0; }
  @media (min-width: 1000px) and (min-height: 620px) and (hover: hover) {
    #viewer { padding: 54px max(70px, calc((100vw - 1180px) / 2)); }
    #vwin { border-radius: 10px; box-shadow: 0 0 0 .5px rgba(0,0,0,.85), 0 22px 70px rgba(0,0,0,.6); }
  }
  #vbar { position: relative; flex: 0 0 auto; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--tbar); border-bottom: 1px solid var(--tbar-edge); }
  #vbar .lights { left: 14px; }

  const system = () => {
    const today = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return `You are Claude, chatting inside a Claude Code style terminal in the browser${who.name ? ` used by ${who.name}` : ''}. Today is ${today}.
Rules:

  };

  const TLDS = 'com|org|net|io|dev|ai|app|co|lt|eu|uk|de|me|info|edu|gov|tv|gg|so|sh|xyz';
  const URL_SRC = String.raw`(?:https?:\/\/|www\.)[^\s<>"'\x60]+|[a-z\d][a-z\d-]*(?:\.[a-z\d-]+)*\.(?:${TLDS})\b(?:\/[^\s<>"'\x60]*)?`;
  const INLINE_RE = new RegExp(String.raw`\x60([^\x60\n]+)\x60` +
    String.raw`|\[([^\]\n]+)\]\(\s*((?:https?:\/\/|www\.)[^\s()]*(?:\([^\s()]*\)[^\s()]*)*)\s*\)` +
    String.raw`|\*\*(?=\S)([^*\n]*?\S)\*\*` +
    String.raw`|(?<![\w*])\*(?=\S)([^*\n]*?\S)\*(?![\w*])` +
    String.raw`|(?<![@\w.\/-])(` + URL_SRC + ')', 'gi');
  const LINK_RE = new RegExp(String.raw`(?<![@\w.\/-])(` + URL_SRC + ')', 'gi');
  const isUrl = s => /^(https?:\/\/|www\.)\S+$/i.test(s);
  function href(u) {
    if (!/^[a-z][a-z\d+.-]*:\/\//i.test(u)) u = 'https://' + u;
    try {
      const x = new URL(u);
      if (!/^https?:$/.test(x.protocol) || !(x.hostname.includes('.') || x.hostname === 'localhost')) return null;

  function trimUrl(u) {
    let tail = '';
    while (/[.,;:!?)\]}*_]$/.test(u)) {
      const c = u.slice(-1);
      if (c === ')' && (u.match(/\(/g) || []).length >= (u.match(/\)/g) || []).length) break;

  function inline(t) {
    t = String(t); let o = '', last = 0;
    for (const m of t.matchAll(INLINE_RE)) {

        flush(); const q = [];
        while (i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, ''));
        html += `<blockquote>${md(q.join('\n'))}</blockquote>`; continue;
      }
      if (/^\s*\|.*\|\s*$/.test(l)) {
        flush(); const rows = [];
        while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(L[i++]);
        html += table(rows); continue;
      }
      if (/^\s*([-*+•]|\d{1,3}[.)])\s+/.test(l)) {
        flush(); let items = '';
        while (i < L.length) {
          const li = L[i].match(/^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/);
          if (li) {
            const lvl = Math.min(3, Math.floor(li[1].replace(/\t/g, '  ').length / 2));
            const mk = /\d/.test(li[2]) ? li[2].replace(')', '.') : '-';
            items += `<div class="li" style="--i:${lvl}"><span>${esc(mk)}</span><span class="lc">${inline(li[3])}</span></div>`; i++;
          } else if (/^\s{2,}\S/.test(L[i]) && items) {

  // ================= atmintis (paskyroje, kitaip įrenginyje) =================
  const Mem = {
    db: null, uid: null, mode: 'off', q: {},
    async init(use) {
      if (use) {
        try {
          const [db, user] = await Promise.all([use('db').catch(() => null), use('user').catch(() => null)]);
          if (user) {
            const me = await user.me();
            const first = String(me.name || '').trim().split(/\s+/)[0];
            who.name = first || (me.isOwner ? 'Matas' : '');
            who.handle = (who.name || 'guest').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '') || 'guest';
          }
          const id = user ? await user.id() : null;
          if (db && id) { this.db = db; this.uid = id; this.mode = 'cloud'; return; }
        } catch (e) {}
      }
      try { localStorage.setItem('ct.probe', '1'); localStorage.removeItem('ct.probe'); this.mode = 'device'; } catch (e) { this.mode = 'off'; }
    },
    ref(name) { return this.db.doc(`data/users/${this.uid}/${name}`); },
    key(name) { return 'ct.' + (this.uid ? this.uid + '.' : '') + name; },
    async load(name) {
      if (this.mode === 'cloud') { try { const s = await this.ref(name).get(); if (s.exists) return s.data(); } catch (e) {} }
      try { const v = localStorage.getItem(this.key(name)); return v ? JSON.parse(v) : null; } catch (e) { return null; }
    },
    save(name, data) {
      try { localStorage.setItem(this.key(name), JSON.stringify(data)); } catch (e) {}
      if (this.mode !== 'cloud') return Promise.resolve();
      this.q[name] = (this.q[name] || Promise.resolve()).then(() => this.ref(name).set(data)).catch(e => {
        if (e && e.code === 'quota_exceeded') notify('Memory is full · /clear to start over');
      });
      return this.q[name];
    },
    del(name) {
      try { localStorage.removeItem(this.key(name)); } catch (e) {}
      if (this.mode === 'cloud') this.q[name] = (this.q[name] || Promise.resolve()).then(() => this.ref(name).delete()).catch(() => {});
    },
  };
  function saveChat() {
    let msgs = history.slice();
    while (msgs.length > 2 && bytes(JSON.stringify(msgs)) > MAX_BYTES) msgs.splice(0, 2);
    if (msgs.length !== history.length) history = msgs;
    return Mem.save('chat', { messages: msgs, summary, updated: Date.now() });
  }
  const saveSettings = () => Mem.save('settings', { ...settings });
  const saveNotes = () => Mem.save('memory', { notes });
  const saveFiles = () => Mem.save('files', { files });
  const saveConvs = () => Mem.save('convs', { list: convs });

  // ================= svetainės / failai =================
  const siteSrc = new Map();   // id -> { src, title }
  const isHtml = (lang, body) => /^(html?|xhtml)$/i.test(lang) || (!lang && /^\s*(<!doctype html|<html)/i.test(body));
  function siteId(src) { let h = 2166136261; for (let i = 0; i < src.length; i++) { h ^= src.charCodeAt(i); h = Math.imul(h, 16777619); } return 's-' + (h >>> 0).toString(36) + src.length.toString(36); }
  const siteTitle = src => { const m = src.match(/<title[^>]*>([^<]{1,80})<\/title>/i); return m ? m[1].trim().replace(/&amp;/g, '&') || 'Website' : 'Website'; };
  const siteUrl = id => ARTIFACT_URL + '#' + id;
  const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 32) || 'index';
  function fileName(p) {
    let n = (p.name || '').replace(/^.*[\\/]/, '').replace(/[^\w.-]/g, '');
    if (!n) n = slug(siteTitle(p.src)) + '.html';
    if (!/\.html?$/i.test(n)) n += '.html';
    return n.slice(0, 48);
  }
  async function putSite(id, src, title) {
    siteSrc.set(id, { src, title });
    if (Mem.mode === 'cloud') {
      if (bytes(src) > 240000) return;
      try { const ref = Mem.db.doc('sites/' + id); const d = await ref.get(); if (!d.exists) await ref.set({ html: src, title, created: Date.now() }); } catch (e) {}
    } else { try { localStorage.setItem('ct.site.' + id, JSON.stringify({ src, title })); } catch (e) {} }
  }
  async function getSite(id) {
    if (siteSrc.has(id)) return siteSrc.get(id);
    if (Mem.mode === 'cloud') {
      try { const d = await Mem.db.doc('sites/' + id).get(); if (d.exists) { const v = d.data(); const s = { src: v.html, title: v.title || 'Website' }; siteSrc.set(id, s); return s; } } catch (e) {}
    }
    try { const v = JSON.parse(localStorage.getItem('ct.site.' + id) || 'null'); if (v) { siteSrc.set(id, v); return v; } } catch (e) {}
    return null;
  }
  // atsakymą dalinam į tekstą ir HTML failus (failai rodomi kaip Write(...) įrankis)
  function splitAnswer(text) {
    const L = String(text).replace(/\r\n?/g, '\n').split('\n'), parts = []; let buf = [];
    const flush = () => { if (buf.join('').trim()) parts.push({ t: 'text', s: buf.join('\n') }); buf = []; };
    for (let i = 0; i < L.length; i++) {
      const m = L[i].match(/^\s*(```|~~~)\s*([\w+#.-]*)\s*([^\s`]*)\s*$/);
      if (!m) { buf.push(L[i]); continue; }
      const closeRe = new RegExp('^\\s*' + m[1] + '\\s*$'), body = []; let j = i + 1;
      while (j < L.length && !closeRe.test(L[j])) body.push(L[j++]);
      const src = body.join('\n'), closed = j < L.length;
      if (isHtml(m[2], src) && src.trim()) { flush(); parts.push({ t: 'site', src, name: m[3] || '', closed }); }
      else { buf.push(L[i], ...body); if (closed) buf.push(L[j]); }
      i = j;
    }
    flush(); return parts;
  }
  function diffCount(a, b) {
    const count = s => { const m = new Map(); s.split('\n').forEach(l => m.set(l, (m.get(l) || 0) + 1)); return m; };
    const A = count(a), B = count(b); let add = 0, del = 0;
    B.forEach((n, l) => { add += Math.max(0, n - (A.get(l) || 0)); });
    A.forEach((n, l) => { del += Math.max(0, n - (B.get(l) || 0)); });
    return [add, del];
  }
  const plural = (n, w) => `<span class="b">${n}</span> ${w}${n === 1 ? '' : 's'}`;
  function toolHtml(p, live, op) {
    const lines = p.src.split('\n').length;
    if (live && !p.closed) {
      return `<div class="blk msg tool"><span class="dot run"></span><div class="mc"><span class="b">Write</span>(${esc(fileName(p))})<div class="res">Writing… ${lines} lines</div></div></div>`;
    }
    const id = siteId(p.src), title = siteTitle(p.src), name = (op && op.name) || fileName(p);
    if (!siteSrc.has(id)) siteSrc.set(id, { src: p.src, title });
    const kind = (op && op.kind) || 'Write';
    const head = kind === 'Update'
      ? `Updated <span class="b">${esc(name)}</span>` + (op.add != null ? ` with ${plural(op.add, 'addition')} and ${plural(op.del, 'removal')}` : '')
      : `Wrote <span class="b">${lines}</span> lines to <span class="b">${esc(name)}</span>`;
    const L = p.src.split('\n'), first = L.slice(0, 4).join('\n');
    const link = Mem.mode === 'cloud' ? ` · <a href="${esc(siteUrl(id))}" target="_blank" rel="noopener noreferrer">Link ↗</a> · <button class="act" type="button" data-url="${esc(siteUrl(id))}">Copy link</button>` : '';
    return `<div class="blk msg tool" data-sid="${id}"><span class="dot ${p.closed ? 'ok' : 'bad'}"></span><div class="mc"><span class="b">${kind}</span>(${esc(name)})` +
      `<div class="res">${head}${p.closed ? '' : ' <span class="err">· cut off, ask for a shorter version</span>'}</div>` +
      `<div class="prev">${hl(first, 'html')}</div>` + (L.length > 4 ? `<div class="more" role="button" tabindex="0">… +${L.length - 4} lines (${KEYS ? 'ctrl+o' : 'tap'} to expand)</div>` : '') +
      `<div class="full">${hl(p.src, 'html')}</div>` +
      `<div class="acts"><button class="act" type="button" data-open="${id}">Open ${esc(name)}</button>${link}</div></div></div>`;
  }
  function answerHtml(text, live, ops) {
    let k = 0;
    return splitAnswer(text).map(p => p.t === 'text'
      ? `<div class="blk msg"><span class="dot"></span><div class="mc md">${md(p.s)}</div></div>`
      : toolHtml(p, live, ops && ops[k++])).join('');
  }
  // baigus atsakymą: failai įrašomi į virtualų katalogą, Write/Update nustatomas vieną kartą ir saugomas istorijoje
  async function commitFiles(text) {
    const ops = [];
    for (const p of splitAnswer(text).filter(p => p.t === 'site')) {
      const id = siteId(p.src), name = fileName(p), title = siteTitle(p.src), prev = files[name];
      let op = { name, kind: 'Write' };

        const old = await getSite(prev.id);
        op = { name, kind: 'Update' };

      }
      files[name] = { id, lines: p.src.split('\n').length, bytes: bytes(p.src), t: Date.now(), title };
      putSite(id, p.src, title);

    }
    if (ops.length) saveFiles();
    return ops;
  }
  function ensureSites(root) {
    if (Mem.mode !== 'cloud') return;

  }

  // ================= logotipas: Clawd iš ketvirtinių blokų ▐▛███▜▌ =================
  const CLAWD = [' ▐▛███▜▌', '▝▜█████▛▘', '  ▘▘ ▝▝'];
  const QB = { '▘': 1, '▝': 2, '▖': 4, '▗': 8, '▌': 5, '▐': 10, '▀': 3, '▄': 12, '▛': 7, '▜': 11, '▙': 13, '▟': 14, '█': 15, '▚': 9, '▞': 6 };
  const CLAWD_SVG = (() => {
    let r = '';
    CLAWD.forEach((row, y) => [...row].forEach((ch, x) => {
      const b = QB[ch] || 0;
      [[1, 0, 0], [2, 1, 0], [4, 0, 1], [8, 1, 1]].forEach(([bit, dx, dy]) => { if (b & bit) r += `<rect x="${x * 2 + dx}" y="${y * 2 + dy}" width="1.02" height="1.02"/>`; });
    }));
    r += '<rect class="lid" x="5" y="1" width="1.02" height="1.02"/><rect class="lid" x="12" y="1" width="1.02" height="1.02"/>';   // vokai užmerkia akis
    return `<svg class="clawd" viewBox="0 0 18 6" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
  })();

  // ================= ekranas =================
  function shellLine(cmd, cursor) {
    const last = prevSeen ? new Date(prevSeen) : new Date();

    return `<div class="shell">Last login: ${esc(d)} on ttys000\n<span class="pr">${esc(who.handle)}@MacBook-Pro ~ % </span><span class="cmd">${esc(cmd)}</span>${cursor ? '<span class="tcur"></span>' : ''}</div>`;
  }
  function welcome(opts) {
    const m = MODELS[settings.model];
    if (!(opts && opts.noShell)) add(shellLine('claude'), 'tight');
    const recent = convs.slice(0, 3).map(c => `<div><span class="dim">${esc(ago(c.t))}</span>  ${esc(c.title)}</div>`).join('') || '<div class="dim">No recent activity</div>';
    const wb = add(`<div class="wbox"><span class="wt">Claude Terminal v${VERSION}</span><div class="wcols">` +
      `<div class="wl"><div class="b">${who.name ? 'Welcome back ' + esc(who.name) + '!' : 'Welcome back!'}</div>${CLAWD_SVG}<div class="dim">${esc(m.name)} · Claude account</div><div class="dim">/Users/${esc(who.handle)}</div></div>` +
      `<div class="wr"><div class="wh">Tips for getting started</div><div>Ask for a website or game, then open it with one tap</div><div>Start a line with <span class="sug">#</span> to save it to memory</div><div>Type <span class="sug">/</span> for commands, <span class="sug">?</span> for shortcuts</div>` +
      `<div class="wsep"></div><div class="wh">Recent activity</div>${recent}</div></div></div>`, 'tight');

  // tikras paleidimas: zsh eilutėje įrašoma „claude“, tada nusipiešia pasisveikinimo dėžutė; bet koks klavišas ar bakstelėjimas praleidžia
  async function launch() {
    if (!MOTION || /^#s-/.test(location.hash)) return redraw();
    let skip = false; const sk = () => { skip = true; };
    addEventListener('keydown', sk, { once: true, capture: true }); addEventListener('pointerdown', sk, { once: true, capture: true });
    document.body.classList.add('booting'); quiet = true; out.innerHTML = '';
    const sh = add(shellLine('', true), 'tight'), cmd = sh.querySelector('.cmd');
    if (!skip) await sleep(320);
    for (const ch of 'claude') { cmd.textContent += ch; if (!skip) await sleep(60 + Math.random() * 55); }
    if (!skip) await sleep(260);

    quiet = false; toBottom();

  }
  function fitWelcome(el) { if (el) el.classList.toggle('narrow', cols() < 76); }
  function renderTurn(msg) {
    if (msg.r === 'u') add(`<span class="gt">&gt;</span>${linkify(msg.c)}`, 'user');

  }
  // po kiekvienu atsakymu: kuris modelis atsakė (✓ = patvirtino Claude platforma), kiek truko ir kiek žetonų
  function replyMeta(msg) {

  // ================= apačia: režimai ir pranešimai =================

  let menu = null;   // { kind, items, idx }

  function shell(cmdline) {
    const [cmd, ...args] = cmdline.trim().split(/\s+/);
    const names = Object.keys(files).sort();
    const say = h => res(h);
    switch (cmd) {
      case 'ls': {
        if (!names.length) return say('<span class="dim">(empty)</span>');
        if (args.includes('-l') || args.includes('-la') || args.includes('-al')) return say(names.map(n => { const f = files[n]; return `-rw-r--r--  1 ${esc(who.handle)}  staff  ${String(f.bytes).padStart(7)} ${new Date(f.t).toLocaleString('en-US', { month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(',', '')} ${esc(n)}`; }).join('\n'));
        return say(names.map(esc).join('  '));
      }
      case 'pwd': return say('/Users/' + esc(who.handle));
      case 'whoami': return say(esc(who.handle));
      case 'date': return say(esc(new Date().toString().replace(/ GMT.*$/, '')));
      case 'echo': return say(esc(args.join(' ')));
      case 'clear': out.innerHTML = ''; return;
      case 'cat': case 'open': case 'rm': {
        const n = args[0];
        if (!n) return say(`<span class="err">usage: ${cmd} &lt;file&gt;</span>`);
        if (cmd === 'open' && href(n) && !files[n]) return say(`<a href="${esc(href(n))}" target="_blank" rel="noopener noreferrer" class="sug">${esc(href(n))}</a>`);
        if (!files[n]) return say(`<span class="err">${cmd}: ${esc(n)}: No such file or directory</span>`);
        if (cmd === 'rm') { delete files[n]; saveFiles(); return; }
        if (cmd === 'open') { getSite(files[n].id).then(s => s ? openSite(files[n].id, s.src, n) : say('<span class="err">open: file content is not available</span>')); return; }
        getSite(files[n].id).then(s => {
          if (!s) return say('<span class="err">cat: file content is not available</span>');
          const L = s.src.split('\n');
          say(`<div class="md"><pre><code>${hl(L.slice(0, 40).join('\n'), 'html')}</code></pre></div>` + (L.length > 40 ? `<span class="dim">… +${L.length - 40} lines</span>` : ''));
        });
        return;
      }

    };

    $('fsBtn').title = on || wantFull ? 'Exit Full Screen' : 'Enter Full Screen';
    if (on && TOUCH && hwKeys) { setCapture(true); notify('Full screen · just start typing'); }
    if (!on) { setCapture(false); if (!wantFull) focusIn(); }
    if (on || !wantFull) return;
    if (TOUCH && (document.activeElement === input || Date.now() - lastFocus < 1500)) fsDropped = true;
    else exitFull();
  }
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, onFsChange));
  ['fullscreenerror', 'webkitfullscreenerror'].forEach(ev => document.addEventListener(ev, () => flog('full screen error event')));
  input.addEventListener('focus', () => { if (wantFull) flog('text field focused'); });
  document.addEventListener('visibilitychange', () => { if (wantFull) flog('page ' + document.visibilityState); });
  document.addEventListener('click', e => {
    if (!fsDropped || !wantFull || isNativeFS() || document.activeElement === input || e.target.closest('#pa, button, a, #viewer')) return;
    fsDropped = false; requestNative();
  }, true);
  $('fsBtn').onclick = toggleFull;
  $('tbar').addEventListener('dblclick', e => { if (!e.target.closest('.lights')) toggleFull(); });   // kaip macOS: dvigubas paspaudimas antraštėje
  // neaktyvus langas: pilki šviesoforai (tik po tikro fokuso praradimo)
  addEventListener('blur', () => { if (!$('viewer').hidden) return; document.body.classList.add('inactive'); });
  addEventListener('focus', () => document.body.classList.remove('inactive'));
  document.addEventListener('pointerdown', () => document.body.classList.remove('inactive'), true);
  let peekT;
  const peek = () => { document.body.classList.add('peek'); clearTimeout(peekT); peekT = setTimeout(() => document.body.classList.remove('peek'), 3500); };
  $('reveal').addEventListener('mouseenter', peek); $('reveal').addEventListener('click', peek);
  $('tbar').addEventListener('mouseleave', () => { if (document.body.classList.contains('peek')) { clearTimeout(peekT); peekT = setTimeout(() => document.body.classList.remove('peek'), 800); } });

  // ================= tema, dydis =================
  const THEMES = { dark: 'Claude Dark', light: 'Claude Light', pro: 'Pro', homebrew: 'Homebrew', ocean: 'Ocean', solarized: 'Solarized Dark' };
  function applyTheme(t) { root.dataset.theme = THEMES[t || settings.theme] ? (t || settings.theme) : 'dark'; }
  let wasBottom = true;
  term.addEventListener('scroll', () => { wasBottom = nearBottom(); }, { passive: true });
  const onResize = () => { measure(); setTitle(); if (wasBottom) toBottom(); };
  addEventListener('resize', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

  // ================= paleidimas =================
  async function getUse() { return window.claude && typeof window.claude.use === 'function' ? n => window.claude.use(n) : null; }
  const usePromise = getUse();
  samplePromise = usePromise.then(use => use ? use('sample') : null).catch(() => null).then(s => { sample = s; return s; });
  const ready = (async () => {
    const use = await usePromise;
    await Mem.init(use);
    const [s, c, mem, cv, fl] = await Promise.all(['settings', 'chat', 'memory', 'convs', 'files'].map(n => Mem.load(n)));
    if (s) {
      if (MODELS[s.model]) settings.model = s.model;
      settings.thinking = typeof s.thinking === 'boolean' ? s.thinking : s.effort === 'high';
      if (THEMES[s.theme]) settings.theme = s.theme;
      if (s.lastSeen) prevSeen = s.lastSeen;
    }
    if (c && Array.isArray(c.messages)) history = c.messages.filter(x => x && (x.r === 'u' || x.r === 'a') && typeof x.c === 'string' && x.c).concat(history);
    if (c && typeof c.summary === 'string') summary = c.summary;
    if (mem && Array.isArray(mem.notes)) notes = mem.notes.filter(n => n && typeof n.text === 'string');
    if (cv && Array.isArray(cv.list)) convs = cv.list;
    if (fl && fl.files && typeof fl.files === 'object') files = fl.files;
    const la = [...history].reverse().find(x => x.r === 'a' && x.m);
    if (la) lastReply = { name: la.m, ok: la.v !== undefined ? la.v : Object.values(MODELS).some(m => m.name === la.m), req: la.q || la.m };
  })().catch(() => {});
  out.addEventListener('click', e => {
    const c = e.target.closest('.clawd'); if (!c) return;
    c.classList.remove('hop'); void c.getBoundingClientRect(); c.classList.add('hop');
  });
  (async () => {
    $('win').classList.add('opening'); setTimeout(() => $('win').classList.remove('opening'), 600);
    applyTheme(); measure(); setMode('normal');
    input.disabled = true;
    await Promise.race([ready, sleep(1500)]);
    applyTheme(); measure(); setTitle(); await launch();
    input.disabled = false; renderFoot(); focusIn(); drawCursor();
    settings.lastSeen = Date.now(); saveSettings();
    await ready; openFromHash();
  })();
})();
</script>
</body>
</html>
